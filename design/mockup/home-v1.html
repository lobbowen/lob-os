<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#e9edf1; color:#1a1a1a; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif; }
  .stage { padding:30px; display:flex; gap:36px; align-items:flex-start; flex-wrap:wrap; }
  .phone { width:430px; height:932px; background:#f2f4f7; border-radius:44px; padding:11px; box-shadow:0 10px 34px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.06); }
  .scr { width:100%; height:100%; background:#f2f4f7; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .cap { font-size:12px; color:#555; margin-bottom:9px; font-weight:600; }

  /* 状态栏 */
  .stat { height:50px; padding:0 26px; display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:650; flex-shrink:0; }
  .stat .r { display:flex; align-items:center; gap:5px; font-size:12px; }

  /* 核心状态区 */
  .core { margin:4px 16px 0; height:330px; border-radius:20px; overflow:hidden; position:relative; flex-shrink:0;
    background:linear-gradient(150deg,#0d1b3e 0%,#123a8f 45%,#0a2059 100%); color:#fff; }
  .core::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 78% 22%,rgba(90,170,255,.35),transparent 42%),
               radial-gradient(circle at 20% 90%,rgba(0,100,255,.25),transparent 50%); }
  .gridbg { position:absolute; inset:0; opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:28px 28px; }
  .logo { position:absolute; top:26px; left:24px; display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#8ec5ff,#3f7bff); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#06163b; }
  .logo-txt { font-size:12px; font-weight:700; letter-spacing:.14em; }
  .core-top { position:absolute; top:26px; right:22px; display:flex; align-items:center; gap:8px; }
  .on { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); padding:7px 12px; border-radius:20px; font-size:11px; font-weight:600; }
  .on .d { width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.2); }
  .power { width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .core-main { position:absolute; top:88px; left:24px; }
  .core-label { font-size:12px; color:rgba(255,255,255,.6); letter-spacing:.05em; }
  .core-state { font-size:38px; font-weight:600; letter-spacing:-.035em; margin-top:6px; }
  .core-desc { font-size:12px; color:rgba(255,255,255,.62); margin-top:8px; }
  .metrics { position:absolute; left:0; right:0; bottom:0; height:112px; background:rgba(0,0,0,.2); backdrop-filter:blur(8px);
    display:flex; align-items:center; padding:0 20px; border-top:1px solid rgba(255,255,255,.12); }
  .metric { flex:1; text-align:center; }
  .metric + .metric { border-left:1px solid rgba(255,255,255,.14); }
  .mv { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ml { font-size:10px; color:rgba(255,255,255,.55); margin-top:6px; }
  .spark { position:absolute; right:0; top:0; width:100%; height:100%; opacity:.5; }

  /* 功能入口 */
  .func { margin:14px 16px 0; background:#fff; border-radius:18px; height:112px; display:flex; align-items:center; padding:10px 4px; flex-shrink:0; }
  .f { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .f .fi { width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .f .fl { font-size:13px; color:#1c1c1e; font-weight:500; }

  /* 快速启动 */
  .quick { padding:0 16px; flex:1; }
  .qhead { display:flex; align-items:center; justify-content:space-between; margin:20px 2px 14px; }
  .qt { font-size:22px; font-weight:650; letter-spacing:-.02em; }
  .qmanage { background:#e4e8ec; color:#3a3a3c; font-size:12px; font-weight:600; padding:8px 13px; border-radius:18px; }
  .apps { display:flex; gap:18px; }
  .app { width:76px; }
  .aico { width:70px; height:70px; border-radius:17px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#fff; margin-bottom:10px; }
  .a1 { background:linear-gradient(135deg,#5b9dff,#2c6be0); }
  .a2 { background:linear-gradient(135deg,#4ad0a0,#1a9d73); }
  .a3 { background:linear-gradient(135deg,#a78bfa,#7349d6); }
  .a4 { background:linear-gradient(135deg,#ffb35c,#e8892f); }
  .aadd { background:#e4e8ec; color:#8e8e93; font-size:38px; font-weight:300; }
  .an { font-size:13px; text-align:center; color:#2a2a2c; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qhint { font-size:11px; color:#9a9a9e; margin:18px 2px 0; }
</style>
</head>
<body>
<div class="stage">
<div>
<div class="cap">第一屏 · 按你描述的结构（无顶部标题栏 / 核心状态区 / 5 功能入口 / 快速启动）</div>
<div class="phone"><div class="scr">

  <div class="stat"><span>17:21</span><span class="r">◷ 蓝 5G 5G ▂ 43</span></div>

  <!-- ① 核心状态区：Logo + 运行状态 + 内存等指标 + 开关机 -->
  <div class="core">
    <div class="gridbg"></div>
    <div class="logo"><div class="logo-mark">L</div><span class="logo-txt">LOBOS</span></div>
    <div class="core-top">
      <div class="on"><span class="d"></span>在线</div>
      <div class="power">⏻</div>
    </div>
    <div class="core-main">
      <div class="core-label">系统状态</div>
      <div class="core-state">运行中</div>
      <div class="core-desc">控制面在线 · 已稳定运行 6h 12m</div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="mv">12%</div><div class="ml">内存占用</div></div>
      <div class="metric"><div class="mv">3</div><div class="ml">运行时版本</div></div>
      <div class="metric"><div class="mv">10</div><div class="ml">已装组件</div></div>
      <div class="metric"><div class="mv">0</div><div class="ml">活跃实例</div></div>
    </div>
  </div>

  <!-- ② 功能入口 -->
  <div class="func">
    <div class="f"><div class="fi">›_</div><div class="fl">终端</div></div>
    <div class="f"><div class="fi">▦</div><div class="fl">组件</div></div>
    <div class="f"><div class="fi">◫</div><div class="fl">空间</div></div>
    <div class="f"><div class="fi">⊞</div><div class="fl">应用</div></div>
    <div class="f"><div class="fi">⋯</div><div class="fl">更多</div></div>
  </div>

  <!-- ③ 快速启动 -->
  <div class="quick">
    <div class="qhead"><span class="qt">快速启动</span><span class="qmanage">管理</span></div>
    <div class="apps">
      <div class="app"><div class="aico a1">Py</div><div class="an">Python</div></div>
      <div class="app"><div class="aico a2">Js</div><div class="an">Node.js</div></div>
      <div class="app"><div class="aico a3">Ag</div><div class="an">Agent App</div></div>
      <div class="app"><div class="aico aadd">+</div><div class="an">添加</div></div>
    </div>
    <div class="qhint">轻点图标直接启动 · 长按可管理或移除</div>
  </div>

</div></div>
</div>
</div>
</body>
</html>
