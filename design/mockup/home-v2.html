<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LobOS 首页设计稿 v4（标准尺寸）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#111318;--muted:#5F6773;--blue:#0B6BCB;--green:#1B7F4B;
  --bg:#f7f8fa;--card:#fff;--soft:#f2f4f7;--line:#e6e9ee;
}
body{background:#e9edf3;display:flex;gap:28px;justify-content:center;padding:24px;
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
/* 标准 Android phone 逻辑视口 360x800 dp */
.phone{width:360px;height:800px;background:var(--bg);border-radius:36px;
  box-shadow:0 18px 50px rgba(17,19,24,.18);position:relative;overflow:hidden}
.statusbar{height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:11px;font-weight:600;color:var(--ink)}
.statusbar .icons{font-size:9px;color:var(--muted)}
.screen{height:calc(100% - 32px - 88px);overflow:auto;padding:6px 16px 16px}

/* 顶部运行状态：运行时间(大字)+版本(小字)同排, 时长在下方, 绿点徽标右上 */
.hero{padding:8px 4px 14px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ot-left{display:flex;align-items:baseline;gap:8px;min-width:0}
.ot-title{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.ot-ver{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbadge{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;
  border-radius:18px;padding:6px 10px;flex-shrink:0}
.runbadge .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.runbadge .txt{font-size:11px;font-weight:500}
.ot-total{font-size:34px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.1;letter-spacing:-.5px}
/* 系统概况数值区：无标题, 直接状态栏四宫格 */
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.ov{background:var(--soft);border-radius:12px;padding:9px 4px;text-align:center}
.ov .v{font-size:14px;font-weight:700;color:var(--ink);line-height:1.2}
.ov .l{font-size:9px;color:var(--muted);margin-top:4px}

/* 快速启动 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 10px}
.qhead .t{font-size:14px;font-weight:600;color:var(--ink)}
.qhead .s{font-size:10px;color:var(--muted)}
.quick{background:var(--card);border-radius:20px;padding:14px;min-height:104px;
  box-shadow:0 6px 18px rgba(17,19,24,.06);border:1px dashed #cbd2dc;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.quick .plus{width:38px;height:38px;border-radius:50%;background:var(--soft);
  color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300}
.quick .q1{font-size:12px;color:var(--ink);margin-top:8px;font-weight:500}
.quick .q2{font-size:10px;color:#98a0aa;margin-top:3px}

/* 底部胶囊导航 tray */
.navwrap{position:absolute;left:0;right:0;bottom:0;height:88px;
  background:linear-gradient(to top,var(--bg) 62%,rgba(247,248,250,0));
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px}
.nav{width:calc(100% - 24px);max-width:340px;height:60px;background:#fff;
  border-radius:30px;box-shadow:0 10px 26px rgba(17,19,24,.14),0 0 0 1px rgba(17,19,24,.04);
  display:flex;align-items:center;padding:6px;gap:2px}
.item{flex:1;height:48px;border-radius:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--muted);min-width:0}
.item .ic{font-size:16px;line-height:1}
.item .tx{font-size:10px;font-weight:500;white-space:nowrap}
.item.active{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(11,107,203,.25)}

.note{width:360px;font-size:11px;color:var(--muted);line-height:1.8}
.note h2{font-size:14px;color:var(--ink);margin-bottom:8px}
.chip{display:inline-block;background:#fff;border-radius:8px;padding:6px 9px;margin:0 5px 6px 0;
  font-size:10px;color:var(--muted);box-shadow:0 2px 8px rgba(17,19,24,.06)}
/* 自适应：窄屏缩小手机框内的 padding 与字号 */
@media(max-width:760px){body{flex-direction:column;align-items:center}.note{width:360px}}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>16:00</span><span class="icons">Bluetooth 5G 5G Wi-Fi 63</span></div>
  <div class="screen">
    <div class="hero">
      <div class="hero-top">
        <div class="ot-left">
          <div class="ot-title">运行时间</div>
          <div class="ot-ver">Ubuntu 24.04</div>
        </div>
        <div class="runbadge"><span class="dot"></span><span class="txt">运行</span></div>
      </div>
      <div class="ot-total">0h 08m</div>
    </div>

    <div class="overview">
      <div class="ov"><div class="v">69 MB</div><div class="l">内存占用</div></div>
      <div class="ov"><div class="v">18</div><div class="l">线程</div></div>
      <div class="ov"><div class="v">0</div><div class="l">活跃会话</div></div>
      <div class="ov"><div class="v">0</div><div class="l">应用程序</div></div>
    </div>

    <div class="qhead"><div class="t">快速启动</div><div class="s">添加应用后可一键启动</div></div>
    <div class="quick">
      <div class="plus">+</div>
      <div class="q1">还没有应用</div>
      <div class="q2">开发者社区的应用安装后会出现在这里</div>
    </div>
  </div>

  <div class="navwrap">
    <div class="nav">
      <div class="item active"><div class="ic">⌂</div><div class="tx">首页</div></div>
      <div class="item"><div class="ic">⌨</div><div class="tx">终端</div></div>
      <div class="item"><div class="ic">◫</div><div class="tx">空间</div></div>
      <div class="item"><div class="ic">▦</div><div class="tx">应用</div></div>
      <div class="item"><div class="ic">•••</div><div class="tx">更多</div></div>
    </div>
  </div>
</div>

<div class="note">
  <h2>v4 调整</h2>
  <div class="chip">标准视口 360x800dp</div>
  <div class="chip">系统概况去标题、保留四宫格</div>
  <div class="chip">状态栏下接概况数值再快速启动</div>
  <div class="chip">标题/字号整体缩小</div>
  <div class="chip">百分比宽度 + @media 自适应</div>
  <p style="margin-top:10px">运行时间(20) + 版本(11) 同排，时长(34) 下方，绿点运行徽标右上。仅设计稿，不改产品代码。</p>
</div>
</body>
</html>
