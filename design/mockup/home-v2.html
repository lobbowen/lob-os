<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#e9edf1; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif; }
  .stage { padding:30px; display:flex; gap:34px; flex-wrap:wrap; }
  .col { width:430px; }
  .cap { font-size:12px; color:#555; margin-bottom:9px; font-weight:600; }
  .phone { width:430px; height:920px; background:#eef1f4; border-radius:44px; padding:11px; box-shadow:0 10px 34px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.06); }
  .scr { width:100%; height:100%; background:#eef1f4; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; }

  .stat { height:50px; padding:0 26px; display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:650; flex-shrink:0; }
  .stat .r { font-size:12px; letter-spacing:1px; }

  /* 整体面板：状态区 + 功能入口 融合为一个连续块 */
  .panel { margin:2px 16px 0; border-radius:24px; overflow:hidden; flex-shrink:0; color:#fff;
    background:linear-gradient(155deg,#0e1c40 0%,#153a86 48%,#0b2359 100%); position:relative; }
  .panel::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 82% 16%,rgba(96,170,255,.38),transparent 42%),
               radial-gradient(circle at 12% 96%,rgba(0,110,255,.22),transparent 46%); }
  .gridbg { position:absolute; inset:0; opacity:.13;
    background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);
    background-size:30px 30px; }
  .panel-in { position:relative; padding:22px 22px 0; }

  .phead { display:flex; justify-content:space-between; align-items:center; }
  .logo { display:flex; align-items:center; gap:9px; }
  .mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#a7d2ff,#4d8dff); color:#08183f; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .brand { font-size:12px; font-weight:700; letter-spacing:.16em; }
  .phead-r { display:flex; align-items:center; gap:8px; }
  .on { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.18); padding:7px 13px; border-radius:20px; font-size:11px; font-weight:600; }
  .on i { width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.2); }
  .pw { width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:13px; }

  .state { margin-top:26px; }
  .slabel { font-size:11px; color:rgba(255,255,255,.6); letter-spacing:.08em; }
  .sbig { font-size:40px; font-weight:600; letter-spacing:-.04em; margin-top:5px; }
  .sdesc { font-size:12px; color:rgba(255,255,255,.62); margin-top:7px; }

  .metrics { display:flex; margin-top:22px; padding:16px 0 18px; border-top:1px solid rgba(255,255,255,.14); }
  .metric { flex:1; }
  .metric + .metric { border-left:1px solid rgba(255,255,255,.14); }
  .mv { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ml { font-size:10px; color:rgba(255,255,255,.55); margin-top:5px; }

  /* 功能入口：融入面板底部，用分隔线，不是独立卡片 */
  .funcs { display:flex; border-top:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.14); height:92px; align-items:center; }
  .f { flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .f .fi { width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .f .fl { font-size:12px; font-weight:500; }

  /* 快速启动：只有应用，现在为空 */
  .quick { padding:0 20px; flex:1; }
  .qhead { display:flex; align-items:center; justify-content:space-between; margin:22px 2px 0; }
  .qt { font-size:22px; font-weight:650; letter-spacing:-.02em; }
  .qsub { font-size:12px; color:#9a9a9e; margin-top:4px; }
  .qadd { background:#dfe4e9; color:#3a3a3c; font-size:12px; font-weight:600; padding:8px 14px; border-radius:18px; }
  .empty { margin-top:20px; height:180px; border:1.5px dashed #ccd3da; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,.35); }
  .empty .ei { width:52px; height:52px; border-radius:14px; background:#e2e7ec; color:#98a2ac; font-size:30px; font-weight:300; display:flex; align-items:center; justify-content:center; }
  .empty .et { font-size:14px; font-weight:600; color:#5b6470; }
  .empty .es { font-size:12px; color:#9aa3ad; }

  .note { margin:20px 6px 0; font-size:11px; color:#a2abb4; }
</style>
</head>
<body>
<div class="stage">
<div class="col">
<div class="cap">第一屏 · v2：状态区与功能入口合为一个整体面板；快速启动只放应用（当前为空）</div>
<div class="phone"><div class="scr">

  <div class="stat"><span>17:21</span><span class="r">◷ 蓝 5G 5G ▂ 43</span></div>

  <!-- 整体面板：核心状态 + 功能入口 -->
  <div class="panel">
    <div class="gridbg"></div>
    <div class="panel-in">
      <div class="phead">
        <div class="logo"><div class="mark">L</div><span class="brand">LOBOS</span></div>
        <div class="phead-r"><div class="on"><i></i>在线</div><div class="pw">⏻</div></div>
      </div>
      <div class="state">
        <div class="slabel">系统状态</div>
        <div class="sbig">运行中</div>
        <div class="sdesc">控制面在线 · 已稳定运行 6h 12m</div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="mv">12%</div><div class="ml">内存占用</div></div>
        <div class="metric"><div class="mv">3</div><div class="ml">运行时版本</div></div>
        <div class="metric"><div class="mv">10</div><div class="ml">已装组件</div></div>
        <div class="metric"><div class="mv">0</div><div class="ml">活跃实例</div></div>
      </div>
    </div>
    <!-- 功能入口在面板内 -->
    <div class="funcs">
      <div class="f"><div class="fi">›_</div><div class="fl">终端</div></div>
      <div class="f"><div class="fi">▦</div><div class="fl">组件</div></div>
      <div class="f"><div class="fi">◫</div><div class="fl">空间</div></div>
      <div class="f"><div class="fi">⊞</div><div class="fl">应用</div></div>
      <div class="f"><div class="fi">⋯</div><div class="fl">更多</div></div>
    </div>
  </div>

  <!-- 快速启动：只有应用 -->
  <div class="quick">
    <div class="qhead"><div><div class="qt">快速启动</div><div class="qsub">添加应用后，可在这里直接启动</div></div><span class="qadd">+ 添加应用</span></div>
    <div class="empty">
      <div class="ei">+</div>
      <div class="et">还没有应用</div>
      <div class="es">开发者社区的应用安装后会出现在这里</div>
    </div>
    <div class="note">提示：Python / Node.js 等运行时在「组件」中管理，不属于快速启动。</div>
  </div>

</div></div>
</div>
</div>
</body>
</html>
