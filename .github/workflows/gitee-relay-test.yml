name: Gitee Relay Speed Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 测海外 CI git push 到 Gitee 速度
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "=== 克隆测试仓库 ==="
          git clone "https://bowen7778:${GITEE_TOKEN}@gitee.com/bowen7778/lobos-relay-test.git" /tmp/gitee-repo 2>&1 | tail -2
          cd /tmp/gitee-repo
          git config user.email "test@lobos.local"
          git config user.name "test"

          echo "=== 生成 20MB 测试文件 ==="
          dd if=/dev/urandom of=test-20m.bin bs=1M count=20 2>/dev/null
          ls -l test-20m.bin | awk '{print "  "$5" 字节"}'

          echo "=== git push 到 Gitee（计时）==="
          git add test-20m.bin
          git commit -q -m "speed test 20MB"
          START=$(date +%s)
          git push origin master 2>&1 | tail -3
          END=$(date +%s)
          echo "  push 耗时 $((END-START)) 秒"
