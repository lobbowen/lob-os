name: Build Component · python3（运行时筐）

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '只编某个槽位（留空编全部：python / python-3.12 / python-3.11）'
        required: false
        default: ''

concurrency:
  group: python3-${{ github.ref }}-${{ inputs.slot }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi


  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ inputs.slot != '' && fromJSON(format('["{0}"]', inputs.slot)) || fromJSON('["python","python-3.12","python-3.11"]') }}
    env:
      SLOT: ${{ matrix.slot }}
      BUILD_KEY: ${{ matrix.slot }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 恢复 NDK 缓存（由 ndk-cache job 备好；这里只取）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}
      - name: 取 NDK（命中则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh
      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh
      - name: 把宿主 CPython 放进 PATH（仅 python3 件真正需要）
        run: |
          set -uo pipefail
          WANT="$(bash scripts/toolchain/fetch-pinned.sh --src-version "$BUILD_KEY" 2>/dev/null || true)"
          WANT="${WANT%.*}"
          [ -n "$WANT" ] || exit 0
          for d in /opt/hostedtoolcache/Python/$WANT.*/x64/bin; do
            [ -d "$d" ] || continue
            echo "$d" >> "$GITHUB_PATH"
            echo "[python] 已把 $d 加入 PATH"
            exit 0
          done
          echo "::notice title=未找到宿主 python$WANT::用 setup-python 补装 $WANT"
      - name: 确保宿主 CPython $WANT 可用
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.slot == 'python' && '3.14' || (matrix.slot == 'python-3.12' && '3.12' || '3.11') }}
          allow-prereleases: true
      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          bash scripts/toolchain/piece-key.sh "$BUILD_KEY"
      - name: 已发布就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
             && gh release download "$TAG" --repo "${{ github.repository }}" \
                  --pattern "$ASSET" --dir dist >/dev/null 2>&1 \
             && [ -f "dist/$ASSET" ]; then
            echo "[ok] 预制品已存在，直接复用：$ASSET（tag=$TAG）"
            mv "dist/$ASSET" "dist/component-$BUILD_KEY.zip"
            [ -f "dist/$ASSET.sha256" ] && mv "dist/$ASSET.sha256" "dist/component-$BUILD_KEY.zip.sha256" || true
            rm -f "dist/component-$BUILD_KEY.zip"
            bash scripts/toolchain/unpack-piece.sh "dist/component-$BUILD_KEY.zip" dist
            ls -la dist/ | sed 's/^/  /'
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 恢复本件的编译中间产物（命中则增量编，不重跑 Configure）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            work/$BUILD_KEY
            dist/component-$BUILD_KEY.zip
          key: ${{ steps.uwkey.outputs.key }}
      - name: 产出 python3 件（仅在需要编时）
        if: steps.reuse.outputs.hit != 'yes'
        env:
          PY_SLOT: ${{ matrix.slot == 'python' && '' || (matrix.slot == 'python-3.12' && '3.12' || '3.11') }}
          PY_VERSION: ${{ matrix.slot == 'python' && '3.14.8' || (matrix.slot == 'python-3.12' && '3.12.10' || '3.11.13') }}
          OUT: dist/$BUILD_KEY
        run: bash scripts/recipes/build-component-python3.sh
      - name: 件形态校验（aarch64 动态件 / 解释器入口形状）
        env:
          OUT: dist/$BUILD_KEY
        run: bash scripts/verify/verify-component-artifact.sh "$BUILD_KEY"
      - name: 打包 + sha256
        env:
          OUT: dist/$BUILD_KEY
          PKG_NAME: python
        run: bash scripts/recipes/package-component.sh "$BUILD_KEY"
      - name: 存回编译中间产物（供下一轮增量编）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/$BUILD_KEY
            dist/component-$BUILD_KEY.zip
          key: ${{ steps.uwkey.outputs.key }}

      - name: 发布本件预制品到 Release（编过就留，后轮直接复用）
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          PW="work/pw-$BUILD_KEY"
          rm -rf "$PW" && mkdir -p "$PW"
          tar czf "$PW/$ASSET" -C dist --exclude '*.tar.gz' --exclude '*.version' --exclude 'SHA256SUMS' .
          ( cd "$PW" && sha256sum "$ASSET" > "$ASSET.sha256" )
          {
            echo "预制品：python3"
            echo "Release tag：$TAG"
            echo "NDK：$(bash scripts/toolchain/fetch-pinned.sh --ndk)"
            echo "NDK 内置 LLVM：$(bash scripts/toolchain/fetch-pinned.sh --llvm)"
            echo "API 级别：23"
            echo "缓存 key：${{ steps.uwkey.outputs.key }}"
            echo "构建 run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 这份预制品的编译依据"
            echo ""
            echo "下面这串是 cache-key.sh 算出来的，**含本件依赖的全部源码钉值**："
            echo "改动其中任一版本（或补丁 sha）都会换 tag，从而自动重新编译一次；"
            echo "没改动就直接复用本预制品。"
            echo ""
            echo '```'
            echo "${{ steps.uwkey.outputs.key }}"
            echo '```'
          } > "$PW/BUILD.md"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "component python3 — $TAG" \
              --notes "编译一次、长期复用的 python3 预制品。构建链优先复用本件，不再重复编译。BUILD.md 记录了这份预制品的编译依据。"
          fi
          gh release upload "$TAG" "$PW"/* --repo "${{ github.repository }}" --clobber
          echo "[ok] 已发布 $TAG"

      - name: 发布 python3 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/$BUILD_KEY/component-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/publish/upload-qiniu.js "$f" "component/$(basename "$f")" --cache-control=31536000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: component-$BUILD_KEY
          path: |
            dist/$BUILD_KEY/component-*.zip
            dist/component-$BUILD_KEY.zip
          retention-days: 30
