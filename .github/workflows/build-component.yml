name: Component Manifest · 汇总各件产物成清单

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-component.yml'
      # 件形态/依赖闭环的判据（verify-component-artifact.sh 内部调它）——
      # 改了判据必须触发重建，否则改完看不到效果
      - 'scripts/verify/check-elf-deps.sh'
      - 'scripts/verify/verify-component-artifact.sh'
      - 'scripts/registry/list-bucket-components.js'
      - 'scripts/toolchain/fetch-component-artifacts.sh'
      - 'scripts/publish/publish-component-manifest.js'
      - 'scripts/publish/publish-native-manifest.js'
      - 'scripts/publish/check-component-manifest-drift.js'
      - 'scripts/verify/check-component-manifest-drift.js'
      - 'scripts/publish/upload-qiniu.js'
      - 'scripts/registry/read-component-entry.sh'
      - 'container/app/src/main/assets/supply/channel.json'
      - 'container/app/src/main/assets/supply/component-public.pem'
      - '.github/native-capabilities.txt'
      - 'version.json'
      # 那一族 recipe（`cache-key.sh:209` 逐字那 `PKG_MECH` 那一族）——
      # 改了它们**固化产物的指纹全变**九件逐字**要重新固化**。
      # 而那**报告**逐字要在**改动落地**这一趟就出来（不是等到取件那一趟、
      # 时根因逐字在**几百行日志里**）。
      - 'scripts/recipes/gen-component-meta.js'
      - 'scripts/recipes/package-bundle-zip.sh'
      - 'scripts/toolchain/elf-form.sh'
      - 'scripts/toolchain/cache-key.sh'
      - 'scripts/verify/check-recipe-refreeze.sh'
    tags:
      - 'component-*'
  pull_request:
    paths:
      - 'scripts/registry/list-bucket-components.js'
      - 'scripts/toolchain/fetch-component-artifacts.sh'
      - 'scripts/publish/publish-component-manifest.js'
      - 'scripts/publish/publish-native-manifest.js'
      - 'scripts/publish/check-component-manifest-drift.js'
      - 'scripts/verify/check-component-manifest-drift.js'
  workflow_dispatch: {}

concurrency:
  group: component-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi

  manifest:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 逐件取最近成功 run 的产物（GitHub 是真相源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist work
          bash scripts/toolchain/fetch-component-artifacts.sh | tee work/fetch.tsv
          # 缺陷名（C-102）**这一句逐字是一句与事实相反的口径** ——
          # 而那旧版逐字是「缺件只在 warning 里显式出现，不会静默从清单里消失」，
          #run 41189310138 的 step 3 逐字证明它**没做到**：
          # 那三件（python / sqlite / pkgconf）逐字**不在**那 [declared] 那一行里
          # （[declared] 那一行只含**取到**的那几件）。
          # 这句话逐字被写进 CI 输出里当口径用、它逐字答的是与事实相反的那一句。
          # 按 C-05「缺字段就报缺，不许猜填」：口径逐字改成**中性且真的**那一句。
          echo "[fetch] 缺件逐字在上面那几行里（work/fetch.tsv 与 dist/.fetch-missing.tsv）；清单只含**取到**的那些件。"
          node -p "'[fetch] dist 里 ' + require('fs').readdirSync('dist').filter(f => f.endsWith('.zip')).length + ' 颗 zip'"

      - name: 清单投影（--project：不签名、不读私钥）
        run: |
          set -euo pipefail
          mkdir -p work
          node scripts/publish/publish-component-manifest.js dist --project > work/declared.json
          node -p "'[declared] ' + require('./work/declared.json').map(t => t.name + '@' + t.version + ' 入口 ' + t.entry + ' 别名 ' + (t.aliases||[]).map(a=>a.name).join('+')).join(' | ')"

      # 缺陷名（C-102）**那清单与那缺件表逐字对不上账、没人核** ——
      #run 41189310138 的 step 3 逐字缺了 python / sqlite / pkgconf 三件、
      #[declared] 那一行逐字**不含**那三件、**没人核**、事就过去了。
      # 按 C-05「缺字段就报缺、不许猜填」：缺的几件逐字**必须**在某一格里**看得见**、
      #「看得见」的那一格逐字**能对账**。
      #「清单里要不要留一条占位（missing 状态 + 成因）」那一问**归 01 裁**、
      # 本处**不**拍板、只把事实**逐件**对账出来。
      # 缺陷名（C-102）**那一族逐字要等到取件那一趟才发现、根因逐字在几百行日志里** ——
      # 旧版逐字**没有**任何一处逐字在**改动那一格**的那一趟就报「那九件逐字要重新固化」。
      #**正解**：**改动落地**这一趟逐字就算那指纹、它逐字跟那**已发布**的那一份比。
      # 它逐字**不是**一个探针（它是那一族逐字**该有的自检**）。
      - name: recipe 指纹变了要重新固化（改动落地那一趟就报）
        run: |
          set -uo pipefail
          bash scripts/verify/check-recipe-refreeze.sh || true
          {
            echo "## recipe 指纹变了要重新固化"
            echo ""
            echo "（上面那几行逐字是那**当前**指纹与那**已发布**那一份的比对、"
            echo "不等逐字就是「那一件逐字要重新固化」、固化那一族归 06。）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 缺件对账（那清单 vs 那缺件表）
        run: |
          set -euo pipefail
          node scripts/verify/reconcile-missing-pieces.js \
            dist/.fetch-missing.json work/declared.json

      # 缺陷名（C-102）**「声明侧带缺件状态」那一格在 CI 上逐字没被验** ——
      # 声明侧那一份逐字**要私钥**才能签（把私钥逐字**不在仓内**），
      # 一趟**是校验轮**、step 8 到 10 逐字 skipped
      # 一格逐字**产不出来**、它逐字**在 CI 上未触发**（依 C-113 / C-116）。
      #**投影侧**逐字**不留占位**（它逐字只答「取到了什么」）、
      #**声明侧**逐字**要带**那缺件状态（按 01 裁的 S606-02 逐字）。
      # 一档逐字**不签名、只产出那形状**、它逐字让那一格逐字**能被核**。
      - name: 声明侧形状（--declared-only：不签名、只核那一格）
        run: |
          set -euo pipefail
          node scripts/publish/publish-component-manifest.js dist --declared-only > work/declared-side.json
          node -p "'[declared-side] 缺件 ' + require('./work/declared-side.json').missing.map(m => m.name + '[' + m.reason + ']').join(' | ')"

      - name: 底座件清单投影（与组件清单同一把钥匙）
        run: |
          set -euo pipefail
          node scripts/publish/publish-native-manifest.js --project > work/native-declared.json
          node -p "'[native] ' + require('./work/native-declared.json').map(c => c.id + '@' + c.version + ' 来源 ' + c.source).join(' | ')"

      # 仓内投影与声明源（钉值表 / 档位表 / pin 记录）的对账 ——
      # 纯本地、不联网，任何一轮（校验轮也跑）都能跑；漂了就当场停。
      - name: 投影对账（投影 vs 钉值表 / 档位表 / pin 记录）
        run: |
          set -euo pipefail
          node scripts/publish/check-component-manifest-drift.js --immutable work/declared.json "${{ needs.resolve.outputs.channel }}"
          node scripts/publish/check-component-manifest-drift.js --immutable work/native-declared.json "${{ needs.resolve.outputs.channel }}"

      - name: 原生清单签名（系统更新通道 —— 随 APK 打进来的底座件）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
          LOBOS_COMPONENT_REVISION: ${{ needs.resolve.outputs.revision }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::发布轮需要 secret OTA_PRIVATE_KEY_PEM（ed25519，仓内不入库）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s\n' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          node scripts/publish/publish-native-manifest.js "" release keys/ota-private.pem "${{ needs.resolve.outputs.channel }}"
          echo "[native] 原生清单已签名（系统更新通道）"

      - name: 组装并签名清单（用 APK 焊死的公钥自检）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
          LOBOS_COMPONENT_REVISION: ${{ needs.resolve.outputs.revision }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::发布轮需要 secret OTA_PRIVATE_KEY_PEM（ed25519，仓内不入库）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s\n' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          node scripts/publish/publish-component-manifest.js dist release keys/ota-private.pem "${{ needs.resolve.outputs.channel }}"
          echo "[manifest] 已签名并用 APK 公钥自检通过"

      - name: 发布闸门 —— revision 必须单调，同 name@version 不许换字节
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          node scripts/verify/check-component-manifest-drift.js --immutable release/component-manifest.json "${{ needs.resolve.outputs.channel }}"

      - name: 发布清单到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          ANCHOR=container/app/src/main/assets/supply/channel.json
          CH=$(node -p "require('./$ANCHOR').channel")
          # 清单名与签名名住在那一份 anchor 的 manifests.<channel> 下面，
          # anchor 顶层没有这两个字段 —— 读顶层会拿到 undefined，
          # 于是远端键会变成 component-canary/undefined。
          # 取不到就当场停：绝不允许把带 undefined 的路径投到对象存储上。
          MAN=$(node -p "require('./$ANCHOR').manifests?.['component']?.name || ''")
          SIG=$(node -p "require('./$ANCHOR').manifests?.['component']?.sigName || ''")
          if [ -z "$MAN" ] || [ -z "$SIG" ]; then
            echo "::error title=清单名取不到::$ANCHOR 里没有 manifests.component.name / manifests.component.sigName —— 拒绝投递（否则远端键会变成 component-$CH/undefined）"
            exit 1
          fi
          case "$MAN" in *undefined*|*null*) echo "::error title=清单名非法::$MAN 不是合法的远端键"; exit 1 ;; esac
          case "$SIG" in *undefined*|*null*) echo "::error title=签名名非法::$SIG 不是合法的远端键"; exit 1 ;; esac
          export QINIU_PUBLIC_BASE="$(node -p "require('./$ANCHOR').baseUrl")"
          node scripts/publish/upload-qiniu.js release/component-manifest.json "component-$CH/$MAN" --cache-control=60
          node scripts/publish/upload-qiniu.js release/component-manifest.json.sig "component-$CH/$SIG" --cache-control=60
          echo "[manifest] 已发布 component-$CH/$MAN"
          node scripts/publish/upload-qiniu.js release/native-manifest.json "component-$CH/native-manifest.json" --cache-control=600
          node scripts/publish/upload-qiniu.js release/native-manifest.json.sig "component-$CH/native-manifest.json.sig" --cache-control=600
          echo "[native] 已发布 component-$CH/native-manifest.json"
          # 缺陷名（C-102）**那一格逐字只发那清单、清单逐字指向的那十件包逐字**没发****
          # 旧版逐字**没有**这一段
          #**清单**逐字**上了**那 CDN、它逐字**验签**逐字**过**
          # （键逐字是那 `component-$CH/$MAN` 那一族、它逐字**在**那 CDN 上）
          #**清单里逐字指向**的那些件包逐字**还不在**那 CDN 上
          # （06 本机逐个打了逐字**全 404**、URL 逐字是那一种形状：
          # `https://lobcdn.zll.ink/component/component-llvm-21.1.0-e1b5dcff3b3c-android-arm64.zip`
          #`component/` 那一档逐字**没有**任何一件、**清单**逐字投影逐字是
          # 那 `component/` 那一档（`publish-component-manifest.js:353` 逐字
          # `url: BASE + '/component/' + f`））
          #**后果**逐字 = 那下游逐字**按**那清单逐字**取**不到那件包
          #**判据**逐字是「那发布轮逐字发出去的那些逐字、下游逐字按那清单逐字拿不拿得到」
          # 那一个事实上（它逐字**不**由「那一件逐字是什么」顶掉）
          #**处置**：**十件包**逐字**也**发到那 `component/` 那一档
          # 它逐字发的时候逐字要用那**清单**逐字指向的那**同一个名字**
          # （名字逐字带那指纹、指纹逐字**得**是那当前代码逐字该有的那一个）
          # 名字逐字**从**那清单逐字**取**（它逐字**不**另算一份名）
          # （`publish-component-manifest.js` 那一族逐字**就是**那名字的**真源**）
          node -e '
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("release/component-manifest.json", "utf8"));
          const tools = m.tools || [];
          //**名字**逐字**从**那清单逐字**指向**的那一个逐字**取**
          // （URL 逐字是那 `publish-component-manifest.js:353` 逐字 `BASE + "/component/" + f`）
          const names = tools.map(t => String(t.url || "").split("/").pop()).filter(Boolean);
          if (!names.length) {
            console.error("::error title=清单里没有件::那清单逐字没有 tools 那一族、件包逐字**没**有名字可发");
            process.exit(1);
          }
          fs.writeFileSync("work/cdn-pieces.txt", names.join("\n") + "\n");
          //**件名**逐字**也**逐字**记**下来（**分片**逐字**要**那**件名**才**取得到**）
          // （清单逐字那 `name` 那一格逐字**就是**那**件名**）
          const ids = tools.map(t => String(t.name || "")).filter(Boolean);
          fs.writeFileSync("work/cdn-ids.txt", ids.join("\n") + "\n");
          '
          _cdn_n=0
          _cdn_parts_n=0
          _cdn_i=0
          while IFS= read -r _cdn_name; do
            [ -n "$_cdn_name" ] || continue
            #**件名**逐字**跟**那**名字**逐字**同一个**顺序（两行逐字**同一个**清单逐字**出**的）
            _cdn_id="$(sed -n "$((_cdn_i + 1))p" work/cdn-ids.txt 2>/dev/null || true)"
            _cdn_i=$((_cdn_i + 1))
            _cdn_file="dist/$_cdn_name"
            if [ ! -f "$_cdn_file" ]; then
              echo "::error title=那件包不在 dist 里::$_cdn_name —— 而那清单逐字指向了它、本机逐字**没有**它"
              exit 1
            fi
            #**键**逐字必须逐字**跟**那清单逐字指向的那一个**一样**
            # （清单逐字指向的那前缀逐字是 `component/`、前缀逐字**不**是那 `component-$CH/`）
            node scripts/publish/upload-qiniu.js "$_cdn_file" "component/$_cdn_name" --cache-control=31536000
            _cdn_n=$((_cdn_n + 1))
            # 缺陷名（C-102）**那一格逐字只发那**完整**那一份、**分片**逐字**没发****
            # 旧版逐字**没有**这一段
            #**发布轮**逐字把那**超了**上限的那一件逐字**拆**成那几块
            # （`build-llvmtoolchain.yml` 逐字**做**的逐字是那 `split -b` **那一族**）
            #**几块**逐字**是**那**几个**资产、**取件**那**一边**逐字**拼**回来
            #**拼**回来逐字**只**留那**完整**那一份、**几块**逐字**没**了
            #**下游**逐字**按**那清单逐字**取**那**完整**那一份逐字**取得到**（URL 逐字**是**那完整那一份）
            #**分片**逐字**不**在**那**清单上、**下游**逐字**也**拿不到它们
            #**判据**逐字是「那发布轮逐字发出去的那些逐字、下游逐字按那清单逐字拿不拿得到」
            # 那一个事实上（它逐字**不**由「那一件逐字是什么」顶掉）
            #**下游**逐字**能**拿到的那**几块**逐字**也**逐字**该**在那 CDN 上
            # （**下游**逐字**也能**逐字**自己拼**回来）
            #**处置**：**分片**逐字**从**那 **Release** 逐字取、它们逐字**也**发上去
            #**键**逐字**跟**那**完整**那一份**同一个**前缀（前缀逐字是 `component/`）
            #CDN 那一档逐字**没有**那 2 GiB 限制（`upload-qiniu.js` 逐字
            # `if (bytes > 8 * 1024 * 1024) await uploadResumable();`、`BLOCK = 4 * 1024 * 1024`
            # 逐字 `mkblk` 逐块上、`mkfile` 逐字合、**回读**逐字**流式**核）
            #**取件**那**一边**逐字**已经**会拼、**拼**的那**几步**逐字**不**许**再**来**一遍
            # （依 C-104 逐字**不并**、**分片**逐字**直接从**那 Release **逐字取**）
            _cdn_tag="$(bash scripts/toolchain/cache-key.sh tag "$_cdn_id" 2>/dev/null | tail -1 || true)"
            _cdn_asset="$(bash scripts/toolchain/cache-key.sh asset "$_cdn_id" 2>/dev/null | tail -1 || true)"
            if [ -n "$_cdn_tag" ] && [ -n "$_cdn_asset" ]; then
              rm -rf "dist/.cdn-parts-$_cdn_id" && mkdir -p "dist/.cdn-parts-$_cdn_id"
              if bash scripts/toolchain/fetch-release-asset.sh --parts-only "$_cdn_tag" "$_cdn_asset" "dist/.cdn-parts-$_cdn_id" >/dev/null 2>&1; then
                for _cdn_part in "dist/.cdn-parts-$_cdn_id"/"$_cdn_asset".part-* "dist/.cdn-parts-$_cdn_id"/"$_cdn_asset".parts.txt; do
                  [ -f "$_cdn_part" ] || continue
                  node scripts/publish/upload-qiniu.js "$_cdn_part" "component/$(basename "$_cdn_part")" --cache-control=31536000
                  _cdn_parts_n=$((_cdn_parts_n + 1))
                done
                if [ "$_cdn_parts_n" -gt 0 ]; then
                  echo "[cdn] $_cdn_id 那**分片**逐字**也**发了 $_cdn_parts_n 件到 component/"
                fi
              fi
              rm -rf "dist/.cdn-parts-$_cdn_id"
            fi
          done < work/cdn-pieces.txt
          echo "[cdn] 已发布 $_cdn_n 件包（+ $_cdn_parts_n 件分片）到 component/"