name: Build Userland (商店件)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-userland.yml'
      - 'scripts/build-userland-*.sh'
      - 'scripts/locate-ndk.sh'
      - 'scripts/cache-ndk.sh'
      - 'scripts/verify-userland-build-date.sh'
      - 'scripts/package-userland.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/publish-native-manifest.js'
      - 'scripts/upload-qiniu.js'
      - 'scripts/read-userland-entry.sh'
      - 'scripts/userland-sources.json'
      - 'scripts/fetch-pinned.sh'
      - 'scripts/userland-verify.json'
      - 'scripts/node-versions.json'
      - 'scripts/read-node-versions.sh'
      - 'components/userland/COMPONENT.md'
      - 'components/runtime/COMPONENT.md'
    tags:
      - 'userland-*'
  pull_request:
    paths:
      - 'scripts/build-userland-*.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/publish-native-manifest.js'
      - 'scripts/userland-sources.json'
      - 'scripts/userland-verify.json'
  workflow_dispatch: {}

concurrency:
  group: build-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^userland-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/userland-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 userland-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是商店唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi

  node:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析 node 版本与 ABI
        id: ver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 file >/dev/null
          echo "tag=$(bash scripts/read-node-versions.sh default)" >> "$GITHUB_OUTPUT"
          echo "abi=$(bash scripts/read-node-versions.sh abi)" >> "$GITHUB_OUTPUT"

      - name: 取已编译的 node 运行时制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.abi }}"
          NAME="$TAG.tar.gz"
          mkdir -p dist
          for R in '${{ github.repository }}' 'lobbowen/dsh-mobile'; do
            if gh release download "$TAG" --repo "$R" --pattern "$NAME" --dir dist 2>/dev/null; then
              echo "[ok] 取到 tar 制品：$R / $NAME"
              if [ -f "dist/$NAME.sha256" ]; then
                ( cd dist && sha256sum -c "$NAME.sha256" ) \
                  || { echo "::error title=node 制品 sha256 不符::$R/$NAME"; exit 1; }
                echo "[ok] sha256 校验通过"
              fi
              tar -C dist -xzf "dist/$NAME"
              rm -f "dist/$NAME" "dist/$NAME.sha256"
              break
            fi
            echo "[skip] $R 没有 $NAME（试裸资产形态：libnode.so 与 SHA256SUMS 必须一起下，--pattern 只能给一个模式）"
            if gh release download "$TAG" --repo "$R" --pattern 'libnode.so' --dir dist 2>/dev/null \
               && gh release download "$TAG" --repo "$R" --pattern 'SHA256SUMS' --dir dist 2>/dev/null; then
              echo "[ok] 取到裸资产：$R / $TAG"
              if [ -f dist/SHA256SUMS ]; then
                ( cd dist && grep -E '[[:space:]]libnode\.so$' SHA256SUMS | sha256sum -c - ) \
                  || { echo "::error title=libnode.so 的 SHA256SUMS 校验失败::$R"; exit 1; }
                echo "[ok] sha256 校验通过（按 release 自带的 SHA256SUMS）"
              else
                echo "::error title=裸资产形态没有 SHA256SUMS::拒绝用未校验的 node"
                exit 1
              fi
              break
            fi
            rm -f dist/libnode.so dist/SHA256SUMS
            echo "[skip] $R 两种形态都没有"
          done
          ls -la dist/
          [ -f dist/libnode.so ] \
            || { echo "::error title=没有取到 libnode.so::本仓与 dsh-mobile 的 $TAG 都取不到（两种形态都试过），需先跑 Node Runtime 编译"; exit 1; }
          echo "[ok] node 运行时制品就位：$(stat -c%s dist/libnode.so) 字节"

      - name: 落成 userland 件
        env:
          NODE_VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/build-userland-node.sh

      - name: 件形态校验（aarch64 动态件 / 解释器入口形状）
        run: bash scripts/verify-userland-artifact.sh node

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh node

      - name: 发布 node 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET；设备只从对象存储取件"
            exit 1
          fi
          for f in dist/userland-node-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有 node 件可发::$f 不在，先看前面的构建步"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/upload-qiniu.js "$f" "userland/$(basename "$f")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: userland-node
          path: dist/userland-node-*.zip
          retention-days: 30

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [sqlite3, jq, git, curl, pnpm, npm, sysroot, make, cmake, pkg-config, python3]
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 NDK $NDK_VER（key 只按版本算 → 版本不变就命中，不再下 700 MiB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/cache-ndk.sh
      - name: 定位 NDK（比对钉值；不比对的话改 ndkVersion 对 11 件毫无影响）
        run: bash scripts/locate-ndk.sh

      - name: 把宿主 CPython 放进 PATH（仅 python3 件真正需要）
        run: |
          set -uo pipefail
          WANT="$(bash scripts/fetch-pinned.sh --src-version python 2>/dev/null || true)"
          WANT="${WANT%.*}"
          [ -n "$WANT" ] || exit 0
          for d in /opt/hostedtoolcache/Python/$WANT.*/x64/bin; do
            [ -d "$d" ] || continue
            echo "$d" >> "$GITHUB_PATH"
            echo "[python] 已把 $d 加入 PATH"
            exit 0
          done
          echo "::notice title=未找到宿主 python$WANT::runner 的 Cached Tools 里没有 $WANT。python3 件会自己判红并说明怎么修（可传 BUILD_PYTHON=…）。"

      - name: 产出 ${{ matrix.tool }} 件
        run: bash scripts/build-userland-${{ matrix.tool }}.sh

      - name: 件形态校验（aarch64 动态件 / 解释器入口形状）
        run: bash scripts/verify-userland-artifact.sh ${{ matrix.tool }}

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh ${{ matrix.tool }}

      - name: 发布 ${{ matrix.tool }} 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/userland-${{ matrix.tool }}-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/upload-qiniu.js "$f" "userland/$(basename "$f")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.tool }}
          path: dist/userland-${{ matrix.tool }}-*.zip
          retention-days: 1

  ndk-llvm:
    needs: resolve
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 NDK $NDK_VER（key 只按版本算 → 版本不变就命中，不再下 700 MiB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/cache-ndk.sh
      - name: 定位 NDK（与 build job 共用同一份：比对钉值 + 验证 clang 真能跑）
        run: bash scripts/locate-ndk.sh

      - name: 问 NDK 它的 LLVM 版本（并与钉值核对）
        run: bash scripts/verify-ndk-llvm.sh

      - name: 把实测到的 LLVM 版本写进摘要（供填 llvmVersion 用）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          CLANG="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/clang 2>/dev/null | head -1 || true)"
          if [ -n "$CLANG" ]; then
            "$CLANG" --version 2>/dev/null | head -3
            "$CLANG" --version 2>/dev/null \
              | sed -n 's/.*clang version \([0-9][0-9.]*\).*/实测 LLVM 版本 = \1/p'
            { echo "### NDK/LLVM 版本（填进 scripts/userland-sources.json 的 llvmVersion）"; echo '```'; \
              "$CLANG" --version 2>/dev/null | head -3; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 读出 clang_source_info.md（NDK 内置 LLVM 的真实来源）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          SI="$(ls "$NDK"/toolchains/llvm/prebuilt/*/clang_source_info.md "$NDK"/clang_source_info.md 2>/dev/null | head -1 || true)"
          {
            echo "### clang_source_info.md"
            if [ -n "$SI" ]; then
              echo "路径：\`$SI\`"
              echo '```'
              cat "$SI"
              echo '```'
              echo "**llvmVersion 要按这份文件填**（它给的是 llvmorg- 对应的语义版本）。"
            else
              echo "**没找到 clang_source_info.md** —— 这一版 clang 的 LLVM 语义版本未知。"
              echo "此时 \`clang --version\` 里的 \`20.0.0git\` **不足以**作为同源依据"
              echo "（verify-ndk-llvm.sh 会 exit 2 并说明）。需要人工确认后再填。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编 llvmtoolchain（llvmVersion 已填，首次真编）
        if: success()
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -n "$NDK" ] && [ -d "$NDK" ] \
            || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          [ -x "$TC/aarch64-linux-android23-clang" ] \
            || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android23-clang（宿主标签写死了 linux-x86_64，runner 若不是 x86_64 要改这里）"; exit 1; }
          [ -x "$TC/llvm-ar" ] \
            || { echo "::error title=无 llvm-ar::缺 $TC/llvm-ar —— 编 LLVM 的归档工具，NDK 自带"; exit 1; }
          { echo "CC=$TC/aarch64-linux-android23-clang";
            echo "CXX=$TC/aarch64-linux-android23-clang++";
            echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake
          fi
          bash scripts/build-userland-llvmtoolchain.sh

      - name: 件形态校验（aarch64 动态件 / 别名工具各自形状）
        run: bash scripts/verify-userland-artifact.sh llvmtoolchain

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh llvmtoolchain

      - name: 别名映射须与件内 package.json 一致
        run: |
          set -euo pipefail
          test -f dist/llvmtoolchain/package.json \
            || { echo "::error title=缺别名映射::dist/llvmtoolchain/package.json 没产出 —— 八个工具里只有入口能用"; exit 1; }
          node -e '
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("dist/llvmtoolchain/package.json", "utf8"));
          const names = Object.keys(pkg.bin || {});
          const need = ["clang", "clang++", "ld.lld", "llvm-ar", "llvm-nm", "llvm-strip", "llvm-objdump", "llvm-readobj"];
          const missing = need.filter((n) => !names.includes(n));
          if (missing.length) {
            console.error("::error title=别名不全::package.json 的 bin 缺 " + missing.join(",") + "（声明了 " + names.length + " 个）");
            process.exit(1);
          }
          for (const [k, v] of Object.entries(pkg.bin)) {
            if (!fs.existsSync("dist/llvmtoolchain/" + v)) {
              console.error("::error title=别名指向不存在的文件::" + k + " → " + v);
              process.exit(1);
            }
          }
          console.log("[ok] 别名 " + names.length + " 个，逐个指向件内真实文件");
          '

  manifest:
    needs: [resolve, build, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 清单投影（--project：不签名、不读私钥）
        run: |
          set -euo pipefail
          mkdir -p work
          node scripts/publish-userland-manifest.js dist --project > work/declared.json
          node -p "'[declared] ' + require('./work/declared.json').map(t => t.name + '@' + t.version + ' 入口 ' + t.entry + ' 别名 ' + (t.aliases||[]).map(a=>a.name).join('+')).join(' | ')"

      - name: 底座件清单投影（与商店清单分流，同一把钥匙）
        run: |
          set -euo pipefail
          node scripts/publish-native-manifest.js --project > work/native-declared.json
          node -p "'[native] ' + require('./work/native-declared.json').map(c => c.id + '@' + c.version + ' 来源 ' + c.source).join(' | ')"

      - name: 组装并签名清单（用 APK 焊死的公钥自检）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
          LOBOS_USERLAND_REVISION: ${{ needs.resolve.outputs.revision }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::发布轮需要 secret OTA_PRIVATE_KEY_PEM（ed25519，仓内不入库）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s\n' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          node scripts/publish-userland-manifest.js dist release keys/ota-private.pem "${{ needs.resolve.outputs.channel }}"
          echo "[manifest] 已签名并用 APK 公钥自检通过"

      - name: 发布闸门 —— revision 必须单调，同 name@version 不许换字节
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          node scripts/check-userland-manifest-drift.js --immutable release/userland-manifest.json "${{ needs.resolve.outputs.channel }}"

      - name: 发布清单到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          ANCHOR=container/app/src/main/assets/supply/channel.json
          MAN=$(node -p "require('./$ANCHOR').manifestName")
          SIG=$(node -p "require('./$ANCHOR').sigName")
          CH=$(node -p "require('./$ANCHOR').channel")
          export QINIU_PUBLIC_BASE="$(node -p "require('./$ANCHOR').baseUrl")"
          node scripts/upload-qiniu.js release/userland-manifest.json "$CH/$MAN" --cache-control=60
          node scripts/upload-qiniu.js release/userland-manifest.json.sig "$CH/$SIG" --cache-control=60
          echo "[manifest] 已发布 $CH/$MAN"