name: Build Userland (工具链件)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-userland.yml'
      - 'scripts/build-userland-*.sh'
      - 'scripts/verify-userland-build-date.sh'
      - 'scripts/package-userland.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/read-userland-entry.sh'
      - 'scripts/userland-sources.json'
      - 'scripts/fetch-pinned.sh'
      - 'scripts/userland-verify.json'
      - 'scripts/node-versions.json'
      - 'scripts/read-node-versions.sh'
  pull_request:
    paths:
      - 'scripts/build-userland-*.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/userland-sources.json'
      - 'scripts/userland-verify.json'
  workflow_dispatch: {}

concurrency:
  group: build-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析 node 版本与 ABI
        id: ver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 file >/dev/null
          echo "tag=$(bash scripts/read-node-versions.sh default)" >> "$GITHUB_OUTPUT"
          echo "abi=$(bash scripts/read-node-versions.sh abi)" >> "$GITHUB_OUTPUT"

      - name: 取已编译的 node 运行时制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.abi }}"
          NAME="$TAG.tar.gz"
          mkdir -p dist
          for R in '${{ github.repository }}' 'lobbowen/dsh-mobile'; do
            if gh release download "$TAG" --repo "$R" --pattern "$NAME" --dir dist 2>/dev/null; then
              echo "[ok] 取到 tar 制品：$R / $NAME"
              if [ -f "dist/$NAME.sha256" ]; then
                ( cd dist && sha256sum -c "$NAME.sha256" ) \
                  || { echo "::error title=node 制品 sha256 不符::$R/$NAME"; exit 1; }
                echo "[ok] sha256 校验通过"
              fi
              tar -C dist -xzf "dist/$NAME"
              rm -f "dist/$NAME" "dist/$NAME.sha256"
              break
            fi
            echo "[skip] $R 没有 $NAME（试裸资产形态：libnode.so 与 SHA256SUMS 必须一起下，--pattern 只能给一个模式）"
            if gh release download "$TAG" --repo "$R" --pattern 'libnode.so' --dir dist 2>/dev/null \
               && gh release download "$TAG" --repo "$R" --pattern 'SHA256SUMS' --dir dist 2>/dev/null; then
              echo "[ok] 取到裸资产：$R / $TAG"
              if [ -f dist/SHA256SUMS ]; then
                ( cd dist && grep -E '[[:space:]]libnode\.so$' SHA256SUMS | sha256sum -c - ) \
                  || { echo "::error title=libnode.so 的 SHA256SUMS 校验失败::$R"; exit 1; }
                echo "[ok] sha256 校验通过（按 release 自带的 SHA256SUMS）"
              else
                echo "::error title=裸资产形态没有 SHA256SUMS::拒绝用未校验的 node"
                exit 1
              fi
              break
            fi
            rm -f dist/libnode.so dist/SHA256SUMS
            echo "[skip] $R 两种形态都没有"
          done
          ls -la dist/
          [ -f dist/libnode.so ] \
            || { echo "::error title=没有取到 libnode.so::本仓与 dsh-mobile 的 $TAG 都取不到（两种形态都试过），需先跑 Node Runtime 编译"; exit 1; }
          echo "[ok] node 运行时制品就位：$(stat -c%s dist/libnode.so) 字节"

      - name: 落成 userland 件
        env:
          NODE_VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/build-userland-node.sh

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh node

      - uses: actions/upload-artifact@v4
        with:
          name: userland-node
          path: dist/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [sqlite3, jq, git, curl, pnpm, npm]
    steps:
      - uses: actions/checkout@v4

      - name: 定位 NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$TC/aarch64-linux-android21-clang" ] || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android21-clang"; exit 1; }
          echo "[ndk] 目录=$NDK 版本=$(awk -F= '/^Pkg\.Revision/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' "$NDK/source.properties")"
          { echo "CC=$TC/aarch64-linux-android21-clang"; echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"

      - name: 产出 ${{ matrix.tool }} 件
        run: bash scripts/build-userland-${{ matrix.tool }}.sh

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh ${{ matrix.tool }}

      - uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.tool }}
          path: dist/
          retention-days: 1

  manifest:
    needs: [build, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 清单投影（--project：不签名、不读私钥）
        run: |
          set -euo pipefail
          mkdir -p work
          node scripts/publish-userland-manifest.js dist --project > work/declared.json
          node -p "'[declared] ' + require('./work/declared.json').map(t => t.name + '@' + t.version + ' 入口 ' + t.entry + ' 别名 ' + (t.aliases||[]).map(a=>a.name).join('+')).join(' | ')"