name: Build Userland (商店件)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-userland.yml'
      - 'scripts/build-userland-*.sh'
      - 'scripts/verify-userland-build-date.sh'
      - 'scripts/package-userland.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/upload-qiniu.js'
      - 'scripts/read-userland-entry.sh'
      - 'scripts/userland-sources.json'
      - 'scripts/fetch-pinned.sh'
      - 'scripts/userland-verify.json'
      - 'scripts/node-versions.json'
      - 'scripts/read-node-versions.sh'
      - 'components/userland/COMPONENT.md'
      - 'components/runtime/COMPONENT.md'
    tags:
      - 'userland-*'
  pull_request:
    paths:
      - 'scripts/build-userland-*.sh'
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/userland-sources.json'
      - 'scripts/userland-verify.json'
  workflow_dispatch: {}

concurrency:
  group: build-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^userland-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/userland-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 userland-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是商店唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi

  node:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析 node 版本与 ABI
        id: ver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 file >/dev/null
          echo "tag=$(bash scripts/read-node-versions.sh default)" >> "$GITHUB_OUTPUT"
          echo "abi=$(bash scripts/read-node-versions.sh abi)" >> "$GITHUB_OUTPUT"

      - name: 取已编译的 node 运行时制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.abi }}"
          NAME="$TAG.tar.gz"
          mkdir -p dist
          for R in '${{ github.repository }}' 'lobbowen/dsh-mobile'; do
            if gh release download "$TAG" --repo "$R" --pattern "$NAME" --dir dist 2>/dev/null; then
              echo "[ok] 取到 tar 制品：$R / $NAME"
              if [ -f "dist/$NAME.sha256" ]; then
                ( cd dist && sha256sum -c "$NAME.sha256" ) \
                  || { echo "::error title=node 制品 sha256 不符::$R/$NAME"; exit 1; }
                echo "[ok] sha256 校验通过"
              fi
              tar -C dist -xzf "dist/$NAME"
              rm -f "dist/$NAME" "dist/$NAME.sha256"
              break
            fi
            echo "[skip] $R 没有 $NAME（试裸资产形态：libnode.so 与 SHA256SUMS 必须一起下，--pattern 只能给一个模式）"
            if gh release download "$TAG" --repo "$R" --pattern 'libnode.so' --dir dist 2>/dev/null \
               && gh release download "$TAG" --repo "$R" --pattern 'SHA256SUMS' --dir dist 2>/dev/null; then
              echo "[ok] 取到裸资产：$R / $TAG"
              if [ -f dist/SHA256SUMS ]; then
                ( cd dist && grep -E '[[:space:]]libnode\.so$' SHA256SUMS | sha256sum -c - ) \
                  || { echo "::error title=libnode.so 的 SHA256SUMS 校验失败::$R"; exit 1; }
                echo "[ok] sha256 校验通过（按 release 自带的 SHA256SUMS）"
              else
                echo "::error title=裸资产形态没有 SHA256SUMS::拒绝用未校验的 node"
                exit 1
              fi
              break
            fi
            rm -f dist/libnode.so dist/SHA256SUMS
            echo "[skip] $R 两种形态都没有"
          done
          ls -la dist/
          [ -f dist/libnode.so ] \
            || { echo "::error title=没有取到 libnode.so::本仓与 dsh-mobile 的 $TAG 都取不到（两种形态都试过），需先跑 Node Runtime 编译"; exit 1; }
          echo "[ok] node 运行时制品就位：$(stat -c%s dist/libnode.so) 字节"

      - name: 落成 userland 件
        env:
          NODE_VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/build-userland-node.sh

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh node

      - name: 发布 node 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET；设备只从对象存储取件"
            exit 1
          fi
          for f in dist/userland-node-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有 node 件可发::$f 不在，先看前面的构建步"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/upload-qiniu.js "$f" "userland/$(basename "$f")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: userland-node
          path: dist/
          retention-days: 30

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [sqlite3, jq, git, curl, pnpm, npm]
    steps:
      - uses: actions/checkout@v4

      - name: 定位 NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$TC/aarch64-linux-android21-clang" ] || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android21-clang"; exit 1; }
          echo "[ndk] 目录=$NDK 版本=$(awk -F= '/^Pkg\.Revision/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' "$NDK/source.properties")"
          { echo "CC=$TC/aarch64-linux-android21-clang"; echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"

      - name: 产出 ${{ matrix.tool }} 件
        run: bash scripts/build-userland-${{ matrix.tool }}.sh

      - name: 打包 + sha256
        run: bash scripts/package-userland.sh ${{ matrix.tool }}

      - name: 发布 ${{ matrix.tool }} 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/userland-${{ matrix.tool }}-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/upload-qiniu.js "$f" "userland/$(basename "$f")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.tool }}
          path: dist/
          retention-days: 1

  manifest:
    needs: [resolve, build, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 清单投影（--project：不签名、不读私钥）
        run: |
          set -euo pipefail
          mkdir -p work
          node scripts/publish-userland-manifest.js dist --project > work/declared.json
          node -p "'[declared] ' + require('./work/declared.json').map(t => t.name + '@' + t.version + ' 入口 ' + t.entry + ' 别名 ' + (t.aliases||[]).map(a=>a.name).join('+')).join(' | ')"

      - name: 与线上清单逐格对账（发布前必须平）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          ANCHOR=container/app/src/main/assets/supply/channel.json
          MAN=$(node -p "require('./$ANCHOR').manifestName")
          SIG=$(node -p "require('./$ANCHOR').sigName")
          BASE=$(node -p "require('./$ANCHOR').baseUrl")
          CH=$(node -p "require('./$ANCHOR').channel")
          URL="$BASE/$CH/$MAN"
          if curl -fsS --max-time 25 "$URL" -o work/online.json; then
            node -e '
              const a = require("./work/online.json"), b = require("./work/declared.json");
              const key = (t) => t.name + "@" + t.version;
              const ka = new Set((a.tools || []).map(key)), kb = new Set(b.map(key));
              const missing = [...kb].filter((k) => !ka.has(k));
              const extra = [...ka].filter((k) => !kb.has(k));
              if (missing.length) console.log("[drift] 本轮新增（线上还没有）：" + missing.join(", "));
              if (extra.length) console.log("[drift] 线上有但本轮没产出：" + extra.join(", "));
              const sameNameDiffBytes = (a.tools || []).filter((t) => {
                const n = b.find((x) => x.name === t.name);
                return n && n.version === t.version && n.sha256 !== t.sha256;
              }).map((t) => t.name);
              if (sameNameDiffBytes.length) {
                console.error("[drift] 同 name@version 却换了字节（内容寻址被破坏）：" + sameNameDiffBytes.join(", "));
                process.exit(1);
              }
              console.log("[drift] 对账完成：线上 " + ka.size + " 件，本轮 " + kb.size + " 件");
            '
          else
            echo "[drift] 取不到线上清单（$URL）—— 首次发布或网络不通，跳过对账（发布后的回读仍会校验）"
          fi

      - name: 组装并签名清单（用 APK 焊死的公钥自检）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
          LOBOS_USERLAND_REVISION: ${{ needs.resolve.outputs.revision }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::发布轮需要 secret OTA_PRIVATE_KEY_PEM（ed25519，仓内不入库）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s\n' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          node scripts/publish-userland-manifest.js dist release keys/ota-private.pem "${{ needs.resolve.outputs.channel }}"
          echo "[manifest] 已签名并用 APK 公钥自检通过"

      - name: 发布清单到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          ANCHOR=container/app/src/main/assets/supply/channel.json
          MAN=$(node -p "require('./$ANCHOR').manifestName")
          SIG=$(node -p "require('./$ANCHOR').sigName")
          CH=$(node -p "require('./$ANCHOR').channel")
          export QINIU_PUBLIC_BASE="$(node -p "require('./$ANCHOR').baseUrl")"
          node scripts/upload-qiniu.js release/userland-manifest.json "$CH/$MAN" --cache-control=60
          node scripts/upload-qiniu.js release/userland-manifest.json.sig "$CH/$SIG" --cache-control=60
          echo "[manifest] 已发布 $CH/$MAN"