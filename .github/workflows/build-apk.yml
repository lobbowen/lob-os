name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/native-assets.txt'
      - '.github/workflows/build-apk.yml'
      - 'version.json'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Ensure welded OTA public key anchor
        env:
          OTA_PUBLIC_KEY: ${{ secrets.OTA_PUBLIC_KEY }}
        run: |
          ANCHOR="container/app/src/main/assets/ota-public.pem"
          if [ -n "$OTA_PUBLIC_KEY" ]; then
            printf '%s' "$OTA_PUBLIC_KEY" > "$ANCHOR"
            echo "anchor written from OTA_PUBLIC_KEY secret"
          else
            echo "[note] 未配置 OTA_PUBLIC_KEY：沿用仓库内已有的公钥锚"
          fi
          ls -la "$ANCHOR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-<unset>}"

      - name: Install SDK packages (platform-tools / platform / build-tools)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK" ] || { echo "::error title=无 Android SDK"; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "[ok] SDK 包就绪"

      - name: 解析 Node 版本与 ABI
        id: ver
        run: |
          set -euo pipefail
          echo "abi=$(bash scripts/read-node-versions.sh abi)" >> "$GITHUB_OUTPUT"
          echo "tag=$(bash scripts/read-node-versions.sh default)" >> "$GITHUB_OUTPUT"

      - name: 取 Node 运行时制品（编译一次、复用；不再重编）
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/node-runtime
          NAME="node-runtime-${{ steps.ver.outputs.tag }}-${{ steps.ver.outputs.abi }}.tar.gz"
          if gh release download "node-runtime-${{ steps.ver.outputs.tag }}" \
               --repo '${{ github.repository }}' --pattern "$NAME" --dir /tmp/rt 2>/dev/null; then
            tar -C dist/node-runtime -xzf "/tmp/rt/$NAME"
            echo "[ok] 复用已发布运行时制品：$NAME"
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[warn] 未找到已发布运行时制品（先跑 workflow「Node Runtime」）"
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist/node-runtime/ 2>/dev/null || true

      - name: 放置 C++ 运行期到 jniLibs（APK 基础环境）
        run: |
          set -euo pipefail
          J=container/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$J"
          SRC="dist/node-runtime/libc++_shared.so"
          if [ ! -f "$SRC" ]; then
            NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
            SRC="$(ls "$NDK"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so 2>/dev/null | head -1)"
            echo "[note] 制品里没有 libc++_shared.so，改从 NDK 取：$SRC"
          fi
          [ -f "$SRC" ] || { echo "::error title=缺 libc++_shared.so::APK 内 C++ 原生件将无法加载"; exit 1; }
          cp -f "$SRC" "$J/libc++_shared.so"
          chmod +x "$J/libc++_shared.so"
          ls -la "$J/libc++_shared.so"

      - name: Build capability binaries (小件原生件)
        run: |
          set -euo pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          bash scripts/build-native-capabilities.sh
          ls -la container/app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK（第一次真正编译宿主 Kotlin）
        id: gradlebuild
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: container/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/diag
          cp -f /tmp/gradle-build.log /tmp/diag/ 2>/dev/null || true
          cp -f /tmp/node-build.log /tmp/diag/ 2>/dev/null || true
          ls -la /tmp/diag/ || true

      - name: Upload failure diagnostics artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: /tmp/diag/
          if-no-files-found: warn
          retention-days: 7