name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'os-release-*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_ROUND: ${{ startsWith(github.ref, 'refs/tags/os-release-') }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/os-release-') && github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure welded OTA public key anchor
        env:
          OTA_PUBLIC_KEY: ${{ secrets.OTA_PUBLIC_KEY }}
        run: |
          ANCHOR="container/app/src/main/assets/supply/component-public.pem"
          if [ -n "$OTA_PUBLIC_KEY" ]; then
            printf '%s' "$OTA_PUBLIC_KEY" > "$ANCHOR"
            echo "anchor written from OTA_PUBLIC_KEY secret"
          else
            echo "[note] 未配置 OTA_PUBLIC_KEY：沿用仓库内已有的公钥锚"
          fi
          ls -la "$ANCHOR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Show Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-<unset>}"

      # 发布轮的前置校验 —— 放在所有耗时步骤之前。
      #
      # 为什么必须提前：发布轮的三个专属判据（tag 与 version.json 一致、
      # 签名密钥在位、发布令牌在位）原本排在第 30 步之后，也就是**编完
      # 13 个原生件 + 整个 APK 之后**才判。tag 打错一个字符、secret 没配，
      # 都要等十几分钟才报错。校验轮不会碰到这些，所以这个洞一直没人踩到。
      #
      # 这一步只读，不改任何东西 —— 它要保证「发布轮往下走之前一定不会白跑」。
      - name: 发布轮前置校验（tag / 密钥 / 令牌 / 版本闸门）
        if: ${{ env.RELEASE_ROUND == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          FAIL=0
          SUMMARY="$GITHUB_STEP_SUMMARY"
          say() {
            echo "::error title=发布前置::$1"
            echo "- ❌ $1" >> "$SUMMARY"
            FAIL=1
          }
          pass() { echo "- ✅ $1" >> "$SUMMARY"; }
          echo '## 发布轮前置校验' >> "$SUMMARY"

          # (1) tag 与 version.json 必须逐字一致 —— 否则要编完 APK 才报
          NAME_VER="$(jq -r '.shell.versionName' version.json)"
          CODE="$(jq -r '.shell.versionCode' version.json)"
          if [ "$RELEASE_TAG" != "os-release-$NAME_VER" ]; then
            say "tag 与 version.json 对不上：tag=$RELEASE_TAG，而 version.json 的 versionName=$NAME_VER（要么改 tag，要么先提 versionName）"
          else
            pass "tag 与 version.json 一致：$RELEASE_TAG（versionCode=$CODE）"
          fi

          # (2) 四件签名密钥必须齐 —— 缺一个就退回一次性 debug 签名，
          #     装到已装设备上必然 INSTALL_FAILED_UPDATE_INCOMPATIBLE
          MISSING_KEYS=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || MISSING_KEYS="$MISSING_KEYS $v"
          done
          if [ -n "$MISSING_KEYS" ]; then
            say "缺少签名密钥：$MISSING_KEYS —— 发布包不能用一次性 debug 签名"
          else
            pass "签名密钥四件齐备（alias 由 secrets 提供）"
          fi

          # (3) 发布令牌
          if [ -z "${GH_TOKEN:-}" ]; then
            say "缺少 secrets.APK_PUBLISH_TOKEN —— 发不了 release"
          else
            pass "发布令牌在位"
          fi

          # (4) 同版本号只允许配同一批字节
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "- ⚠️ 跳过「同版本号闸门」（没有令牌查不了）" >> "$SUMMARY"
          elif gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            say "同版本号已发布过：$RELEASE_TAG 已存在。同号只能配同一批字节；要重发先提 versionCode 再打新 tag。"
          else
            pass "版本闸门通过：$RELEASE_TAG 尚未发布过"
          fi

          if [ "$FAIL" != "0" ]; then
            echo "" >> "$SUMMARY"
            echo '**结论：❌ 未通过 —— 下面几条要先解决**' >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo '这些判据原本排在编译之后，白跑十几分钟才报。' >> "$SUMMARY"
            echo "::error title=发布前置校验未通过::详见本步的 Job Summary"
            exit 1
          fi
          echo "" >> "$SUMMARY"
          echo '**结论：✅ 全过，可以往下走**' >> "$SUMMARY"
          echo "[preflight] 发布前置校验全过"
      - name: Install SDK packages (platform-tools / platform / build-tools)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK" ] || { echo "::error title=无 Android SDK"; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          if ! "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null; then
            echo "::error title=SDK 包安装失败::platform-tools / platforms;android-35 / build-tools;35.0.0 至少一个没装上"
            ls -1 "$SDK" 2>/dev/null || true
            exit 1
          fi
          # 后面 verify-apk-signing.sh 要在这里找 apksigner —— 先确认它真的在，
          # 免得几十行之后才报「找不到 apksigner」，看不出是哪一步没装成
          if ! find "$SDK/build-tools" -name apksigner 2>/dev/null | head -1 | grep -q .; then
            echo "::error title=build-tools 里没有 apksigner::签名核验依赖它"
            ls -1 "$SDK/build-tools" 2>/dev/null || echo "  （build-tools 目录不存在）"
            exit 1
          fi
          echo "[ok] SDK 包就绪（含 apksigner）"

      - name: 取 NDK（命中缓存则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑；与组件链同一份）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 编译底座共享库所需的宿主工具（cmake）
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake >/dev/null
          }
          command -v cmake >/dev/null 2>&1 || { echo "::error title=无 cmake::zlib 共享库编不出来"; exit 1; }
          echo "[ok] cmake $(cmake --version | head -1)"

      - name: 放置 C++ 运行期到 jniLibs（APK 基础环境）
        run: |
          set -euo pipefail
          J=container/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$J"
          NDK="$(cd "$(dirname "$CC")/../../../../.." && pwd)"
          echo "[libc++] NDK=$NDK（由 locate-ndk.sh 注入的 CC 反推，与组件链同一份）"
          SRC="$(ls "$NDK"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so 2>/dev/null | head -1)"
          [ -f "$SRC" ] || { echo "::error title=缺 libc++_shared.so::APK 内 C++ 原生件将无法加载；NDK=$NDK"; exit 1; }
          cp -f "$SRC" "$J/libc++_shared.so"
          chmod +x "$J/libc++_shared.so"
          ls -la "$J/libc++_shared.so"

      - name: node 运行时不入 APK（断言它没被误放进来）
        run: |
          set -euo pipefail
          J=container/app/src/main/jniLibs/arm64-v8a
          if [ -e "$J/libnode.so" ]; then
            echo "::error title=jniLibs 里不该有 libnode.so::node 由控制面板下发安装，不随 APK 内置，APK 内置会让它涨 116MB 且无法独立升级"
            ls -la "$J/libnode.so"
            exit 1
          fi
          echo "[ok] jniLibs 无 libnode.so（node 由组件供给）"

      - name: 放置 sysroot 到 assets（编译期材料 · 不是件）
        run: |
          set -euo pipefail
          # sysroot 是**编译期**的头文件与库目录（include/ + lib/），
          # 不是可运行的能力 —— 所以进 APK 但不成为件：
          #   · 不产 component-meta.json（不是 usr/lib/<id>/<版本>/ 那个形状）
          #   · 不落位（内核不认识它）
          # Linux 的对应物：gcc 包的 include/ 与 libc6-dev 包 —— 都是编译材料。
          NDK="$(cd "$(dirname "$CC")/../../../../.." && pwd)"
          SRC="$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/sysroot 2>/dev/null | head -1)"
          [ -n "$SRC" ] || { echo "::error title=找不到 NDK sysroot::编译任何 C/C++ 都要它（NDK=$NDK）"; exit 1; }
          DST=container/app/src/main/assets/sysroot
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -a "$SRC/usr/include" "$DST/include"
          mkdir -p "$DST/lib"
          cp -a "$SRC"/usr/lib/aarch64-linux-android/. "$DST/lib/" 2>/dev/null || true
          [ -f "$DST/include/stdio.h" ] || { echo "::error title=sysroot 缺 stdio.h::编译任何 C 程序都会失败"; exit 1; }
          echo "[sysroot] 就位 $DST（include $(ls "$DST/include" | wc -l) 项 · lib $(ls "$DST/lib" | wc -l) 项）"
          du -sh "$DST"

      - name: 小件原生件（命中固化则取用，否则现场编译）
        run: |
          set -euo pipefail
          bash scripts/toolchain/locate-ndk.sh
          bash scripts/toolchain/ensure-native-capabilities.sh
          ls -la container/app/src/main/jniLibs/arm64-v8a/

      - name: 原生件形态与依赖闭环（jniLibs/*.so）
        run: |
          set -euo pipefail
          bash scripts/toolchain/locate-ndk.sh
          bash scripts/verify/verify-runtime-elf.sh container/app/src/main/jniLibs/arm64-v8a

      - name: OTA 锚点判据（Ed25519 公钥必须能解析、能被设备验）
        run: bash scripts/verify/verify-ota-anchor.sh

      - name: 注入发布签名（缺密钥时校验轮放行，发布轮判红）
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/publish/inject-apk-keystore.sh keys || rc=$?
          if [ "$rc" -eq 10 ]; then
            if [ "${RELEASE_ROUND}" = "true" ]; then
              echo "::error title=发布轮缺签名密钥::os-release-* 这一轮必须签发布包 —— 指纹每次不同的 debug 包装到已装设备上会 INSTALL_FAILED_UPDATE_INCOMPATIBLE。需要 secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
              exit 1
            fi
            echo "[signing] 校验轮无签名密钥，本次出 debug 签名包（仅供验证，不可发布）"
            exit 0
          fi
          exit "$rc"

      - name: Build APK（发布轮出 release 变体，校验轮出 debug）
        id: gradlebuild
        env:
          LOBOS_KEYSTORE_PASSWORD: ${{ env.LOBOS_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${RELEASE_ROUND}" = "true" ]; then
            VARIANT=release
          else
            VARIANT=debug
          fi
          echo "[gradle] 本轮构建变体：$VARIANT（RELEASE_ROUND=${RELEASE_ROUND}）"

          # ★ 清掉上一次构建残留的 packaged_res ——
          #   Gradle 的 build/ 是缓存带过来的（setup-gradle 会恢复它），
          #   而 packageDebugResources 在已有输出时**不覆盖**，于是
          #   上一轮那份坏副本会一直留着：
          #     [Fatal Error] activity_main.xml:61:1: XML document structures
          #                   must start and end within the same entity.
          #   —— 报的是 build/intermediates/packaged_res/…/activity_main.xml，
          #   而 src/res/layout/ 那份是好的。
          #
          # 只清这一个 intermediates 子目录，不动依赖缓存
          #（清整个 build/ 会让每次都全量重编，慢很多）。
          rm -rf container/app/build/intermediates/packaged_res
          echo "[gradle] 已清 packaged_res（避免沿用上一轮的残留）"
          gradle "assemble$VARIANT" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          ls -la "container/app/build/outputs/apk/$VARIANT/"

      - name: 产物形态校验（APK 条目 vs 三份声明表）
        run: |
          set -uo pipefail
          APK="$(ls container/app/build/outputs/apk/${{ steps.gradlebuild.outputs.variant }}/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then
            echo "::error title=没有 APK 可审::构建步应当已在 apk/${{ steps.gradlebuild.outputs.variant }}/ 下产出 APK"
            exit 1
          fi
          echo "[verify] 审这一份：$APK"
          bash scripts/verify/verify-apk-native.sh "$APK" arm64-v8a

      - name: 验签（发布轮要求稳定身份；校验轮只查签名一致性）
        run: |
          set -uo pipefail
          APK="$(ls container/app/build/outputs/apk/${{ steps.gradlebuild.outputs.variant }}/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then
            echo "::error title=没有 APK 可验::构建步应当已产出 APK"
            exit 1
          fi
          CERT_ARG=""
          if [ -s keys/release.cert ]; then CERT_ARG="--cert keys/release.cert"; fi
          if [ "${RELEASE_ROUND}" = "true" ]; then
            bash scripts/verify/verify-apk-signing.sh "$APK" $CERT_ARG --require-stable
          else
            bash scripts/verify/verify-apk-signing.sh "$APK" $CERT_ARG
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.gradlebuild.outputs.variant }}
          path: container/app/build/outputs/apk/${{ steps.gradlebuild.outputs.variant }}/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 校验轮：发验证包（每次构建一份，下载链接一步可得）
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
          TAG: verify-${{ github.sha }}
        run: |
          set -euo pipefail
          APK="$(ls container/app/build/outputs/apk/${{ steps.gradlebuild.outputs.variant }}/*.apk | head -1)"
          [ -f "$APK" ] || { echo "::error::没有 APK 可发布"; exit 1; }
          NAME="lobos-os-$(jq -r '.shell.versionName' version.json)-verify.$(jq -r '.shell.versionCode' version.json).apk"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::未配置 APK_PUBLISH_TOKEN，跳过自动发布（构建本身是成功的）"
            exit 0
          fi
          {
            echo "commit ${GITHUB_SHA}"
            echo ""
            echo "这是**校验轮**产物，不是发布版。"
            echo "发布版走 os-release-VERSION tag。"
          } > /tmp/verify-notes.md
          gh release create "$TAG" "$APK#$NAME" \
            --title "验证包 $(jq -r '.shell.versionName' version.json) · ${GITHUB_SHA:0:9}" \
            --notes-file /tmp/verify-notes.md \
            --prerelease --target "$GITHUB_SHA" || {
              echo "::notice::同名 release 已存在，补传资产"
              gh release upload "$TAG" "$APK#$NAME" --clobber
            }
          echo ""
          echo "下载地址："
          gh release view "$TAG" --json assets --jq '.assets[0].url'

      - name: 发布轮：发正式版到 os-release-<versionName>
        if: success() && env.RELEASE_ROUND == 'true'
        env:
          GH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          NAME_VER="$(jq -r '.shell.versionName' version.json)"
          CODE="$(jq -r '.shell.versionCode' version.json)"
          if [ "$RELEASE_TAG" != "os-release-$NAME_VER" ]; then
            echo "::error title=tag 与 version.json 对不上::tag 是 $RELEASE_TAG，version.json 是 $NAME_VER —— 要打 os-release-$NAME_VER"
            exit 1
          fi
          APK="$(ls container/app/build/outputs/apk/release/*.apk | head -1)"
          [ -f "$APK" ] || { echo "::error::没有 release 变体的 APK：$APK"; exit 1; }
          SHA="$(sha256sum "$APK" | cut -c1-64)"
          ASSET="lobos-os-$NAME_VER.apk"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=发布轮缺令牌::os-release-* 这一轮要发正式版，需要 secrets APK_PUBLISH_TOKEN"
            exit 1
          fi
          {
            echo "commit ${GITHUB_SHA}"
            echo ""
            echo "- versionName：$NAME_VER"
            echo "- versionCode：$CODE"
            echo "- sha256：$SHA"
            echo ""
          } > /tmp/notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=同版本号已发布过::$RELEASE_TAG 已存在。同号只能配同一批字节；变了就提 versionCode 再打新 tag。字节没变而只是重跑，那说明这次构建不是必要的。"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$APK#$ASSET" \
            --title "lob-os $NAME_VER" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA"
          echo ""
          echo "发布完成："
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].url'

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/diag
          cp -f /tmp/gradle-build.log /tmp/diag/ 2>/dev/null || true
          cp -f /tmp/node-build.log /tmp/diag/ 2>/dev/null || true
          mkdir -p /tmp/diag/baselibs
          for f in work/baselibs/*.log; do
            [ -f "$f" ] && cp -f "$f" /tmp/diag/baselibs/ || true
          done
          for f in work/baselibs/prefix/lib work/baselibs/openssl/lib work/baselibs/curl/lib/.libs; do
            [ -d "$f" ] && ls -la "$f" > "/tmp/diag/baselibs/$(echo "$f" | tr '/' '_').txt" 2>/dev/null || true
          done
          find work -maxdepth 2 -name '*.log' 2>/dev/null | head -20 | while read -r f; do
            cp -f "$f" /tmp/diag/ 2>/dev/null || true
          done
          ls -laR /tmp/diag/ || true

      - name: Upload failure diagnostics artifact (backup)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: /tmp/diag/
          if-no-files-found: warn
          retention-days: 7