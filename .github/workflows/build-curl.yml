name: Build curl

# 编 curl 8.22.0 —— 依赖 openssl 与 zlib（见 component-sources.json 的 deps）。
# 基础件：随 APK 内置，但由本 workflow 编一次、固化到 Release，APK 只取不编。
on:
  # 只手动：「我现在要构建这一件」。
  # 件是独立的 —— 不由 push 触发。详见 RELEASE-POLICY.md。
  workflow_dispatch: {}

concurrency:
  group: curl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 各 workflow 都调它。
          bash scripts/toolchain/piece-key.sh curl

      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
          && gh release download "$TAG" --repo "${{ github.repository }}" \
             --pattern "$ASSET" --dir dist >/dev/null 2>&1 \
          && [ -f "dist/$ASSET" ]; then
            echo "[ok] 固化产物已存在，直接复用：$ASSET（tag=$TAG）"
            mkdir -p container/app/src/main/jniLibs/arm64-v8a
            tar xzf "dist/$ASSET" -C container/app/src/main/jniLibs/arm64-v8a
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi

      # curl 的 configure 要 openssl 与 zlib 的头文件（--with-openssl/--with-zlib
      # 指向 work/<id>/out）。这两个是它的**编译期**依赖：在这里现编，
      # 固化的是 curl 自己。
      - name: 先编编译期依赖（zlib · openssl）
        if: steps.reuse.outputs.hit != 'yes'
        run: |
          bash scripts/recipes/build-piece-zlib.sh
          bash scripts/recipes/build-piece-openssl.sh
      - name: 编 curl
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-piece-curl.sh

      - name: 固化到 Release 预制品
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          STAGE="dist/.cap-${{ github.run_id }}"
          mkdir -p "$STAGE"
          for f in container/app/src/main/jniLibs/arm64-v8a/*; do
            [ -f "$f" ] && cp -f "$f" "$STAGE/"
          done
          ( cd "$STAGE" && find . -type f -exec touch -h -t 198001010000.00 {} + )
          ( cd "$STAGE" && tar czf "../$ASSET" . )
          sha256sum "dist/$ASSET" | cut -d' ' -f1 > "dist/$ASSET.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "curl 固化产物" --notes "编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 已固化 $ASSET 到 $TAG"
