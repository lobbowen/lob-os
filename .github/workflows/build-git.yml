name: Build Component · git

on:
  # ── 触发方式 ──
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch:
    inputs:
      # 强制重编：复用判据看的是 asset 名（依赖版本 + 补丁），不含构建脚本本身。
      # 改了 build-component-*.sh 却复用旧预制品，就会「看起来成功、其实没编」。
      force:
        description: '强制重编（忽略 Release 里的预制品）'
        type: boolean
        default: false

concurrency:
  group: git-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi


  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 恢复 NDK 缓存（由 ndk-cache job 备好；这里只取）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}
      - name: 取 NDK（命中则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh
      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh
      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh git
      - name: 已发布就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "[force] 强制重编：忽略 Release 里的预制品"
            echo "hit=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
             && gh release download "$TAG" --repo "${{ github.repository }}" \
                  --pattern "$ASSET" --dir dist >/dev/null 2>&1 \
             && [ -f "dist/$ASSET" ]; then
            echo "[ok] 预制品已存在，直接复用：$ASSET（tag=$TAG）"
            mv "dist/$ASSET" "dist/component-git.zip"
            [ -f "dist/$ASSET.sha256" ] && mv "dist/$ASSET.sha256" "dist/component-git.zip.sha256" || true
            #  缺陷名（C-102）**按名硬取**：=> 而那旧版逐字是 `tar xzf "dist/component-git.zip" -C dist`
            #    => 而那**文件名后缀**逐字是 .zip 而那命令逐字是 tar xzf、
            #    => 而那**内容**逐字是 tar.gz（=> 而那那一条 tar xzf 在 zip 内容上逐字解不开）。
            #    => 而那「哪一层才算那一颗件」那一格**归 01 裁**（=> 而本处**不**拍板）。
            #  => 而按 C-994「判别源必须唯一」：=> 而那一格逐字**调** scripts/toolchain/fmt.sh。
            bash scripts/toolchain/unpack-piece.sh "dist/component-git.zip" dist
            ls -la dist/ | sed 's/^/  /'
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 恢复本件的编译中间产物（命中则增量编，不重跑 Configure）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            work/git-src
            # git 依赖 base 筐里的 zlib / openssl / curl 三个件（链它们的 .so，不静态塞 .a），
            # 下面是这三件的构建输出目录 —— build-shared-deps.sh 已删，
            # work/deps 与 work/deps-curl 都不会再被生成
            work/zlib/out
            work/openssl/out
            work/curl/out
            dist/component-git-*.zip
          key: ${{ steps.uwkey.outputs.key }}
      - name: 编 base 筐的预装件（git 依赖其中的 zlib / openssl / curl）
        if: steps.reuse.outputs.hit != 'yes'
        run: |
          set -euo pipefail
          # git 的 DT_NEEDED 只有 libcurl.so / libssl.so / libcrypto.so / libz.so ——
          # 也就是 base 筐里的 curl / openssl / zlib 三件。只编这三件，
          # 不必编齐 11 件（那既慢，又把无关件的失败带进来）。
          # 依赖从 work/<件名>/out 取 —— 那是 configure 想要的前缀形状
          # （build-bundle-curl.sh 找 openssl/zlib 就是这么找的）。
          bash scripts/toolchain/ensure-native-capabilities.sh --only=zlib --only=openssl --only=curl
      - name: 产出 git 件（仅在需要编时）
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-component-git.sh
      - name: 复用那一支也要有那版本号
        if: steps.reuse.outputs.hit == 'yes'
        run: |
          set -euo pipefail
          #  缺陷名（C-102）**那一支逐字没有那版本号、=> 而而那它逐字是打包那一支**必须**有的一样东西** ——
          #    => 而那旧版逐字**没有**这一步、=> 而而那「打包 + sha256」逐字**照跑**
          #      => 而那 `package-component.sh:12` 逐字 `VER=$(cat "dist/${TOOL}.version" …)`
          #         逐字读不到、=> 而而那它逐字 `die "缺版本号：dist/git.version 不在或为空"`
          #      => 而而那**复用**那一支逐字**不编译**、=> 而而那那**编译**那一支产的
          #         `dist/git.version` 逐字**不在**、=> 而而那它逐字**缺**
          #    => 而那**处置**：=> 而那**复用**那一支逐字**自己**写那版本号
          #      => 而而那它逐字**从那钉值表**逐字取（=> 而那 `fetch-pinned.sh --src-version` 那一族
          #         逐字是**纯查表**、=> 而而那它逐字**不**下载、=> 而而那它逐字**不**要求那一趟去编）
          #      => 而而那它逐字**是**那**同一份事实**（=> 而那 `package-component.sh` 那一格逐字
          #         逐字拿那钉值表逐字比那本产物那一份、=> 而而那两者逐字**应该**一致）
          #      => 而而那它逐字**读不到**时逐字**报缺**（=> 而按 C-05 不猜填、=> 而**不**编一个值）
          VER="$(bash scripts/toolchain/fetch-pinned.sh --src-version git 2>/dev/null || true)"
          [ -n "$VER" ] || { echo "::error title=缺版本号::钉值表那 git 那一格逐字读不到版本号 —— 不编值"; exit 1; }
          mkdir -p dist
          printf '%s\n' "$VER" > "dist/git.version"
          echo "[git] 复用那一支的版本号 = $VER（从钉值表取的，与编译那一支写的是同一份事实）"
      - name: 件形态校验（aarch64 动态件 / 解释器入口形状）
        run: bash scripts/verify/verify-component-artifact.sh git
      - name: 打包 + sha256
        run: bash scripts/recipes/package-component.sh git
      - name: 验形态（包自描述：库还是程序）
        run: |
          set -euo pipefail
          PKG="$(ls dist/component-git-*.zip 2>/dev/null | head -1 || true)"
          [ -n "$PKG" ] || { echo "::error title=没有标准包::build 脚本没产出 dist/component-git-*.zip"; exit 1; }
          bash scripts/verify/verify-piece-shape.sh "$PKG" program
      - name: 存回编译中间产物（供下一轮增量编）
        if: always()
        #  缺陷名（C-102）**那一格逐字让那缓存配额逐字把那一趟逐字判红、=> 而而那它逐字**不该**挡那产物**
        #    => 而那旧版逐字**没有**这一行
        #      => 而而那那 `actions/cache/save@v4` 逐字**失败**逐字**就是**那一步逐字**失败**
        #        => 而而那那**原话**逐字是（Lead 本机实读逐字核过）：
        #          `Failed to save: Unable to reserve cache with key uw-pkgconf-nodeps-…, anot…`
        #          / `##[warning]Cache save failed.`
        #        => 而而那那**配额**逐字是 GitHub 那一族、=> 而而那它逐字**不归**我们改
        #      => 而而那那**后果**：=> 而而那那**产物**逐字**已经**逐字做成、
        #        => 而而那那**存回缓存**逐字**在**那**上传那 artifact 逐字**之前**
        #          （=> 而那那 `upload-artifact` 逐字在 `:180`、=> 而而那那 `cache/save` 逐字在 `:117`）
        #        => 而而那那缓存逐字**存不下**逐字**就**把那一趟逐字**判红**、
        #          => 而而那那 **artifact 逐字根本没传上去**
        #      => 而而那那**恢复**那一格逐字**有** `continue-on-error: true`
        #        （=> 而而那那**存**那一格逐字**没有**、=> 而而那那两边逐字**不对称**）
        #    => 而那**判据**逐字是「那一趟逐字失败逐字有没有逐字影响那产物本身」那一个事实上
        #      => 而而那那**缓存**逐字**只是**省时间、=> 而而那它逐字**不是**那产物
        #    => 而那**处置**：=> 而而那那**存**那一格逐字**也** `continue-on-error: true`
        #      => 而而那那**存不下**逐字**只是**那一步逐字**警告**、=> 而而那那一趟逐字**继续**往下走
        #      => 而而那那**产物**逐字**照旧**传上去
        #    => 而那**归属**：=> 而而那那**配额**逐字归 GitHub（=> 而而那它逐字**不归**我们改）、
        #      => 而而那那**缓存**逐字**只是**省时间、=> 而而那它逐字**不**成为那发布轮逐字的**阻塞点**
        #      （=> 而那那发布轮逐字要的是那 artifact 逐字**在**、=> 而而那它逐字**不是**那缓存）
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/git-src
            work/zlib/out
            work/openssl/out
            work/curl/out
            dist/component-git-*.zip
          key: ${{ steps.uwkey.outputs.key }}

      - name: 发布本件预制品到 Release（编过就留，后轮直接复用）
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          PW="work/pw-git"
          rm -rf "$PW" && mkdir -p "$PW"
          tar czf "$PW/$ASSET" -C dist --exclude '*.tar.gz' --exclude '*.version' --exclude 'SHA256SUMS' .
          ( cd "$PW" && sha256sum "$ASSET" > "$ASSET.sha256" )
          {
            echo "预制品：git"
            echo "Release tag：$TAG"
            echo "NDK：$(bash scripts/toolchain/fetch-pinned.sh --ndk)"
            echo "NDK 内置 LLVM：$(bash scripts/toolchain/fetch-pinned.sh --llvm)"
            echo "API 级别：23"
            echo "缓存 key：${{ steps.uwkey.outputs.key }}"
            echo "构建 run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 这份预制品的编译依据"
            echo ""
            echo "下面这串是 cache-key.sh 算出来的，**含本件依赖的全部源码钉值**："
            echo "改动其中任一版本（或补丁 sha）都会换 tag，从而自动重新编译一次；"
            echo "没改动就直接复用本预制品。"
            echo ""
            echo '```'
            echo "${{ steps.uwkey.outputs.key }}"
            echo '```'
          } > "$PW/BUILD.md"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "component git — $TAG" \
              --notes "编译一次、长期复用的 git 预制品。构建链优先复用本件，不再重复编译。BUILD.md 记录了这份预制品的编译依据。"
          fi
          gh release upload "$TAG" "$PW"/* --repo "${{ github.repository }}" --clobber
          echo "[ok] 已发布 $TAG"

      - name: 发布 git 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/component-git-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/publish/upload-qiniu.js "$f" "component/$(basename "$f")" --cache-control=31536000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: component-git
          path: dist/component-git-*.zip
          retention-days: 30
