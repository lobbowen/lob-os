name: Build Isolated APK (新项目独立包 · 与设备上的旧程序完全无关 · 装完怎么验见 components/VERIFY-ON-DEVICE.md)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: '本包的 applicationId（必须是新项目自己的，与设备上任何旧包都不同）'
        required: true
        default: 'lobos.os'
      alias:
        description: '本包的密钥别名'
        required: true
        default: 'lobos-os'
      self_signed:
        description: '自签供给模式：填设备能访问到的供给基址（如 http://127.0.0.1:8121）。留空则用正式商店。填了就签一份自签清单并把包里的信任根换成对应的测试公钥 —— 用来在没有正式凭据时于真机上验完整供给链路'
        required: false
        default: ''

concurrency:
  group: build-isolated-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Show Android SDK env
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}" | tr -d '\r'
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" | tr -d '\r'
          ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "[ok] SDK 包就绪"

      - name: 编译底座共享库所需的宿主工具（cmake）
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake >/dev/null
          }
          command -v cmake >/dev/null 2>&1 || { echo "::error title=无 cmake::zlib 共享库编不出来"; exit 1; }
          echo "[ok] cmake $(cmake --version | head -1)"

      - name: 造一把本项目自己的 keystore（不复用任何旧包身份）
        id: ks
        run: |
          set -euo pipefail
          KS=keys/lobos-os.keystore
          mkdir -p keys
          if [ -f "$KS" ]; then
            echo "[info] 已存在，沿用（换 keystore 等于换身份，会让已装的本项目包失效）"
          else
            keytool -genkeypair -v \
              -keystore "$KS" -storepass lobos-os -keypass lobos-os \
              -alias '${{ inputs.alias }}' -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LobOS, OU=shell, O=lobos, C=CN"
            echo "[ok] 已生成 $KS（新项目自己的身份，与设备上任何旧包无关）"
          fi
          keytool -exportcert -rfc -keystore "$KS" -storepass lobos-os \
            -alias '${{ inputs.alias }}' -file keys/lobos-os.cert
          echo "[ok] 证书锚点 keys/lobos-os.cert（verify-apk-signing.sh 的 --cert 用它）"
          echo "ks=$KS" >> "$GITHUB_OUTPUT"

      - name: 自签准备（仅 self_signed 非空时）
        if: ${{ inputs.self_signed != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERLAND_BASE_URL: ${{ inputs.self_signed }}
          E2E_PRIVATE_KEY_PEM: ${{ secrets.E2E_PRIVATE_KEY_PEM }}
          E2E_PUBLIC_KEY_PEM: ${{ secrets.E2E_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          echo "── 取 7 个件的 artifact ──"
          mkdir -p dist
          for t in curl git jq npm pnpm sqlite3 node; do
            ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=userland-$t&per_page=1" \
                  --jq '.artifacts[0].id // empty')
            if [ -z "$ID" ]; then
              echo "::error title=没有 userland-$t 的 artifact::先跑 Build Userland（node 那颗需要 Node Runtime 的制品）"
              exit 1
            fi
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > "art-$t.zip"
            ( cd dist && unzip -o -q "../art-$t.zip" )
            echo "  $t: $(ls dist | grep "userland-$t" | head -1)"
          done
          N=$(ls dist/*.zip 2>/dev/null | wc -l)
          [ "$N" -ge 7 ] || { echo "::error title=件不够::期望 7 个（6 件工具链 + node），实到 $N"; exit 1; }
          echo "  共 $N 个件包"

          echo "── 自签密钥对（优先用 secret 里的固定那把）──"
          if [ -n "${E2E_PRIVATE_KEY_PEM:-}" ] && [ -n "${E2E_PUBLIC_KEY_PEM:-}" ]; then
            printf '%s\n' "$E2E_PUBLIC_KEY_PEM" > keys/e2e-public.pem
            printf '%s\n' "$E2E_PRIVATE_KEY_PEM" > keys/ota-private.pem
            echo "[ok] 用 secret 里的固定密钥对（包与供给服务才能长期配套）"
          else
            echo "::warning title=没有 E2E 密钥对 secret::本轮现生成一对 —— 这意味着**这次构建的包只能配这次构建产出的清单**。换一轮构建后，包里的信任根与服务供的清单就对不上了（验签失败，一件都装不上）。要么配 secret，要么每次都从本轮的 self-signed-supply-bundle 重新起供给服务。"
            node -e '
              const c = require("crypto"), fs = require("fs");
              const { publicKey, privateKey } = c.generateKeyPairSync("ed25519");
              fs.writeFileSync("keys/e2e-public.pem", publicKey.export({ type: "spki", format: "pem" }));
              fs.writeFileSync("keys/ota-private.pem", privateKey.export({ type: "pkcs8", format: "pem" }));
              console.log("[ok] ed25519 自签密钥对已生成");
            '
          fi

          echo "── 签清单（7 件全投影，含 node）──"
          LOBOS_USERLAND_REVISION=1 USERLAND_PUBKEY=keys/e2e-public.pem \
            node scripts/publish-userland-manifest.js dist release keys/ota-private.pem canary
          node -p "'  投影: ' + require('./release/userland-manifest.json').tools.map(t=>t.name+'@'+t.version+' '+t.entry).join(' | ')"

          echo "── 把信任根与通道锚换成自签那套 ──"
          A=container/app/src/main/assets
          cp -f keys/e2e-public.pem "$A/supply/userland-public.pem"
          cp -f keys/e2e-public.pem "$A/ota-public.pem"
          node -e '
            const fs = require("fs");
            const p = "container/app/src/main/assets/supply/channel.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.baseUrl = process.env.USERLAND_BASE_URL;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("[ok] channel.json.baseUrl =", j.baseUrl);
          '
          cat "$A/supply/channel.json"

      - name: Upload（自签的清单与件，供本机供给服务用）
        if: ${{ inputs.self_signed != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: self-signed-supply-bundle
          path: |
            release/
            dist/
            keys/e2e-public.pem
          retention-days: 14

      - name: 放置 C++ 运行期到 jniLibs
        run: |
          set -euo pipefail
          J=container/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$J"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          SRC="$(ls "$NDK"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so 2>/dev/null | head -1)"
          [ -f "$SRC" ] || { echo "::error title=缺 libc++_shared.so::NDK=$NDK"; exit 1; }
          cp -f "$SRC" "$J/libc++_shared.so"
          chmod +x "$J/libc++_shared.so"

      - name: node 运行时不入 APK
        run: |
          set -euo pipefail
          J=container/app/src/main/jniLibs/arm64-v8a
          if [ -e "$J/libnode.so" ]; then
            echo "::error title=jniLibs 里不该有 libnode.so::node 走商店通道"
            exit 1
          fi
          echo "[ok] jniLibs 无 libnode.so"

      - name: 小件原生件
        run: |
          set -euo pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          bash scripts/ensure-native-capabilities.sh
          ls -la container/app/src/main/jniLibs/arm64-v8a/

      - name: 原生件形态与依赖闭环（jniLibs/*.so）
        run: |
          set -euo pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          bash scripts/verify-runtime-elf.sh container/app/src/main/jniLibs/arm64-v8a

      - name: OTA 锚点判据（Ed25519 公钥必须能解析、能被设备验）
        run: bash scripts/verify-ota-anchor.sh

      - name: Build（独立 applicationId + 独立 keystore）
        id: gradlebuild
        env:
          LOBOS_KEYSTORE_PATH: keys/lobos-os.keystore
          LOBOS_KEYSTORE_PASSWORD: lobos-os
          LOBOS_KEY_PASSWORD: lobos-os
          LOBOS_KEY_ALIAS: ${{ inputs.alias }}
          LOBOS_APP_ID: ${{ inputs.app_id }}
        run: |
          set -o pipefail
          S=container/app/src/main/res/values/strings.xml
          cp "$S" /tmp/strings.orig
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Lobos</string>|' "$S"
          echo "[label] app_name 现在是：$(grep 'name=\"app_name\"' "$S")"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: 配套自检（包里的信任根必须能验本轮产出的清单）
        if: ${{ inputs.self_signed != '' }}
        run: |
          set -euo pipefail
          APK="$(ls container/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::warning title=没有 APK 可自检::跳过（本步在 Build 之后、此时应有产物）"
            exit 0
          fi
          PUB=container/app/src/main/assets/supply/userland-public.pem
          node -e '
            const fs=require("fs"), c=require("crypto");
            const pub=fs.readFileSync(process.argv[1],"utf8");
            const body=fs.readFileSync("release/userland-manifest.json");
            const sig=Buffer.from(fs.readFileSync("release/userland-manifest.json.sig","utf8").trim(),"base64");
            if (!c.verify(null, body, pub, sig)) {
              console.error("::error title=包与清单不配套::包里的 userland-public.pem 验不过本轮签出的清单 —— 装上去会一件都装不上（验签失败）");
              process.exit(1);
            }
            console.log("[ok] 包里的信任根能验本轮清单（配套成立）");
          ' "$PUB"

      - name: 产物形态校验（APK 条目 vs 三份声明表）
        run: |
          set -uo pipefail
          APK="$(ls container/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "::error title=没有 APK 可审"; exit 1; fi
          bash scripts/verify-apk-native.sh "$APK" arm64-v8a

      - name: 验签（确认签的是并存那把，不是开发包的）
        run: |
          set -uo pipefail
          APK="$(ls container/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "::error title=没有 APK 可验"; exit 1; fi
          bash scripts/verify-apk-signing.sh "$APK" --cert keys/lobos-os.cert
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | head -1)"
          if [ -n "$APKSIGNER" ]; then
            echo "── 签名身份 ──"
            "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | head -4 || true
          fi
          echo "── APK 里的 applicationId ──"
          GOT=""
          for BIN in "$SDK"/build-tools/*/aapt2 "$SDK"/build-tools/*/aapt; do
            [ -x "$BIN" ] || continue
            for probe in "dump packagename" "dump badging"; do
              OUT="$("$BIN" $probe "$APK" 2>/dev/null | head -3 || true)"
              case "$OUT" in
                *"package: name="*)
                  GOT="$(printf '%s' "$OUT" | sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
                  ;;
                *"${{ inputs.app_id }}"*) GOT="${{ inputs.app_id }}" ;;
              esac
              [ -n "$GOT" ] && break
            done
            [ -n "$GOT" ] && break
          done
          echo "读到的 applicationId: ${GOT:-（读不出来）}"
          if [ -z "$GOT" ]; then
            echo "::warning title=读不出 APK 的 applicationId::工具不可用或输出格式变了；请人工用 aapt dump badging 核对"
          elif [ "$GOT" = "lobos.app" ]; then
            echo "::error title=applicationId 仍是 lobos.app::与开发包同名，装上去会变成覆盖安装（签名不同会直接失败）。检查 LOBOS_APP_ID 是否传到了 gradle。"
            exit 1
          else
            echo "[ok] applicationId=$GOT 与设备上的 lobos.app 不同 ⇒ 两个应用并存，不会覆盖开发包"
          fi
          echo "── APK 里的应用名（label）──"
          LABEL=""
          for BIN in "$SDK"/build-tools/*/aapt2 "$SDK"/build-tools/*/aapt; do
            [ -x "$BIN" ] || continue
            OUT="$("$BIN" dump badging "$APK" 2>/dev/null | head -20 || true)"
            LABEL="$(printf '%s' "$OUT" | sed -n "s/.*application-label:'\\([^']*\\)'.*/\\1/p" | head -1)"
            [ -n "$LABEL" ] && break
          done
          echo "读到的 application-label: ${LABEL:-（读不出来）}"
          if [ "$LABEL" = "Lobos" ] || [ -z "$LABEL" ]; then
            echo "::warning title=应用名没改成「Lobos 验证」::桌面上会与开发包同名。装完用 am start -n ${{ inputs.app_id }}/lobos.ui.setup.SetupActivity 精确启动，别点桌面图标（同名时分不清）。"
          else
            echo "[ok] 应用名是「$LABEL」，桌面上与开发包可区分"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-isolated-${{ inputs.app_id }}
          path: container/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 装到设备（可选，需 adb 已连）
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          APK_GLOB: container/app/build/outputs/apk/debug/*.apk
        run: |
          set -uo pipefail
          if ! adb devices 2>/dev/null | grep -qE 'device$'; then
            echo "[note] 没有已连的 adb 设备，跳过安装（artifact 可自行 adb install）"
            exit 0
          fi
          echo "[note] 即将装 ${{ inputs.app_id }} —— 它与设备上现有的 lobos.app 是两个应用，互不覆盖"
          adb install -r "$(ls $APK_GLOB | head -1)" || echo "[warn] 安装失败（可能签名/版本冲突），artifact 仍可用"
