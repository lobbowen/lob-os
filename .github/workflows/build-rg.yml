name: Build rg

# 这一条编 rg，产出固化到 Release。APK 链只取用，不现场编。
on:
  # ── 触发方式 ──
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch: {}

concurrency:
  group: rg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识
        id: uwkey
        run: |
          set -euo pipefail
          # 三件（bash / ripgrep / busybox）同属 base 筐，都在
          # list-bucket-components.js 的清单里；build-apk.yml 也现场编它们。
          # asset 名由 cache-key.sh 算（依赖版本 + 补丁摘要 + NDK + API），
          # 与「已固化就复用」那一步取的是同一个 —— 两处必须同源。
      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "[ok] 固化产物已存在（tag=$TAG）"
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 编 rg
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-piece-rg.sh

      - name: 固化到 Release 预制品
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          STAGE="dist/.cap-${{ github.run_id }}"
          mkdir -p "$STAGE"
          for f in container/app/src/main/jniLibs/arm64-v8a/*; do
            [ -f "$f" ] && cp -f "$f" "$STAGE/"
          done
          ( cd "$STAGE" && find . -type f -exec touch -h -t 198001010000.00 {} + )
          ( cd "$STAGE" && tar czf "../cap-${ASSET}.tar.gz" . )
          SHA="$(sha256sum "dist/cap-${ASSET}.tar.gz" | cut -c1-12)"
          NAME="cap-${ASSET}-${SHA}.tar.gz"
          mv "dist/cap-${ASSET}.tar.gz" "dist/$NAME"
          sha256sum "dist/$NAME" | cut -d' ' -f1 > "dist/$NAME.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "rg 固化产物" --notes "编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 已固化 $NAME 到 $TAG"
