name: Build ripgrep (rg)

# 这一条编 rg，产出固化到 Release。APK 链只取用，不现场编。
on:
  # ── 触发方式 ──
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch: {}

concurrency:
  group: ripgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh ripgrep
      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "[ok] 固化产物已存在（tag=$TAG）"
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 编 rg
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-piece-rg.sh

      - name: 固化到 Release 预制品
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          STAGE="dist/.cap-${{ github.run_id }}"
          mkdir -p "$STAGE"
          for f in container/app/src/main/jniLibs/arm64-v8a/*; do
            [ -f "$f" ] && cp -f "$f" "$STAGE/"
          done
          ( cd "$STAGE" && find . -type f -exec touch -h -t 198001010000.00 {} + )
          ( cd "$STAGE" && tar czf "../$ASSET" . )
          # 资产名就是 cache-key.sh 算出来的那个 —— 不加 cap- 前缀也不加 sha 后缀：
          # sha256 已经作为独立资产上传，重复塞进文件名只会让两边算法不一致时对不上。
          sha256sum "dist/$ASSET" | cut -d' ' -f1 > "dist/$ASSET.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "rg 固化产物" --notes "编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 已固化 $ASSET 到 $TAG"
