# 一次性：把发布签名材料写成仓库 secret。
#
# 为什么不用本地脚本加密：GitHub 的 secret 用 libsodium sealed box
# （crypto_box_seal，X25519 公钥）。我手工做的两次密文 GitHub 都解不开
# —— job 里读到的是长度 0。这条路交给官方实现（gh secret set），
# 它保证与 GitHub 侧一致。
#
# 密钥本身是 CI 刚生成的（见 bootstrap-signing-key.yml），经 artifact
# 交回后在下一条 job 里转成 secret。本机不接触密钥明文。
name: Set signing secrets (一次性)

on:
  workflow_dispatch:
    inputs:
      # 仓库 token（需 admin）—— 它用来调 gh secret set 写 secret。
      # 用 dispatch 参数传而不是 secret：这次要写的正是 secret 本身，
      # 还没写进去的 secret 没法给自己授权。
      admin_token:
        description: '仓库 admin token（用于 gh secret set）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 取密钥 artifact（跨 run，用 API）
        env:
          GH_TOKEN: ${{ inputs.admin_token }}
        run: |
          set -euo pipefail
          # download-artifact@v4 只能取**当前 run** 的产物，而密钥是上一条
          # workflow 生成的 —— 跨 run 取不到（报 Artifact not found for name）。
          # 走 API：按名字找最新的、没过期的那个。
          AID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=release-signing-key" --jq '[.artifacts[] | select(.expired_at == null)] | sort_by(.created_at) | last | .id')"
          [ -n "$AID" ] || { echo "::error::没有活着的 release-signing-key artifact"; exit 1; }
          echo "[keys] 用 artifact $AID"
          gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > keys.zip
          unzip -q -o keys.zip -d keys && rm -f keys.zip
          ls -la keys/
      - name: 写五个 secret
        env:
          GH_TOKEN: ${{ inputs.admin_token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . keys/keystore.properties
          test -s keys/release.keystore || { echo "::error::密钥不在"; exit 1; }
          gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 keys/release.keystore)
          gh secret set ANDROID_KEYSTORE_PASSWORD --body "$LOBOS_KEYSTORE_PASSWORD"
          gh secret set ANDROID_KEY_ALIAS       --body "$LOBOS_KEY_ALIAS"
          gh secret set ANDROID_KEY_PASSWORD    --body "$LOBOS_KEY_PASSWORD"
          echo "::notice::四个签名 secret 已写入"
          gh secret set APK_PUBLISH_TOKEN --body "$GH_TOKEN"
          echo "::notice::五个 secret 全部写入"
          echo "::notice::下一步：打 os-release-0.0.1 tag 触发发布轮"
          echo "::notice::本 workflow 至此为止，不要再跑 —— 密钥一旦发布就永不更换"
