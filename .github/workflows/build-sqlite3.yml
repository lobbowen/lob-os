name: Build Component · sqlite3

on:
  # -- 触发方式 --
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch: {}

concurrency:
  group: sqlite3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（it 落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi


  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 恢复 NDK 缓存（由 ndk-cache job 备好；这里只取）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}
      - name: 取 NDK（命中则 0 下载；未命中才 sdkmanager 装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh
      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh
      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh sqlite
      - name: 已发布就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
             && gh release download "$TAG" --repo "${{ github.repository }}" \
                  --pattern "$ASSET" --dir dist >/dev/null 2>&1 \
             && [ -f "dist/$ASSET" ]; then
            echo "[ok] 预制品已存在，直接复用：$ASSET（tag=$TAG）"
            mv "dist/$ASSET" "dist/component-sqlite3.zip"
            [ -f "dist/$ASSET.sha256" ] && mv "dist/$ASSET.sha256" "dist/component-sqlite3.zip.sha256" || true
            #  缺陷名（C-102）**按名硬取**：=> 而那旧版逐字是 `tar xzf "dist/component-sqlite3.zip" -C dist`
            #    => 而那**文件名后缀**逐字是 .zip 而那命令逐字是 tar xzf、
            #    => 而那**内容**逐字是 tar.gz（=> 而那一条 tar xzf 在 zip 内容上逐字解不开）。
            #    => 而那「哪一层才算那一颗件」那一格**归 01 裁**（=> 而本处**不**拍板）。
            #  => 而按 C-994「判别源必须唯一」：=> 而那一格逐字**调** scripts/toolchain/fmt.sh。
            #  缺陷名（C-102）**那一格逐字让那**旧件**留在那 `dist/` 里、=> 而而那那 artifact 逐字**里面**逐字就有那**两颗**同名件**
            #    => 而那旧版逐字**没有**这一行
            #      => 而那**缓存**逐字存的那 `dist/component-sqlite-*.zip` 逐字（=> 而那**缓存命中**时逐字**恢复**回来）
            #        逐字**包括**那**上一轮**逐字**解开**出来的那**内层**那一份
            #        （=> 而那**内层**那一份逐字**带着**那版本号与那指纹、=> 而那名字逐字**就是**那 `component-<件>-<版>-<指纹>-…zip`）
            #      => 而那**复用**这一路逐字又从那 Release 逐字**解开**一份（=> 而那**版本一样**、=> 而那**指纹**逐字**可能不同**）
            #      => 而那**上传**那一格逐字那 path 逐字是 `dist/component-sqlite-*.zip`
            #        => 而那**两颗**逐字**都**进那 artifact
            #      => 而那**后果**（06 本机实读那 job log、Lead 本机实读逐字复核成立）：
            #        `::[error]component-sqlite 里有 2 颗 sqlite 的 zip:`
            #        `  component-sqlite-3.53.4-087255f116d8-android-arm64.zip`
            #        `  component-sqlite-3.53.4-43a13ff2387e-android-arm64.zip`
            #        `::[error]逐件判断它们哪颗是本轮编的 —— 那份 artifact 不该收进清单`
            #    => 而那**判据**逐字是「那 artifact 逐字里那内层 zip 逐字是不是只含那**本轮编的**那一颗」
            #      （=> 而那它逐字**不**许逐字靠逐字猜、=> 而那它逐字**要**按那指纹逐字挑那一颗）
            #    => 而那**处置**：=> 而那**旧件**逐字**解开之前**就逐字清掉
            #      => 而那 `dist/` 逐字**只**留那**这一轮**逐字**解开**出来的那一颗
            #      => 而那 artifact 逐字**里面**逐字**只有**那一颗、=> 而那**多颗**那一族逐字**不再**触发
            #    => 而那**归属**：=> 而那**清**逐字归 **05**；=> 而那**读数**归 **06** 与 **07**。
            rm -f dist/component-sqlite-*.zip
            bash scripts/toolchain/unpack-piece.sh "dist/component-sqlite3.zip" dist
            ls -la dist/ | sed 's/^/  /'
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 恢复本件的编译中间产物（命中则增量编，不重跑 Configure）
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            work/sqlite
            #  缺陷名（C-102）**那缓存逐字把那**内层**那一份逐字也逐字存进去、=> 而而那它逐字**本来**不该被缓存**
            #    => 而那旧版逐字是 `dist/component-sqlite3-*.zip`
            #      => 而那 glob 逐字**要**那连字符后面逐字**有**东西、=> 而那**外层**那一份逐字**没有**
            #        （=> 而那**外层**那一份逐字是 `dist/component-sqlite3.zip`、=> 而那**内层**那一份逐字
            #          逐字是 `dist/component-sqlite-<版>-<指纹>-android-arm64.zip`）
            #      => 而那 glob 逐字**两**份逐字**都**命中不到、=> 而那**缓存**逐字**存不下**那外层
            #        => 而那**缓存命中**逐字**不**可能、=> 而那**内层**逐字**不在**那缓存里
            #      => 而那**判据**逐字是「那上传进那 artifact 逐字里的那内层 zip 逐字是不是只含那**本轮编的**那一颗」
            #        那一个事实上（=> 而那它逐字**不**由「那一件逐字是什么」顶掉）
            #    => 而那**处置**：=> 而那缓存逐字**只**存那**外层**那可复用的那一份
            #      => 而那**内层**解出来的那一份逐字**不**进缓存
            #        （=> 而那内层逐字是那**一次构建**的产物、=> 而那它逐字本来逐字**不该**被缓存）
            dist/component-sqlite3.zip
          key: ${{ steps.uwkey.outputs.key }}
      - name: 产出 sqlite3 件（仅在需要编时）
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-component-sqlite3.sh
      - name: 件形态校验（aarch64 动态件 / 解释器入口形状）
        run: bash scripts/verify/verify-component-artifact.sh sqlite
      - name: 打包 + sha256
        run: bash scripts/recipes/package-component.sh sqlite
      - name: 存回编译中间产物（供下一轮增量编）
        if: always()
        #  缺陷名（C-102）**那一格逐字让那缓存配额逐字把那一趟逐字判红、=> 而而那它逐字**不该**挡那产物**
        #    => 而那旧版逐字**没有**这一行
        #      => 而那 `actions/cache/save@v4` 逐字**失败**逐字**就是**那一步逐字**失败**
        #        => 而那**原话**逐字是（Lead 本机实读逐字核过）：
        #          `Failed to save: Unable to reserve cache with key uw-pkgconf-nodeps-…, anot…`
        #          / `##[warning]Cache save failed.`
        #        => 而那**配额**逐字是 GitHub 那一族、=> 而那它逐字**不归**我们改
        #      => 而那**后果**：=> 而那**产物**逐字**已经**逐字做成、
        #        => 而那**存回缓存**逐字**在**那**上传那 artifact 逐字**之前**
        #          （=> 而那 `upload-artifact` 逐字在 `:180`、=> 而那 `cache/save` 逐字在 `:117`）
        #        => 而那缓存逐字**存不下**逐字**就**把那一趟逐字**判红**、
        #          => 而那 **artifact 逐字根本没传上去**
        #      => 而那**恢复**那一格逐字**有** `continue-on-error: true`
        #        （=> 而那**存**那一格逐字**没有**、=> 而那两边逐字**不对称**）
        #    => 而那**判据**逐字是「那一趟逐字失败逐字有没有逐字影响那产物本身」那一个事实上
        #      => 而那**缓存**逐字**只是**省时间、=> 而那它逐字**不是**那产物
        #    => 而那**处置**：=> 而那**存**那一格逐字**也** `continue-on-error: true`
        #      => 而那**存不下**逐字**只是**那一步逐字**警告**、=> 而那一趟逐字**继续**往下走
        #      => 而那**产物**逐字**照旧**传上去
        #    => 而那**归属**：=> 而那**配额**逐字归 GitHub（=> 而那它逐字**不归**我们改）、
        #      => 而那**缓存**逐字**只是**省时间、=> 而那它逐字**不**成为那发布轮逐字的**阻塞点**
        #      （=> 而那发布轮逐字要的是那 artifact 逐字**在**、=> 而那它逐字**不是**那缓存）
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/sqlite
            dist/component-sqlite3.zip
          key: ${{ steps.uwkey.outputs.key }}

      - name: 发布本件预制品到 Release（编过就留，后轮直接复用）
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          PW="work/pw-sqlite3"
          rm -rf "$PW" && mkdir -p "$PW"
          tar czf "$PW/$ASSET" -C dist --exclude '*.tar.gz' --exclude '*.version' --exclude 'SHA256SUMS' .
          ( cd "$PW" && sha256sum "$ASSET" > "$ASSET.sha256" )
          {
            echo "预制品：sqlite3"
            echo "Release tag：$TAG"
            echo "NDK：$(bash scripts/toolchain/fetch-pinned.sh --ndk)"
            echo "NDK 内置 LLVM：$(bash scripts/toolchain/fetch-pinned.sh --llvm)"
            echo "API 级别：23"
            echo "缓存 key：${{ steps.uwkey.outputs.key }}"
            echo "构建 run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 这份预制品的编译依据"
            echo ""
            echo "下面这串是 cache-key.sh 算出来的，**含本件依赖的全部源码钉值**："
            echo "改动其中任一版本（或补丁 sha）都会换 tag，从而自动重新编译一次；"
            echo "没改动就直接复用本预制品。"
            echo ""
            echo '```'
            echo "${{ steps.uwkey.outputs.key }}"
            echo '```'
          } > "$PW/BUILD.md"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "component sqlite3 — $TAG" \
              --notes "编译一次、长期复用的 sqlite3 预制品。构建链优先复用本件，不再重复编译。BUILD.md 记录了这份预制品的编译依据。"
          fi
          gh release upload "$TAG" "$PW"/* --repo "${{ github.repository }}" --clobber
          echo "[ok] 已发布 $TAG"

      - name: 发布 sqlite3 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/component-sqlite3-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/publish/upload-qiniu.js "$f" "component/$(basename "$f")" --cache-control=31536000
          done
      #  缺陷名（C-102）**那一格逐字让那**旧件**进那 artifact、=> 而而那那 artifact 逐字**里面**逐字就有那**两颗**同名件**
      #    => 而那旧版逐字**没有**这一格
      #      => 而那**缓存恢复**逐字**在**最前那一段（=> 而那**外层**那一份逐字**恢复**回来）
      #      => 而那**复用**那一路逐字又**解开**一份（=> 而那**版本一样**、=> 而那**指纹**逐字**可能不同**）
      #      => 而那**编译**那一路逐字又**产出**一份（=> 而那**指纹**逐字**又是**另一个）
      #      => 而那**上传**那一格逐字那 path 逐字是 `dist/component-sqlite-*.zip`
      #        => 而那**所有**那旧件逐字**都**进那 artifact
      #      => 而那**后果**（06 本机实读那 job log、Lead 本机实读逐字复核成立）：
      #        `::[error]component-sqlite 里有 2 颗 sqlite 的 zip:`
      #        `  component-sqlite-<版>-<指纹>-android-arm64.zip`
      #        `  component-sqlite-<版>-<指纹>-android-arm64.zip`
      #        `::[error]逐件判断它们哪颗是本轮编的 —— 那份 artifact 不该收进清单`
      #      => 而那**判据**逐字是「那上传进那 artifact 逐字里的那内层 zip 逐字是不是只含那**本轮编的**那一颗」
      #        那一个事实上（=> 而那它逐字**不**由「那一件逐字是什么」顶掉）
      #    => 而那**处置**：=> 而那**上传**那一格逐字**之前**逐字把那**旧件**逐字清掉
      #      => 而那**清**逐字**不**逐字一刀切（=> 而那本轮编的那一颗逐字因为是最新逐字、
      #        => 而那它逐字**要**逐字保住）=> 而那**清**逐字**按**那**指纹**逐字挑那一颗
      #      => 而那**挑**逐字**按**那**修改时刻**（=> 而那**最新**逐字**就是**那本轮编的那一颗）
      - name: 只把本轮编的那一颗装进 artifact（清掉上一轮留下的）
        run: |
          set -euo pipefail
          # => 而那**候选**逐字是那 `dist/` 里逐字那 `component-sqlite-*.zip`
          mapfile -t _all < <(compgen -G "dist/component-sqlite-*.zip" || true)
          if [ "${#_all[@]}" -gt 1 ]; then
            # => 而那**最新**逐字就是那**本轮编**的那一颗（=> 而那它逐字按那修改时刻逐字**最新**）
            _keep=""
            for _f in "${_all[@]}"; do
              if [ -z "$_keep" ] || [ "$_f" -nt "$_keep" ]; then _keep="$_f"; fi
            done
            echo "[notice] 那 dist 里逐字有 ${#_all[@]} 颗同族件、=> 而那**留**最新那一颗：$_keep"
            for _f in "${_all[@]}"; do
              [ "$_f" = "$_keep" ] && continue
              echo "[notice] => 而那**旧件**逐字清掉：$_f"
              rm -f "$_f"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: component-sqlite
          #  缺陷名（C-102）**那上传逐字把**所有**那旧件逐字都装进去、=> 而而那那 artifact 逐字**里面**逐字就有那**两颗**同名件**
          #    => 而那旧版逐字是 `path: dist/component-sqlite-*.zip`
          #      => 而那 glob 逐字**把**那 `dist/` 里逐字**所有**那 `component-sqlite-*.zip` 逐字**都**装进去
          #      => 而那**后果**（06 本机实读那 job log、Lead 本机实读逐字复核成立）：
          #        `::[error]component-sqlite 里有 2 颗 sqlite 的 zip:`
          #        `  component-sqlite-<版>-<指纹>-android-arm64.zip`
          #        `::[error]逐件判断它们哪颗是本轮编的 —— 那份 artifact 不该收进清单`
          #      => 而那**处置**：=> 而那**上传**那一格逐字**之前**逐字把那**旧件**逐字清掉
          #        => 而那 `dist/component-sqlite-*.zip` 逐字**只**留那**本轮编的**那一颗
          #        => 而那**清**逐字**不能**逐字一刀切（=> 而那本轮编的那一颗逐字因为是最新逐字、
          #          => 而那它逐字**要**逐字保住）=> 而那**清**逐字**按**那**指纹**逐字挑那一颗
          #      => 而那**判据**逐字是「那上传进那 artifact 逐字里的那内层 zip 逐字是不是只含那**本轮编的**那一颗」
          #        那一个事实上（=> 而那它逐字**不**由「那一件逐字是什么」顶掉）
          path: dist/component-sqlite-*.zip
          retention-days: 30
