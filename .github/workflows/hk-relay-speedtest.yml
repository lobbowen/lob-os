name: HK Relay Speed Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: 部署测试脚本到香港机
        env:
          HK_HOST: 103.247.28.83
          HK_PASS: ${{ secrets.HK_SSH_PASS }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          cat > /tmp/hk_speedtest.sh <<'SCRIPT'
          set -e
          cd /tmp
          export QINIU_AK="$1" QINIU_SK="$2" QINIU_BUCKET="$3"
          export QINIU_PUBLIC_BASE="https://lobcdn.zll.ink"

          echo "[1] 香港机从 GitHub 下载一个小件（python 3.11 asset，先下 20MB）"
          URL=$(curl -sSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lobbowen/lob-os/releases/tags/rt-python-3.11" 2>/dev/null \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const a=(JSON.parse(d).assets||[]).filter(x=>x.name.endsWith(".zip"))[0];process.stdout.write(a?a.browser_download_url:"")}catch(e){}})')
          [ -n "$URL" ] || { echo "拿不到 asset URL"; exit 1; }
          curl -sSL --max-time 120 -o /tmp/test-piece.zip "$URL"
          echo "  下载 $(stat -c%s /tmp/test-piece.zip) 字节"

          echo "[2] 解出契约件包"
          bash /tmp/hk-relay/unpack-piece.sh /tmp/test-piece.zip /tmp/hk-relay/dist >/dev/null 2>&1 || true
          PIECE=$(find /tmp/hk-relay/dist -name 'component-python-*.zip' -type f 2>/dev/null | head -1)
          [ -n "$PIECE" ] || { echo "解包失败，直接用原包测"; PIECE=/tmp/test-piece.zip; }
          echo "  测试件 $(basename "$PIECE") $(stat -c%s "$PIECE") 字节"

          echo "[3] 香港上传到七牛（真实 upload-qiniu.js，测吞吐）"
          START=$(date +%s)
          node /tmp/hk-relay/upload-qiniu.js "$PIECE" "component/$(basename "$PIECE")" --cache-control=31536000 2>&1 | tail -5
          END=$(date +%s)
          echo "  上传耗时 $((END-START)) 秒，件大小 $(stat -c%s "$PIECE") 字节"

          echo "[4] 清理临时文件与凭证"
          rm -rf /tmp/hk-relay /tmp/test-piece.zip /tmp/hk_speedtest.sh
          unset QINIU_AK QINIU_SK QINIU_BUCKET
          SCRIPT

          # 上传必要脚本到香港机
          sshpass -p "$HK_PASS" ssh -o StrictHostKeyChecking=no root@$HK_HOST 'mkdir -p /tmp/hk-relay/scripts/publish /tmp/hk-relay/scripts/toolchain' >/dev/null 2>&1
          sshpass -p "$HK_PASS" scp -o StrictHostKeyChecking=no /tmp/hk_speedtest.sh root@$HK_HOST:/tmp/hk_speedtest.sh >/dev/null 2>&1
          sshpass -p "$HK_PASS" scp -o StrictHostKeyChecking=no scripts/publish/upload-qiniu.js root@$HK_HOST:/tmp/hk-relay/scripts/publish/ >/dev/null 2>&1
          sshpass -p "$HK_PASS" scp -o StrictHostKeyChecking=no scripts/toolchain/unpack-piece.sh root@$HK_HOST:/tmp/hk-relay/scripts/toolchain/ >/dev/null 2>&1
          sshpass -p "$HK_PASS" scp -o StrictHostKeyChecking=no scripts/toolchain/fmt.sh root@$HK_HOST:/tmp/hk-relay/scripts/toolchain/ >/dev/null 2>&1
          sshpass -p "$HK_PASS" scp -o StrictHostKeyChecking=no scripts/toolchain/cache-key.sh root@$HK_HOST:/tmp/hk-relay/scripts/toolchain/ >/dev/null 2>&1

          echo "=== 香港机测速开始 ==="
          sshpass -p "$HK_PASS" ssh -o StrictHostKeyChecking=no root@$HK_HOST \
            'bash /tmp/hk_speedtest.sh "$QINIU_AK" "$QINIU_SK" "$QINIU_BUCKET"' 2>&1
          echo "=== 香港机测速结束 ==="
