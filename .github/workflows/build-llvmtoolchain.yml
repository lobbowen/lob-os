name: Build Component · llvmtoolchain

on:
  # ── 触发方式 ──
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch: {}

concurrency:
  group: llvmtoolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi



  llvmtoolchain:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 取 NDK（命中缓存则 0 下载；未命中才装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh
      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh llvm

      - name: 问 NDK 它的 LLVM 版本（并与钉值核对）
        run: bash scripts/verify/verify-ndk-llvm.sh

      - name: 把实测到的 LLVM 版本写进摘要（供填 llvmVersion 用）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          CLANG="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/clang 2>/dev/null | head -1 || true)"
          if [ -n "$CLANG" ]; then
            "$CLANG" --version 2>/dev/null | head -3
            "$CLANG" --version 2>/dev/null \
              | sed -n 's/.*clang version \([0-9][0-9.]*\).*/实测 LLVM 版本 = \1/p'
            { echo "### NDK/LLVM 版本（填进 scripts/component-sources.json 的 llvmVersion）"; echo '```'; \
              "$CLANG" --version 2>/dev/null | head -3; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 读出 clang_source_info.md（NDK 内置 LLVM 的真实来源）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          SI="$(ls "$NDK"/toolchains/llvm/prebuilt/*/clang_source_info.md "$NDK"/clang_source_info.md 2>/dev/null | head -1 || true)"
          {
            echo "### clang_source_info.md"
            if [ -n "$SI" ]; then
              echo "路径：\`$SI\`"
              echo '```'
              cat "$SI"
              echo '```'
              echo "**llvmVersion 要按这份文件填**（它给的是 llvmorg- 对应的语义版本）。"
            else
              echo "**没找到 clang_source_info.md** —— 这一版 clang 的 LLVM 语义版本未知。"
              echo "此时 \`clang --version\` 里的 \`20.0.0git\` **不足以**作为同源依据"
              echo "（verify-ndk-llvm.sh 会 exit 2 并说明）。需要人工确认后再填。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清出磁盘空间（编 LLVM 要峰值空间，而 runner 自带的那些占了大头）
        if: success()
        run: |
          set -uo pipefail
          #  缺陷名（C-102）**那磁盘那一族逐字没有被定位、=> 而而那 05 那一笔只碰了它的一部分**
          #  —— 而实际上那 40247630569 与那 40255598542 那**两**趟逐字**症状**逐字**一模一样**
          #    （=> 而都是「No space left on device」），=> 而而那 40255598542 那一趟逐字**含**那 `rm -rf "$HOST_TB"` 那一笔。
          #  => 而那**成因**逐字**是**那 runner **自带**的**那些**大件**占**的**空间**：
          #    => 而那 Android SDK 那一族（=> 而它逐字**不是**那 NDK，=> 而 NDK 逐字**另**在**别**处**）逐字**几 GB**、
          #    => 而那 /usr/local/lib/android 那**旧** SDK 逐字**几 GB**、=> 而那 hostedtoolcache 那一族逐字**几 GB**。
          #  => 而那**编**这一族逐字**要**那**宿主**磁盘、=> 而而那**峰值**要**比**那**编完**的**产物**大**得多**。
          #  => 而那**处置**：=> 而而那**用不到**的逐字**先删**、=> 而而那**要留**的逐字**留**着**。
          #  => 而那**要留**的**只有**那 **NDK**（=> 而 NDK 逐字是**编**的**输入**、=> 而它**不能**删**）
          #    与那**这一个** job **要**的**那点**东西**。
          #  => 而按 C-103 那两边：「那**编**要**那**磁盘**空间**」与「那**取件**要**那**磁盘**空间**」
          #  => 而那两边各答一件事、=> 而而处置不一样、=> 而按 C-135 那不是同一问。
          #  => 而按 C-104：=> 而那**清**那一族逐字**只有**一条路、=> 而而那**不是**第二种生成路径。
          #  => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
          echo "== 清理前 =="
          df -h / 2>/dev/null | tail -1 || true

          #  那 Android SDK 那一族：=> 而那**其余**的逐字**这一趟**用**不到**、=> 而而那**要留**的**只有**那 **NDK**。
          #  => 而那**缺陷名**（C-102）**那留的**那个**目录逐字**不**在**那循环**看**的那**两个**根**底下**
          #  #  —— => 而那 07 那边逐字**核**到：那 40261838810 那一趟逐字那「NDK 保留：…」那一行**没**出现**、
          #  #  => 而那**留**的**那个**目录逐字**不**在**那循环**看**的**那**两个**根**底下、=> 而而那 runner 的 env 那一族
          #  #  逐字**只**印那 CC / CXX / LLVM_AR / LLVM_RANLIB / LLVM_STRIP / LLVM_READELF 那**六**个、
          #  #  => 而而那 **ANDROID_SDK_ROOT** 与那 **ANDROID_HOME** 逐字**没**有**印**出来**。
          #  => 而那**根因**逐字**是**：「定位 NDK」那一步（locate-ndk.sh）逐字**只**写**那 CC** 那**一**族**进** GITHUB_ENV、
          #  #  => 而它逐字**没有**写**那 ANDROID_NDK_LATEST_HOME**、=> 而而那**编译**那一步逐字**只**认**那**一个**变量。
          #  => 而那**处置**：=> 而而那 NDK 的**根**逐字**从**那 **CC** **反推**（=> 而那 CC 逐字**就是**那 NDK **里**的**那个** clang）、
          #  #  => 而而那**要留**的**就是**那**整棵** ndk **那一族**、=> 而而那**删**逐字**不碰**它**。
          #  => 而那**根因**逐字**是**：「定位 NDK」那一步（locate-ndk.sh）逐字**只**写**那 CC** 那**一**族**进** GITHUB_ENV、
          #  #  => 而它逐字**没有**写**那 ANDROID_NDK_LATEST_HOME**、=> 而而那**编译**那一步逐字**只**认**那**一个**变量**。
          #  => 而那**处置**：=> 而而那 NDK 的**根**逐字**从**那 **CC** **反推**（=> 而那 CC 逐字**就是**那 NDK **里**的**那个** clang）、
          #  #  => 而而那**上溯**几层逐字 = **五**层（=> 而那 recipe 那一族 `:43` 逐字**同样**是**五**层、=> 而而那**对得上**）。
          #  => 而那**缺陷名**（C-102）**那 cd 逐字把 .. 逐字按**物理**路径**解**了** —— => 而而那 NDK **那一族**
          #  #  逐字**可能**含**软链**（=> 而而那 cd 逐字**跟**着**软链**走、=> 而而那**逻辑**上的**那**五**层**就**不是**那**物理**上的**那**五**层**），
          #  #  => 而而那 40263205733 那一趟逐字**红**在「NDK 根推不出来」（=> 而那**那**一行逐字**把**那 CC **与**那 ANDROID_NDK_LATEST_HOME **都**印**了**）。
          #  => 而那**处置**：=> 而而那**根**逐字**用**那 dirname **连**剥**五**层**算**出来**（=> 而那**纯**是**字符串**的**事**、=> 而而它**不**受**软链**影响**）。
          NDK_KEEP=""
          if [ -n "${CC:-}" ] && [ -x "$CC" ]; then
            _d="$(dirname "$CC")"
            for _i in 1 2 3 4 5; do _d="$(dirname "$_d")"; done
            NDK_KEEP="$_d"
          fi
          if [ ! -d "$NDK_KEEP" ] && [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_KEEP="$ANDROID_NDK_LATEST_HOME"
          fi
          SDK_KEEP="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          #  => 而那**缺陷名**（C-102）**那要删的**那些**根**逐字**不**包括**那 NDK **在**的**那一棵**
          #  #  —— => 而那 07 那边逐字**核**到：那 **ANDROID_SDK_ROOT** 与那 **ANDROID_HOME** 逐字**没**有**印**出来**、
          #  #  => 而而那 **SDK_KEEP** 逐字**空**、=> 而而那循环**只**看**那 /usr/local/lib/android **那一个**根、
          #  #  => 而而那 NDK 逐字**在**那 /usr/local/lib/android/sdk/ndk/… **那一族**底下、=> 而而那 **sdk** **不是**叫 ndk、
          #  #  => 而而那**它**逐字**被**删**了。=> 而那**处置**：=> 而而那 NDK **在**的**那一棵**逐字**先算**出来**、
          #  #  => 而而那**删**的**那些**根**把**它**逐字**包**上**。
          if [ -n "$NDK_KEEP" ]; then
            SDK_KEEP="$SDK_KEEP $(dirname "$(dirname "$NDK_KEEP")")"
          fi
          for sdkd in $SDK_KEEP /usr/local/lib/android /usr/local/share/android-sdk; do
            [ -n "$sdkd" ] && [ -d "$sdkd" ] || continue
            for sub in "$sdkd"/*; do
              [ -e "$sub" ] || continue
              #  那**要留**的**那一棵**逐字**是**那 NDK **本**人**或**它**的**祖先**、=> 而而那**两种**都要**留**。
              if [ -n "$NDK_KEEP" ]; then
                if [ "$sub" = "$NDK_KEEP" ] || [ "$NDK_KEEP" = "$sub"/* ]; then continue; fi
              fi
              case "$(basename "$sub")" in
                ndk|ndk-bundle) continue ;;
              esac
              rm -rf "$sub" 2>/dev/null || true
            done
          done
          if [ -n "$NDK_KEEP" ] && [ -d "$NDK_KEEP" ]; then
            echo "NDK 保留：$NDK_KEEP"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_KEEP" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK 没保住::NDK 根推不出来（CC=$CC / ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}）—— 编译那一步会红在这一格"
          fi
          #  那 hostedtoolcache 那一族：=> 而而那**预装**的**工具链**逐字**这一趟**用**不到**
          #  （=> 而而那 cmake 与 ninja 与那 NDK 逐字**都**在**别**处**）。
          rm -rf /opt/hostedtoolcache/* 2>/dev/null || true

          #  那旧版 Android SDK 那一族（=> 而那 NDK 逐字**另**在**别**处**、=> 而那**这一**份**用不到**）。
          rm -rf /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          rm -rf /usr/local/share/android-sdk 2>/dev/null || true

          #  那交换区与那包缓存那一族：=> 而而那**不**是**编**的**输入**。
          rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true
          rm -rf /opt/ghc 2>/dev/null || true

          echo "== 清理后 =="
          df -h / 2>/dev/null | tail -1 || true

      - name: 编 llvmtoolchain（llvmVersion 已填，首次真编）
        if: success()
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -n "$NDK" ] && [ -d "$NDK" ] \
            || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          [ -x "$TC/aarch64-linux-android35-clang" ] \
            || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android35-clang（宿主标签写死了 linux-x86_64，runner 若不是 x86_64 要改这里）"; exit 1; }
          [ -x "$TC/llvm-ar" ] \
            || { echo "::error title=无 llvm-ar::缺 $TC/llvm-ar —— 编 LLVM 的归档工具，NDK 自带"; exit 1; }
          { echo "CC=$TC/aarch64-linux-android35-clang";
            echo "CXX=$TC/aarch64-linux-android35-clang++";
            echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake
          fi
          bash scripts/recipes/build-component-llvmtoolchain.sh

      - name: 件形态校验（aarch64 动态件 / 别名工具各自形状）
        run: bash scripts/verify/verify-component-artifact.sh llvm

      - name: 打包 + sha256
        run: bash scripts/recipes/package-component.sh llvm

      - name: 别名映射须与件内 package.json 一致
        run: |
          set -euo pipefail
          test -f dist/llvmtoolchain/package.json \
            || { echo "::error title=缺别名映射::dist/llvmtoolchain/package.json 没产出 —— 八个工具里只有入口能用"; exit 1; }
          node -e '
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("dist/llvmtoolchain/package.json", "utf8"));
          const names = Object.keys(pkg.bin || {});
          const need = ["clang", "clang++", "ld.lld", "llvm-ar", "llvm-nm", "llvm-strip", "llvm-objdump", "llvm-readobj"];
          const missing = need.filter((n) => !names.includes(n));
          if (missing.length) {
            console.error("::error title=别名不全::package.json 的 bin 缺 " + missing.join(",") + "（声明了 " + names.length + " 个）");
            process.exit(1);
          }
          for (const [k, v] of Object.entries(pkg.bin)) {
            if (!fs.existsSync("dist/llvmtoolchain/" + v)) {
              console.error("::error title=别名指向不存在的文件::" + k + " → " + v);
              process.exit(1);
            }
          }
          console.log("[ok] 别名 " + names.length + " 个，逐个指向件内真实文件");
          '

      #  缺陷名（C-102）**那诊断那两步逐字排在「发布本件预制品到 Release」那一步后面、
      #    => 而而那发布那一步逐字卡在那网络那一族、=> 而而那两步逐字就永远到不了**
      #  —— 而实际上那 40231794490 那一趟逐字：第 9 步 failure、第 10 到 12 步 skipped、
      #    而那第 13 步「发布本件预制品到 Release」**还在跑**、=> 而而那第 16 与 17 步逐字全 **pending**，
      #    => 而而那 artifact 那一族逐字 = **0**。
      #  => 而而那**处置**：=> 而而那诊断那两步逐字**搬到**那发布那一步**前面**、
      #    => 而而那发布那一步逐字**卡住**逐字**不**再**挡**着那两步。
      #  => 而而那**代价**：=> 而而那诊断那两步逐字**先**跑、=> 而而那**发布成功**那一趟逐字**也**会**多**跑那两步
      #    （=> 而而那 /tmp/diag 逐字**没有**东西时逐字**只**是一句 warn、=> 而而它逐字**不**判红）。
      #  => 而按 C-103 那两边：「那诊断逐字要那真红」与「那诊断逐字要那网络先走完」逐字**各**答一件事、
      #    => 而而这里改的是**后者**（=> 而前者那一格逐字**已核**）。
      #  => 而按 C-104：=> 而那 `if:` 那一族逐字**只有**一条路、=> 而而那**不是**第二种生成路径。
      #  => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
      #  缺陷名（C-102）**那一族失败之后逐字没有任何诊断留下、=> 而而那一趟逐字编到哪、为什么停答不出来、
      #    => 而而那下一趟逐字还会同样没诊断**
      #    —— 而实际上那 recipe 那一族（build-component-llvmtoolchain.sh）逐字**自己**会留日志：
      #    :147 那一行 > "$WORK/host-configure.log" 2>&1、:157 那一行 > "$WORK/host-build.log" 2>&1、
      #    :213 那一行 > "$WORK/cmake.log" 2>&1、:259 那一行 > "$WORK/build.log" 2>&1，
      #    => 而那些日志逐字**留在 runner 上**、=> 而那 upload-artifact 那一族逐字**只在成功那一路**跑、
      #    => 而而那一趟逐字**失败**、=> 而而那一步逐字**没跑**、=> 而而那些日志逐字**没被传出来**。
      #    => 而这一族逐字是「**留了、而没传**」那个形状（=> 而**不是**「没留」那个形状）。
      #    => 而按 C-103：=> 而那两边逐字是「那一族逐字**要**留诊断」与「那一族逐字**不**留」、=> 而而它们**各**答一件事。
      #    => 而按 C-104：=> 而那一族逐字是**两个 workflow 那一族**、=> 而而它们**处置不一样**、
      #       => 而而这一笔只**改** llvm 那一族、=> 而而**不动** build-apk 那一族。
      #    => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
      #  缺陷名（C-102）**那一步逐字只在「有一步真红」时跑、=> 而而那一族整趟逐字没有一步真红、
      #    => 而而那一族要诊断逐字永远拿不到**
      #    —— 而实际上那 llvm 那一族逐字那两趟（40219707960 / 40226448577）逐字：
      #      而那**真红**的那几步 = **[]**、=> 而而那第 9 步逐字**还是 in_progress**、=> 而而那 16 与 17 步逐字全 **pending**。
      #    => 而而那 runner 逐字**在**那第 9 步**被杀**（=> 而而那中断**不是**「一步失败」那个形状）、
      #    => 而而那 `failure()` 逐字**从来没真过**、=> 而而那两步逐字**永远**走不到。
      #    —— 而那**对照**（build-apk 那一族逐字红过的那两趟）逐字是**有**一步真红、
      #    => 而而那 `failure()` 逐字**真过**、=> 而而那 28 与 29 那两步逐字**跑了**、=> 而而那 artifact 逐字 = **1**。
      #    => 而那按 C-103 那两边：「那一趟逐字为什么被中断」与「那一步逐字怎么才能被走到」逐字**各**答一件事。
      #    => 而这里改的是**后者**（=> 而前者那一格逐字**未核**、=> 而按 C-105 **报缺**）。
      #    => 而按 C-104：=> 而那 `if:` 那一族逐字**只有**一条路、=> 而而那**不是**第二种生成路径。
      #    => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
      - name: Collect failure diagnostics
        #  缺陷名（C-102）**那 job 逐字被取消时、=> 而而那诊断那两步逐字还是不跑**
        #  —— 而实际上那 40244138594 那一趟逐字：而那第 9 步「编 llvmtoolchain」逐字 = **cancelled**、
        #    => 而而那 `always() && !cancelled()` 逐字**排掉**了那一档、=> 而而那第 13 与 14 步逐字 = **skipped**、
        #    => 而而那 artifact 那一族逐字 = **0**。
        #  => 而而那**成因**逐字：=> 而而那 `!cancelled()` 那一族逐字**排掉**的正是那**并发控制**取消的那一趟，
        #    => 而而那**被取消**恰恰是**最**需要诊断的那一档（=> 而而那 40231794490 那一趟逐字就是那一档）。
        #  => 而那**改法**：=> 而而那条件逐字**只**留 `always()`、=> 而而那诊断那两步逐字**一律**跑。
        #  => 而那**代价**：=> 而而那**被取消**那一趟逐字**也**会**跑**那两步、=> 而而那 artifact 那一族逐字**会**多一份；
        #    => 而而那**成功**那一趟逐字**也**会**跑**那两步（=> 而而那 /tmp/diag 逐字**没有**东西时逐字**只**是一句 warn、
        #      => 而而它逐字**不**判红）。
        #  => 而那**判据**逐字要**是**什么：=> 而那**诊断档**那一族逐字**要**的是「那一趟逐字**出了**什么事」那一份现场，
        #    => 而而那**取消**也是「出了什么事」那**一族**、=> 而而它**不**是「没事」。
        #  => 而按 C-103 那两边：「那诊断逐字要那真红」与「那诊断逐字要那 job 逐字没被取消」
        #    => 而那**真红**那一族逐字**不覆盖**那**被取消**那一档、=> 而而那**被取消**逐字**要**诊断。
        #  => 而按 C-104：=> 而那 `if:` 那一族逐字**只有**一条路、=> 而而那**不是**第二种生成路径。
        #  => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
        if: always()
        run: |
          set -uo pipefail
          D=/tmp/diag
          rm -rf "$D"; mkdir -p "$D"

          #  那 recipe 那一族逐字留的那四份 log 逐字**留在 runner 上**、=> 而而它们逐字**没被传出来**、
          #  => 而这一步逐字把**它们**捞出来落到 artifact。
          WORK="$GITHUB_WORKSPACE/work/llvmtoolchain"
          for f in host-configure.log host-build.log cmake.log build.log; do
            [ -e "$WORK/$f" ] && cp -f "$WORK/$f" "$D/" 2>/dev/null || true
          done

          #  把错误行单独摘成一份纯文本，省得下整个日志
          {
            echo "## 编译错误（从 build.log 里摘的）"
            echo
            grep -anE 'error:|Error [0-9]+$|undefined (symbol|reference)' "$WORK/build.log" 2>/dev/null \
              | tail -60
            echo
            echo "## build.log 末 60 行"
            tail -60 "$WORK/build.log" 2>/dev/null
            echo
            echo "## cmake.log 末 40 行"
            tail -40 "$WORK/cmake.log" 2>/dev/null
            echo
            echo "## host-build.log 末 40 行"
            tail -40 "$WORK/host-build.log" 2>/dev/null
            echo
            echo "## host-configure.log 末 40 行"
            tail -40 "$WORK/host-configure.log" 2>/dev/null
          } > "$D/compile-errors.txt" 2>/dev/null || true

          #  取件与固化相关的现场
          ls -la "$WORK" 2>/dev/null | head -40 > "$D/work-listing.txt" || true
          ls -la dist/ > "$D/dist.txt" 2>/dev/null || true

          {
            echo "## Job 环境"
            echo
            echo "- HEAD: $(git rev-parse --short HEAD 2>/dev/null)"
            echo "- 现在: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 那一族的 src 段: $(node scripts/toolchain/cache-key.sh asset llvm 2>/dev/null)"
            echo "- dist 里的内容:"
            ls -la dist/ 2>/dev/null | sed 's/^/    /'
          } > "$D/env.txt" 2>/dev/null || true

          ls -laR "$D" 2>/dev/null | head -40

      - name: Upload failure diagnostics artifact (backup)
        #  与上面那一步**同**一个条件：=> 而而那条件逐字**只**留 `always()`（=> 而而那**被取消**那一趟逐字**也**跑）。
        #  而而那 `if-no-files-found: warn` 逐字**保底**：=> 而而那**成功**那一趟逐字也**会**跑这一步、
        #  => 而而那 /tmp/diag 逐字**没有**东西时逐字**只**是一句 warn、=> 而而它逐字**不**判红。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: /tmp/diag/
          if-no-files-found: warn
          retention-days: 7

      - name: 发布本件预制品到 Release（编一次，长期复用）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # T 缺陷名（C-102）这一处用了 TAG 与 ASSET，而它们原来没有任何一步定义
          #   而在 set -euo pipefail 下那两处未定义就展开，=> 而而它发不出去；
          #   => 而而那正是「llvm 那个 tag 从来没出现过」那一格的成因。
          #   => 而那两格该由上面「算本件的固化标识」那一步给出。
          TAG: ${{ steps.uwkey.outputs.tag }}
          ASSET: ${{ steps.uwkey.outputs.asset }}
        run: |
          set -euo pipefail
          #  缺陷名（C-102）**没有产出被当成成功** —— 而而这一族逐字有**两边**：
          #    一，「那一趟压根没跑」（=> 而而那逐字是**上游**没产出、=> 而而那**不是**本步骤能判的）、
          #    二，「那一趟跑了、而它没产出」（=> 而而那逐字是**本步骤**能判的）。
          #    => 而而原来那一句逐字把这两边**混成了一边**、=> 而而它逐字是「跳过发布 -> exit 0」、
          #    => 而而那一趟逐字**绿**、=> 而而外面逐字只看见「tag 没建」、=> 而而**看不出**「那一趟压根没产出」。
          #    => 而 04 今天裁的判据那一层是「**没有产出**就是**没有产出**、=> 而而它**不是**成功」。
          #    => 而按 C-103 先答「它为什么有两边」：=> 而那两边是「那一趟压根没跑」与「那一趟跑了、而它没产出」、
          #       => 而而它们逐字**处置不同**（=> 而前者逐字是**上游**的事、=> 而后者逐字是**本步骤**的事）。
          #    => 而这里逐字只判**后者**（=> 而而本步骤逐字只看得见「dist/llvmtoolchain 在不在」），
          #       => 而而前者逐字由**上游那一步**的成败来表达。
          if [ ! -d dist/llvmtoolchain ]; then
            echo "::error title=没产出 llvmtoolchain::本趟没产出，不算成功"
            exit 1
          fi
          PW="work/pw-llvmtoolchain"
          rm -rf "$PW" && mkdir -p "$PW"
          tar czf "$PW/$ASSET" -C dist --exclude '*.tar.gz' .
          ( cd "$PW" && sha256sum "$ASSET" > "$ASSET.sha256" )
          {
            echo "预制品：llvmtoolchain（clang / lld / binutils）"
            echo "Release tag：$TAG"
            echo "NDK：$(bash scripts/toolchain/fetch-pinned.sh --ndk)"
            echo "LLVM 源码钉值：$(bash scripts/toolchain/fetch-pinned.sh --src-version llvm)"
            echo "构建 run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$PW/BUILD.md"
          #  缺陷名（C-102）**那一步逐字没有自己的时限、=> 而而那网络那一族逐字挂了就一直等**
          #  —— 而实际上那 40231794490 那一趟逐字**卡**在这第 13 步**到最后一刻**（=> 而那 job 那一族
          #    逐字 timeout-minutes = **360**、=> 而而那一步逐字**一直等**、=> 而而那诊断那两步
          #    逐字**永远**没被走到、=> 而而那 artifact 那一族逐字**还是** **0**）。
          #  => 而那**处置**：=> 而而那**三条** gh 逐字**各**带一个**自己的**时限、
          #    => 而而那网络那一族逐字**挂了**就**判红**、=> 而而那**下一步**逐字**能**走。
          #  => 而那**时限**逐字**多少**：=> 而而那 5 分钟逐字**足够**那 Release 那一族逐字做完、
          #    => 而而那**超时**逐字**远小于**那 job 那一族逐字那 6 小时、=> 而而那**诊断**那两步
          #    逐字**来得及**跑。
          #  => 而按 C-103 那两边：「那一步逐字**做**的是**什么**」与「那一步逐字**等**的是**什么**」
          #    => 而那两边逐字**各**答一件事、=> 而而那**处置**不一样、=> 而而它们**不并**。
          #  => 而按 C-104：=> 而那 gh 那一族逐字**只有**一条路、=> 而而那**不是**第二种生成路径。
          #  => 而按 C-220：=> 而 04 那边要落**内容稿**、=> 而而这一笔是**实现**那一族。
          GH_TIMEOUT=300
          if ! timeout "$GH_TIMEOUT" gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            timeout "$GH_TIMEOUT" gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "llvmtoolchain（工具筐）— $TAG" \
              --notes "编译一次、长期复用的工具链预制品（clang / lld / binutils）。构建链优先复用本件，不再重复编译。BUILD.md 记录了这份预制品的编译依据。"
          fi
          timeout "$GH_TIMEOUT" gh release upload "$TAG" "$PW"/* --repo "${{ github.repository }}" --clobber
          echo "[ok] 已发布 $TAG"

      - name: 发布 llvmtoolchain 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          for f in dist/component-llvmtoolchain-*.zip; do
            [ -f "$f" ] || { echo "::error title=没有件可发::$f"; exit 1; }
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
              node scripts/publish/upload-qiniu.js "$f" "component/$(basename "$f")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: component-llvm
          path: dist/component-llvmtoolchain-*.zip
          retention-days: 90
