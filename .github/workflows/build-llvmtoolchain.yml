name: Build Component · llvmtoolchain

on:
  # -- 触发方式 --
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch: {}

concurrency:
  group: llvmtoolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^component-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/component-* ]]; then
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 component-<channel>-<revision>，channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是清单唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "revision=0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi



  llvmtoolchain:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 取 NDK（命中缓存则 0 下载；未命中才装一次并写回缓存）
        run: bash scripts/toolchain/cache-ndk.sh
      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh llvm

      - name: 问 NDK 它的 LLVM 版本（并与钉值核对）
        run: bash scripts/verify/verify-ndk-llvm.sh

      - name: 把实测到的 LLVM 版本写进摘要（供填 llvmVersion 用）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          CLANG="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/clang 2>/dev/null | head -1 || true)"
          if [ -n "$CLANG" ]; then
            "$CLANG" --version 2>/dev/null | head -3
            "$CLANG" --version 2>/dev/null \
              | sed -n 's/.*clang version \([0-9][0-9.]*\).*/实测 LLVM 版本 = \1/p'
            { echo "### NDK/LLVM 版本（填进 scripts/component-sources.json 的 llvmVersion）"; echo '```'; \
              "$CLANG" --version 2>/dev/null | head -3; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 读出 clang_source_info.md（NDK 内置 LLVM 的真实来源）
        if: always()
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          SI="$(ls "$NDK"/toolchains/llvm/prebuilt/*/clang_source_info.md "$NDK"/clang_source_info.md 2>/dev/null | head -1 || true)"
          {
            echo "### clang_source_info.md"
            if [ -n "$SI" ]; then
              echo "路径：\`$SI\`"
              echo '```'
              cat "$SI"
              echo '```'
              echo "**llvmVersion 要按这份文件填**（它给的是 llvmorg- 对应的语义版本）。"
            else
              echo "**没找到 clang_source_info.md** —— 这一版 clang 的 LLVM 语义版本未知。"
              echo "此时 \`clang --version\` 里的 \`20.0.0git\` **不足以**作为同源依据"
              echo "（verify-ndk-llvm.sh 会 exit 2 并说明）。需要人工确认后再填。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清出磁盘空间（编 LLVM 要峰值空间，而 runner 自带的那些占了大头）
        if: success()
        run: |
          set -uo pipefail
          #  缺陷名（C-102）**那磁盘那一族没有被定位、05 那一笔只碰了它的一部分**
          #  —— 而实际上那 40247630569 与那 40255598542 那**两**趟**症状** **一模一样**
          #    （都是「No space left on device」），40255598542 那一趟**含**那 `rm -rf "$HOST_TB"` 那一笔。
          #**成因** **是**那 runner **自带**的**那些**大件**占**的**空间**：
          #Android SDK 那一族（它**不是**那 NDK，NDK**另**在**别**处**）**几 GB**、
          #/usr/local/lib/android 那**旧** SDK**几 GB**、hostedtoolcache 那一族**几 GB**。
          #**编**这一族**要**那**宿主**磁盘、**峰值**要**比**那**编完**的**产物**大**得多**。
          #**处置**：**用不到**的**先删**、**要留**的**留**着**。
          #**要留**的**只有**那 **NDK**（NDK 是**编**的**输入**、它**不能**删**）
          #    与那**这一个** job **要**的**那点**东西**。
          # 按 C-103 那两边：「那**编**要**那**磁盘**空间**」与「那**取件**要**那**磁盘**空间**」
          # 两边各答一件事、处置不一样、按 C-135 那不是同一问。
          # 按 C-104：**清**那一族**只有**一条路、**不是**第二种生成路径。
          # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
          echo "== 清理前 =="
          df -h / 2>/dev/null | tail -1 || true

          #  那 Android SDK 那一族：**其余**的**这一趟**用**不到**、**要留**的**只有**那 **NDK**。
          #**缺陷名**（C-102）**那留的**那个**目录**不**在**那循环**看**的那**两个**根**底下**
          #  #  ——07 那边**核**到：那 40261838810 那一趟那「NDK 保留：…」那一行**没**出现**、
          #  #**留**的**那个**目录**不**在**那循环**看**的**那**两个**根**底下、runner 的 env 那一族
          #  # **只**印那 CC / CXX / LLVM_AR / LLVM_RANLIB / LLVM_STRIP / LLVM_READELF 那**六**个、
          #  #**ANDROID_SDK_ROOT** 与那 **ANDROID_HOME** **没**有**印**出来**。
          #**根因** **是**：「定位 NDK」那一步（locate-ndk.sh）**只**写**那 CC** 那**一**族**进** GITHUB_ENV、
          #  #它**没有**写**那 ANDROID_NDK_LATEST_HOME**、**编译**那一步**只**认**那**一个**变量。
          #**处置**：NDK 的**根** **从**那 **CC** **反推**（CC**就是**那 NDK **里**的**那个** clang）、
          #  #**要留**的**就是**那**整棵** ndk **那一族**、**删** **不碰**它**。
          #**根因** **是**：「定位 NDK」那一步（locate-ndk.sh）**只**写**那 CC** 那**一**族**进** GITHUB_ENV、
          #  #它**没有**写**那 ANDROID_NDK_LATEST_HOME**、**编译**那一步**只**认**那**一个**变量**。
          #**处置**：NDK 的**根** **从**那 **CC** **反推**（CC**就是**那 NDK **里**的**那个** clang）、
          #  #**上溯**几层 = **五**层（recipe 那一族 `:43`**同样**是**五**层、**对得上**）。
          #**缺陷名**（C-102）**那 cd 把 .. 按**物理**路径**解**了** ——NDK **那一族**
          #  # **可能**含**软链**（cd**跟**着**软链**走、**逻辑**上的**那**五**层**就**不是**那**物理**上的**那**五**层**），
          #  #40263205733 那一趟**红**在「NDK 根推不出来」（**那**一行**把**那 CC **与**那 ANDROID_NDK_LATEST_HOME **都**印**了**）。
          #**处置**：**根** **用**那 dirname **连**剥**五**层**算**出来**（**纯**是**字符串**的**事**、它**不**受**软链**影响**）。
          NDK_KEEP=""
          if [ -n "${CC:-}" ] && [ -x "$CC" ]; then
            _d="$(dirname "$CC")"
            for _i in 1 2 3 4 5; do _d="$(dirname "$_d")"; done
            NDK_KEEP="$_d"
          fi
          if [ ! -d "$NDK_KEEP" ] && [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_KEEP="$ANDROID_NDK_LATEST_HOME"
          fi
          SDK_KEEP="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          #**缺陷名**（C-102）**那要删的**那些**根** **不**包括**那 NDK **在**的**那一棵**
          #  #  ——07 那边**核**到：那 **ANDROID_SDK_ROOT** 与那 **ANDROID_HOME** **没**有**印**出来**、
          #  #**SDK_KEEP** **空**、循环**只**看**那 /usr/local/lib/android **那一个**根、
          #  #NDK**在**那 /usr/local/lib/android/sdk/ndk/… **那一族**底下、**sdk** **不是**叫 ndk、
          #  #**它** **被**删**了。**处置**：NDK **在**的**那一棵** **先算**出来**、
          #  #**删**的**那些**根**把**它** **包**上**。
          #**缺陷名**（C-102）**那判据** **在**那删**之后**才判**、**要留**的那**一层**
          #  # **在**那删**的**过程**里**被删**了 ——30.0.16248370 那一**层** **是**那 **sdk** **底下**的**那**一个**子**目录**、
          #  #它**不**是**那 ndk**、它**也**不是**那 NDK_KEEP**、**祖先**判据**不**保**它**。
          #**处置**：**顺序** **改成**「先判、再删」——**判据** **在**那删**之前**就**判**完**。
          if [ -n "$NDK_KEEP" ]; then
            SDK_KEEP="$SDK_KEEP $(dirname "$(dirname "$NDK_KEEP")")"
          fi
          #  那**物理**路径**也**算**一份**（**sdk/ndk** **可能**是**那软链**、**30.0.16248370**
          #  #  那一层**就**是**那**软链**指的**那**一处**、**只**按**逻辑**路径**判**就**漏掉**它**）。
          NDK_REAL=""
          if [ -n "$NDK_KEEP" ] && command -v realpath >/dev/null 2>&1; then
            NDK_REAL="$(realpath -m "$NDK_KEEP" 2>/dev/null || true)"
          fi
          #**判据** **在**那删**之前**判**（**先**判**完**再删**、**保不住**的**那一档** **就**不删**）。
          if [ -z "$NDK_KEEP" ] || [ ! -d "$NDK_KEEP" ]; then
            echo "::warning title=NDK 没保住::NDK 根推不出来（CC=$CC / ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}）—— 什么都不删"
            NDK_KEEP=""
          fi
          for sdkd in $SDK_KEEP /usr/local/lib/android /usr/local/share/android-sdk; do
            [ -n "$sdkd" ] && [ -d "$sdkd" ] || continue
            for sub in "$sdkd"/*; do
              [ -e "$sub" ] || continue
              #  那**要留**的**那一棵** **是**那 NDK **本**人**或**它**的**祖先**、**两种**都要**留**。
              if [ -n "$NDK_KEEP" ]; then
                #**缺陷名**（C-102）**那方括号** **让** ..**成了通配** ——"$sub"/* 那一族
                #   **没**被**引号**包**住**、它**会**按**那目录**里的**内容**展开**、**展开**出来**不**止**一**个**时**、
                #[**就** **报**「: too many arguments」（40263922428 那一趟`:62` 那一行**就是**它**）。
                #**处置**：**判据** **改成**那 case 那一族（case**不**做**通配**展开**）。
                if [ "$sub" = "$NDK_KEEP" ]; then continue; fi
                case "$NDK_KEEP" in
                  "$sub"/*) continue ;;
                esac
                #  那**物理**路径**也**判**一次**（**软链**指**的**那**一处** **在**那**逻辑**路径**之外**）。
                if [ -n "$NDK_REAL" ] && command -v realpath >/dev/null 2>&1; then
                  sub_real="$(realpath -m "$sub" 2>/dev/null || true)"
                  if [ -n "$sub_real" ]; then
                    if [ "$sub_real" = "$NDK_REAL" ]; then continue; fi
                    case "$NDK_REAL" in
                      "$sub_real"/*) continue ;;
                    esac
                  fi
                fi
              fi
              case "$(basename "$sub")" in
                ndk|ndk-bundle) continue ;;
              esac
              rm -rf "$sub" 2>/dev/null || true
            done
          done
          if [ -n "$NDK_KEEP" ] && [ -d "$NDK_KEEP" ]; then
            echo "NDK 保留：$NDK_KEEP"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_KEEP" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK 没保住::NDK 根推不出来（CC=$CC / ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}）—— 编译那一步会红在这一格"
          fi
          #  那 hostedtoolcache 那一族：**预装**的**工具链** **这一趟**用**不到**
          #  （cmake 与 ninja 与那 NDK**都**在**别**处**）。
          rm -rf /opt/hostedtoolcache/* 2>/dev/null || true

          #  那旧版 Android SDK 那一族（NDK**另**在**别**处**、**这一**份**用不到**）。
          rm -rf /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          rm -rf /usr/local/share/android-sdk 2>/dev/null || true

          #  那交换区与那包缓存那一族：**不**是**编**的**输入**。
          rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true
          #  那 runner **自带**的**其余**那些大头 —— 而它们**不是**那编的输入。
          #**那几**个**各**占**几 G**、**编**的**峰值** **要**那**空间**。
          #**处置**：**用不到**的**一律**先删、**要留**的**只有**那 **NDK**。
          # 按 C-103 那两边：「那**编**要**那磁盘**空间**」与「那**取件**要**那磁盘**空间**」
          # 两边各答一件事、处置不一样、按 C-135 那不是同一问。
          # 按 C-104：**清**那一族**只有**一条路、**不是**第二种生成路径。
          # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
          rm -rf /opt/ghc
          rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          rm -rf /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/puppeteer 2>/dev/null || true
          rm -rf /usr/local/azure-cli /opt/az /usr/local/lib/heroku /usr/share/az 2>/dev/null || true
          rm -rf /opt/hostedtoolcache/Rust /opt/hostedtoolcache/go /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/Python 2>/dev/null || true
          rm -rf /usr/local/share/graalvm /usr/lib/jvm /opt/java /opt/gradle 2>/dev/null || true
          rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          rm -rf /usr/local/share/swift /usr/local/swift /opt/swift 2>/dev/null || true
          rm -rf /usr/local/share/scala /usr/local/share/sbt /usr/local/share/play 2>/dev/null || true
          #  那 runner **自己**的**诊断**日志与那**缓存**那一族 —— 而那**正**是那磁盘满**的**现场**。
          #  缺陷名（C-102）**那 runner 自己的**那一族**不能删** ——40312951611 那一趟在**那第 10 步**上**1 秒**就**红**了、
          #**原话** **没有**（job**没有**那一步的 completed、**诊断档** **没有**成型**）
          #**成因** **是**：$RUNNER_TOOL_CACHE **就是**那 /opt/hostedtoolcache、**actions-runner** **自己** **靠**它**跑**、
          #**删掉**它**之后**那 job**自己**就**被**那 runner **收拾**了、第 10 步**刚**起**头**就**断**。
          #**处置**：**要留**的**是**那 $RUNNER_TOOL_CACHE（**编**要**那 cmake**、cmake**要** sudo apt-get install、
          #apt **要**那 runner **自己的**缓存**与**工具**目录**）、**真正**该**清**的**是**那**它**底下**那**几**个**大**的**预装**工具链**。
          # 按 C-103 那两边：「那**编**要**那磁盘空间**」与「那 runner **自己**要**活着**」两边各答一件事、按 C-135 那不是同一问。
          # 按 C-104：**清**那一族**只有**一条路、**不是**第二种生成路径。
          # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
          rm -rf /home/runner/actions-runner/_diag 2>/dev/null || true
          rm -rf "$RUNNER_WORKSPACE"/../_temp 2>/dev/null || true
          #  那**编**的**峰值**要那**空间**、**余量** **要**够**那**构建树**长**完**。
          #**余量**不够**就**判红**（**别处**的**那**一个**判据** **不**够**、
          #**改**的**只**是**那第 9** 步**与**它**相关**的**那几**行**）。
          echo "== 清理后 =="
          df -h / 2>/dev/null | tail -1 || true
          AVAIL_KB="$(df -k / 2>/dev/null | tail -1 | awk '{print $4}')"
          NEED_KB=62914560   #  60G —— 而那**构建树**的**峰值** **要**那**空间**（**读数**是那 07 那边**核**的**）
          if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt "$NEED_KB" ]; then
            echo "::error title=磁盘余量不够::清完只剩 $((AVAIL_KB / 1024))G、而那编的峰值要 60G —— 这一趟编不完"
            exit 1
          fi

          df -h / 2>/dev/null | tail -1 || true

      - name: 编 llvmtoolchain（llvmVersion 已填，首次真编）
        if: success()
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -n "$NDK" ] && [ -d "$NDK" ] \
            || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          [ -x "$TC/aarch64-linux-android35-clang" ] \
            || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android35-clang（宿主标签写死了 linux-x86_64，runner 若不是 x86_64 要改这里）"; exit 1; }
          [ -x "$TC/llvm-ar" ] \
            || { echo "::error title=无 llvm-ar::缺 $TC/llvm-ar —— 编 LLVM 的归档工具，NDK 自带"; exit 1; }
          { echo "CC=$TC/aarch64-linux-android35-clang";
            echo "CXX=$TC/aarch64-linux-android35-clang++";
            echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake
          fi
          bash scripts/recipes/build-component-llvmtoolchain.sh

      - name: 件形态校验（aarch64 动态件 / 别名工具各自形状）
        run: bash scripts/verify/verify-component-artifact.sh llvm

      - name: 打包 + sha256
        run: bash scripts/recipes/package-component.sh llvm

      - name: 别名映射须与件内 package.json 一致
        run: |
          set -euo pipefail
          #  缺陷名（C-102）**这一格读错了那 package.json 那一层** ——
          #    而那**构建侧** **写**的是那**根**那一层（build-component-llvmtoolchain.sh :430
          #   **写**的是那 $TOOLDIR 的**上一层**的 package.json、$OUT**是**那 dist/）。
          #**判据**那一族（verify-component-artifact.sh :101 那一行）**读**的**也**是**那**根**那一层
          #    （**它**是「$ROOT/dist/package.json」）、**它** **过**了。
          # 这一格**读**的是那 dist/llvmtoolchain/ **那一层**、**它** **没有**那个件、
          #**它** **判红**、**红**被读成「那八个工具里只有入口能用」。
          #**成因** **是**那**路径**那一格**的事、**它** **不是**「那别名映射」那个形状
          #    （别名映射那一族**在**那 package.json **里面**、它**产出了**）。
          # 按 C-104：**别名映射**那一族**只有**一条生成路径。
          test -f dist/package.json \
            || { echo "::error title=缺别名映射::dist/package.json 没产出 —— 八个工具里只有入口能用"; exit 1; }
          node -e '
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("dist/package.json", "utf8"));
          const names = Object.keys(pkg.bin || {});
          const need = ["clang", "clang++", "ld.lld", "llvm-ar", "llvm-nm", "llvm-strip", "llvm-objdump", "llvm-readobj"];
          const missing = need.filter((n) => !names.includes(n));
          if (missing.length) {
            console.error("::error title=别名不全::package.json 的 bin 缺 " + missing.join(",") + "（声明了 " + names.length + " 个）");
            process.exit(1);
          }
          for (const [k, v] of Object.entries(pkg.bin)) {
            if (!fs.existsSync("dist/" + v)) {
              console.error("::error title=别名指向不存在的文件::" + k + " → " + v);
              process.exit(1);
            }
          }
          console.log("[ok] 别名 " + names.length + " 个，逐个指向件内真实文件");
          '

      #  缺陷名（C-102）**那诊断那两步排在「发布本件预制品到 Release」那一步后面、
      # 发布那一步卡在那网络那一族、两步就永远到不了**
      #  —— 而实际上那 40231794490 那一趟：第 9 步 failure、第 10 到 12 步 skipped、
      #    而那第 13 步「发布本件预制品到 Release」**还在跑**、第 16 与 17 步全 **pending**，
      #artifact 那一族 = **0**。
      #**处置**：诊断那两步**搬到**那发布那一步**前面**、
      # 发布那一步**卡住** **不**再**挡**着那两步。
      #**代价**：诊断那两步**先**跑、**发布成功**那一趟**也**会**多**跑那两步
      #    （/tmp/diag**没有**东西时**只**是一句 warn、它**不**判红）。
      # 按 C-103 那两边：「那诊断要那真红」与「那诊断要那网络先走完」**各**答一件事、
      # 这里改的是**后者**（前者那一格**已核**）。
      # 按 C-104：`if:` 那一族**只有**一条路、**不是**第二种生成路径。
      # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
      #  缺陷名（C-102）**那一族失败之后没有任何诊断留下、一趟编到哪、为什么停答不出来、
      # 下一趟还会同样没诊断**
      #    —— 而实际上那 recipe 那一族（build-component-llvmtoolchain.sh）**自己**会留日志：
      #    :147 那一行 > "$WORK/host-configure.log" 2>&1、:157 那一行 > "$WORK/host-build.log" 2>&1、
      #    :213 那一行 > "$WORK/cmake.log" 2>&1、:259 那一行 > "$WORK/build.log" 2>&1，
      # 些日志**留在 runner 上**、upload-artifact 那一族**只在成功那一路**跑、
      # 一趟**失败**、一步**没跑**、些日志**没被传出来**。
      # 这一族是「**留了、而没传**」那个形状（**不是**「没留」那个形状）。
      # 按 C-103：两边是「那一族**要**留诊断」与「那一族**不**留」、它们**各**答一件事。
      # 按 C-104：一族是**两个 workflow 那一族**、它们**处置不一样**、
      # 这一笔只**改** llvm 那一族、**不动** build-apk 那一族。
      # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
      #  缺陷名（C-102）**那一步只在「有一步真红」时跑、一族整趟没有一步真红、
      # 一族要诊断永远拿不到**
      #    —— 而实际上那 llvm 那一族那两趟（40219707960 / 40226448577）：
      #      而那**真红**的那几步 = **[]**、第 9 步**还是 in_progress**、16 与 17 步全 **pending**。
      #runner**在**那第 9 步**被杀**（中断**不是**「一步失败」那个形状）、
      #`failure()`**从来没真过**、两步**永远**走不到。
      #    —— 而那**对照**（build-apk 那一族红过的那两趟）是**有**一步真红、
      #`failure()`**真过**、28 与 29 那两步**跑了**、artifact  = **1**。
      # 按 C-103 那两边：「那一趟为什么被中断」与「那一步怎么才能被走到」**各**答一件事。
      # 这里改的是**后者**（前者那一格**未核**、按 C-105 **报缺**）。
      # 按 C-104：`if:` 那一族**只有**一条路、**不是**第二种生成路径。
      # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
      - name: Collect failure diagnostics
        #  缺陷名（C-102）**那 job 被取消时、诊断那两步还是不跑**
        #  —— 而实际上那 40244138594 那一趟：而那第 9 步「编 llvmtoolchain」 = **cancelled**、
        #`always() && !cancelled()`**排掉**了那一档、第 13 与 14 步 = **skipped**、
        #artifact 那一族 = **0**。
        #**成因**：`!cancelled()` 那一族**排掉**的正是那**并发控制**取消的那一趟，
        #**被取消**恰恰是**最**需要诊断的那一档（40231794490 那一趟就是那一档）。
        #**改法**：条件**只**留 `always()`、诊断那两步**一律**跑。
        #**代价**：**被取消**那一趟**也**会**跑**那两步、artifact 那一族**会**多一份；
        #**成功**那一趟**也**会**跑**那两步（/tmp/diag**没有**东西时**只**是一句 warn、
        # 它**不**判红）。
        #**判据**要**是**什么：**诊断档**那一族**要**的是「那一趟**出了**什么事」那一份现场，
        #**取消**也是「出了什么事」那**一族**、它**不**是「没事」。
        # 按 C-103 那两边：「那诊断要那真红」与「那诊断要那 job 没被取消」
        #**真红**那一族**不覆盖**那**被取消**那一档、**被取消** **要**诊断。
        # 按 C-104：`if:` 那一族**只有**一条路、**不是**第二种生成路径。
        # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
        if: always()
        run: |
          set -uo pipefail
          D=/tmp/diag
          rm -rf "$D"; mkdir -p "$D"

          #  那 recipe 那一族留的那四份 log**留在 runner 上**、它们**没被传出来**、
          # 这一步把**它们**捞出来落到 artifact。
          #  缺陷名（C-102）**这一格读的是那**旧**的**工作目录名**、recipe 那一族改写它了** ——
          #    而那 recipe 那一件自己的 TOOL 从 llvmtoolchain 改成 llvm（01 §5.1 第 3 条：
          #    那两个 TOOL 字面该统一、件名是 llvm）、
          #recipe**从 $TOOL 派生**那工作目录（WORK="$ROOT_DIR/work/$TOOL"）、
          # 它**跟着**变了（旧的那个目录名**不再存在**）。
          # 这一格照旧**捞不到那四份 log**（[ -e "$WORK/$f" ]逐个不成立、
          #`|| true`把**每一件**都吞掉、一步**静默**空跑）。
          # 按 C-104：工作目录那一族**只有一条路**、**不是**第二种生成路径。
          WORK="$GITHUB_WORKSPACE/work/llvm"
          for f in host-configure.log host-build.log cmake.log build.log; do
            [ -e "$WORK/$f" ] && cp -f "$WORK/$f" "$D/" 2>/dev/null || true
          done

          #  把错误行单独摘成一份纯文本，省得下整个日志
          {
            echo "## 编译错误（从 build.log 里摘的）"
            echo
            grep -anE 'error:|Error [0-9]+$|undefined (symbol|reference)' "$WORK/build.log" 2>/dev/null \
              | tail -60
            echo
            echo "## build.log 末 60 行"
            tail -60 "$WORK/build.log" 2>/dev/null
            echo
            echo "## cmake.log 末 40 行"
            tail -40 "$WORK/cmake.log" 2>/dev/null
            echo
            echo "## host-build.log 末 40 行"
            tail -40 "$WORK/host-build.log" 2>/dev/null
            echo
            echo "## host-configure.log 末 40 行"
            tail -40 "$WORK/host-configure.log" 2>/dev/null
          } > "$D/compile-errors.txt" 2>/dev/null || true

          #  取件与固化相关的现场
          ls -la "$WORK" 2>/dev/null | head -40 > "$D/work-listing.txt" || true
          ls -la dist/ > "$D/dist.txt" 2>/dev/null || true

          {
            echo "## Job 环境"
            echo
            echo "- HEAD: $(git rev-parse --short HEAD 2>/dev/null)"
            echo "- 现在: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 那一族的 src 段: $(node scripts/toolchain/cache-key.sh asset llvm 2>/dev/null)"
            echo "- dist 里的内容:"
            ls -la dist/ 2>/dev/null | sed 's/^/    /'
          } > "$D/env.txt" 2>/dev/null || true

          ls -laR "$D" 2>/dev/null | head -40

      - name: Upload failure diagnostics artifact (backup)
        #  与上面那一步**同**一个条件：条件**只**留 `always()`（**被取消**那一趟**也**跑）。
        #  而那 `if-no-files-found: warn`**保底**：**成功**那一趟也**会**跑这一步、
        #/tmp/diag**没有**东西时**只**是一句 warn、它**不**判红。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: /tmp/diag/
          if-no-files-found: warn
          retention-days: 7

      - name: 发布本件预制品到 Release（编一次，长期复用）
        #  缺陷名（C-102）**那上传在**那校验**失败**之后**还**跑**
        #40264707909 那一趟：第 11 步 04:58:11Z 就 failure 了、
        #       而第 16 步 04:58:12Z **照样**去传了那 $PW/*（里面**有**一份上一轮编出来的 2G+ 的包）、
        #       而那上传**跑了 13 分钟**才被 GitHub**拒**了（日志「HTTP 422: Validation Failed」）。
        #**处置**：那上传**只**在**那校验**过了**之后**才**跑**（校验**没过**就**不**传**）。
        #**它** **不**是「那发布机制**坏**了」那个形状（422**是**那**包** **太大**）、
        #**它** **是**那**工具链**那一件**的**事**（包**要**拆**或**要**换**地方**）。
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # T 缺陷名（C-102）这一处用了 TAG 与 ASSET，而它们原来没有任何一步定义
          #   而在 set -euo pipefail 下那两处未定义就展开，它发不出去；
          # 正是「llvm 那个 tag 从来没出现过」那一格的成因。
          # 两格该由上面「算本件的固化标识」那一步给出。
          TAG: ${{ steps.uwkey.outputs.tag }}
          ASSET: ${{ steps.uwkey.outputs.asset }}
        run: |
          set -euo pipefail
          #  缺陷名（C-102）**没有产出被当成成功** —— 而这一族有**两边**：
          #    一，「那一趟压根没跑」（是**上游**没产出、**不是**本步骤能判的）、
          #    二，「那一趟跑了、而它没产出」（是**本步骤**能判的）。
          # 原来那一句把这两边**混成了一边**、它是「跳过发布 -> exit 0」、
          # 一趟**绿**、外面只看见「tag 没建」、**看不出**「那一趟压根没产出」。
          #04 今天裁的判据那一层是「**没有产出**就是**没有产出**、它**不是**成功」。
          # 按 C-103 先答「它为什么有两边」：两边是「那一趟压根没跑」与「那一趟跑了、而它没产出」、
          # 它们**处置不同**（前者是**上游**的事、后者是**本步骤**的事）。
          # 这里只判**后者**（本步骤只看得见「dist/llvmtoolchain 在不在」），
          # 前者由**上游那一步**的成败来表达。
          #  缺陷名（C-102）**这一格找的是那**错**的**那个**名字** ——
          #**它**治**的**是「那一趟跑了、而它没产出」那一边（和「那一趟压根没跑」那一边**不合并**）。
          #**成因**：第 12 步**调**的是那 package-component.sh llvm（TOOL**是**那 llvm），
          #**产物**的名字**是**那 component-$TOOL-$VER-$SHA-android-arm64.zip
          #       （package-component.sh :70 **那一行**）、**它** **是**那 component-llvm-*.zip。
          # 这一格**找**的**是**那 component-llvmtoolchain-*.zip（**它** **从来**不**存在**）。
          #**处置**：这一格**看**那**真的**那一个**产物**（zip **那一件**）。
          # 按 C-104：**发布**那一族**只有**一条路（第 17 步**传**的**也**是**它**）。
          if ! ls dist/component-llvm-*.zip >/dev/null 2>&1; then
            echo "::error title=没产出 llvmtoolchain::本趟没产出，不算成功"
            exit 1
          fi
          PW="work/pw-llvmtoolchain"
          rm -rf "$PW" && mkdir -p "$PW"
          tar czf "$PW/$ASSET" -C dist --exclude '*.tar.gz' .
          #  缺陷名（C-102）**那包超**那**上限**还**照传**
          #GitHub**限**那 **2147483648** 字节（日志「size must be less than 2147483648」）、
          #**处置**：那包**先**量**一下**、**超**了**就**先**判红**并**说清**原话**（**不**是**让**它**传 13 分钟**才**被**拒**）。
          #**拆**或那**换**地方**是**那**工具链**那一件**的**事**（**发布机制**这一层只**负责**不**把**它**悄悄**吞**掉**）。
          GH_MAX_ASSET_BYTES=2147483648
          PKG_BYTES="$(stat -c %s "$PW/$ASSET" 2>/dev/null || echo 0)"
          #  缺陷名（C-102）**那判红**在**那拆**之前**、**它** **让**那一步**必红**
          # 它治**的**是「那**发布机制**这一层**能不能**把**那**超了**上限**的**那包**递过去**」。
          #**成因**：**判红**那一族**先**报**那 ::error、**拆** **在**它**后面**、
          #::error **本身**就**让**那一步**红**（GitHub Actions**见**那 ::error **就**判红**）、
          #**拆** **成不成功**都**不**改**那**结果**。
          #**那**量**在**那拆**之前**、**它**们**是**那**两**件**事**（**处置** **不合并**）。
          #**处置**：**拆** **先**走、**量** **在**那**每一块**上**重**量**、
          #**判红** **只**在**那**某一块** **还**超**那上限**的时候**才**报**。
          # 按 C-104：**发布机制**这一族**只有**一条路（**拆** **不是**那**第二种生成路径**、
          #**它** **是**那**同一个**产物的**一种**递法**）。
          ( cd "$PW" && sha256sum "$ASSET" > "$ASSET.sha256" )
          if [ "$PKG_BYTES" -ge "$GH_MAX_ASSET_BYTES" ]; then
            SPLIT_DIR="$PW/parts"
            rm -rf "$SPLIT_DIR" && mkdir -p "$SPLIT_DIR"
            #**块**的**名字** **要**带**那**资产**的**名**（**它**们**是**那**几个**资产**、**取件**那**一边** **按**那**名字**找**）
            split -b "$((GH_MAX_ASSET_BYTES - 1024))" -d "$PW/$ASSET" "$SPLIT_DIR/$ASSET.part-"
            for part in "$SPLIT_DIR"/"$ASSET".part-*; do
              pb="$(stat -c %s "$part")"
              if [ "$pb" -ge "$GH_MAX_ASSET_BYTES" ]; then
                echo "::error title=预制品超上限::**分块**之后**仍然**有**一块**$pb 字节、**它** **还是**超**那上限**"
                exit 1
              fi
              echo "[ok] 那 $(basename "$part") $pb 字节、**在**那上限**之下**"
            done
            mv "$SPLIT_DIR"/"$ASSET".part-* "$PW/" && rmdir "$SPLIT_DIR"
            #**清单** **要**跟**那**分块**一起**走**（**取件**那**一边** **靠**它**拼**回来**）。
            ( cd "$PW" && ls -l "$ASSET".part-* > "$ASSET.parts.txt" )
            #**原**的**那包** **要**从**那**上传**那**一堆**里**拿掉**（GitHub**收不动**它**）。
            rm -f "$PW/$ASSET"
            echo "[ok] 那 $ASSET $PKG_BYTES 字节、**已拆**成 $(ls "$PW"/"$ASSET".part-* | wc -l) **块**、**每一**块**在**那上限**之下**"
          else
            echo "[ok] 那 $ASSET $PKG_BYTES 字节、**在**那上限**之下**"
          fi
          {
            echo "预制品：llvmtoolchain（clang / lld / binutils）"
            echo "Release tag：$TAG"
            echo "NDK：$(bash scripts/toolchain/fetch-pinned.sh --ndk)"
            echo "LLVM 源码钉值：$(bash scripts/toolchain/fetch-pinned.sh --src-version llvm)"
            echo "构建 run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$PW/BUILD.md"
          #  缺陷名（C-102）**那一步没有自己的时限、网络那一族挂了就一直等**
          #  —— 而实际上那 40231794490 那一趟**卡**在这第 13 步**到最后一刻**（job 那一族
          #    timeout-minutes = **360**、一步**一直等**、诊断那两步
          #   **永远**没被走到、artifact 那一族**还是** **0**）。
          #**处置**：**三条** gh**各**带一个**自己的**时限、
          # 网络那一族**挂了**就**判红**、**下一步** **能**走。
          #**时限** **多少**：5 分钟**足够**那 Release 那一族做完、
          #**超时** **远小于**那 job 那一族那 6 小时、**诊断**那两步
          #   **来得及**跑。
          # 按 C-103 那两边：「那一步**做**的是**什么**」与「那一步**等**的是**什么**」
          # 两边**各**答一件事、**处置**不一样、它们**不并**。
          # 按 C-104：gh 那一族**只有**一条路、**不是**第二种生成路径。
          # 按 C-220：04 那边要落**内容稿**、这一笔是**实现**那一族。
          #  缺陷名（C-102）**那一格把那时限**写死**、它**掐**了那一趟真的上传**
          # 旧版是 `GH_TIMEOUT=300`
          #**5 分钟**只够那 Release 那一族**看**一眼
          #        （`release view` 与那 `release create`**就是**那两件**轻**的）
          #**上传** **要**把那 17 GB 推上去（06 本轮核过）：
          #        · 那产物字节 = **17004320575**（17.00 GB）
          #        · 那拆成几块 = **8** 块、每块 **2147482624**（前七块）+ **1971942207**（末块）
          #        · 那上传**约** **8.6 MB/s**
          #**上传**实际用了 **1089 秒 = 18.15 分钟**
          #          （11:23:50 到 11:41:59）
          #**终态**是**退出码 124**（是那 `timeout` 的退出码）
          #**八块** **都上传了**（八条 `[ok] 那 ….part-0N … 字节`）
          #`.part-06` 与那 `.part-07`**没**传上去
          #**后果**（06 本机实读那 job log 核过、Lead 本机复核成立）：
          #        · 那 Release 上那 `src1f2d9e624963`只有 **6** 块 / 12884895744
          #        ·**完整**那一份（`.zip` 不带 `.part-NN`）**0** 个
          #**判据**是「那一趟要多久、时限够不够」那一个事实上
          #        （它**不**由「那一件是什么」顶掉）
          #**处置**是「那时限**跟**那三个量走」
          #**三个量**仓内**都**算得出来：
          #      · 那**字节数**`stat -c %s`
          #      · 那**块数**`ceil(字节 / 2147482624)`
          #      · 那**上传**约 **8.6 MB/s**
          #**时限** **不**写死、它**按**那三个量**算**
          #**下限**还是那 300 秒（**轻**的 Release 那一族**别**等那么久）
          #**上限**不许超过那 job 那一族那 360 分钟
          #        （job timeout-minutes = **360**、**时限** **要**比它**小**）
          _pkg_bytes=0
          for _f in "$PW"/*.part-* "$PW"/"$ASSET"; do
            [ -f "$_f" ] || continue
            _b="$(stat -c %s "$_f" 2>/dev/null || echo 0)"
            _pkg_bytes=$((_pkg_bytes + _b))
          done
          _parts=0
          for _f in "$PW"/*.part-*; do [ -f "$_f" ] && _parts=$((_parts + 1)); done
          [ "$_parts" -gt 0 ] || _parts=1
          #**上传速率**约 **8.6 MB/s**（17004320575 字节用了 1089 秒算的）
          _rate=8600000
          _need=$(( _pkg_bytes / _rate ))
          [ "$_need" -gt 0 ] || _need=1
          #**余量**是那三成（网络**慢**一点**也**够）
          _need=$(( _need * 13 / 10 ))
          _need=$(( _need + 60 ))
          GH_TIMEOUT=300
          [ "$_need" -gt "$GH_TIMEOUT" ] && GH_TIMEOUT="$_need"
          #**上限**不许超过那 job 那一族那 360 分钟（**多出来**的**报缺**）
          _cap=$(( 360 * 60 - 120 ))
          if [ "$GH_TIMEOUT" -gt "$_cap" ]; then
            echo "::error title=那上传时限超过那 job 那一族的上限::算出来的是 $GH_TIMEOUT 秒、上限是 $_cap 秒"
            echo "**产物**太大、它**放不进**那一趟、按 C-05 报缺"
            exit 1
          fi
          echo "[notice] 那产物 = $_pkg_bytes 字节 / $_parts 块**上传时限** = $GH_TIMEOUT 秒"
          if ! timeout "$GH_TIMEOUT" gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            timeout "$GH_TIMEOUT" gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "llvmtoolchain（工具筐）— $TAG" \
              --notes "编译一次、长期复用的工具链预制品（clang / lld / binutils）。构建链优先复用本件，不再重复编译。BUILD.md 记录了这份预制品的编译依据。"
          fi
          timeout "$GH_TIMEOUT" gh release upload "$TAG" "$PW"/* --repo "${{ github.repository }}" --clobber
          echo "[ok] 已发布 $TAG"

      - name: 发布 llvmtoolchain 件到对象存储
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::发布轮需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          #  缺陷名（C-102）**那一格只发那**完整**那一份、它**发不出去**、**分片** **也**没发**
          # 旧版是 `for f in dist/component-llvm-*.zip; do … upload-qiniu.js "$f" …`
          #**超了**上限的那一件**已经拆**成那几块了、**完整**那一份**不存在**
          #        （`rm -f "$PW/$ASSET"`**已经**把它**拿掉**了、几块**在**那 `$PW` 里）
          #`dist/component-llvm-*.zip`**匹配不到**那**完整**那一份
          #**分片** **不**在那 `dist/` 里、它们**从来没**上那 CDN
          #**下游**那 manifest 给的那 URL**是**那**完整**那一份
          #        （`publish-component-manifest.js:353` `url: BASE + '/component/' + f`）
          #**三份**全 **404**（06 本轮核出、Lead 本机实读成立）
          #**分片** **也没上**那 CDN
          #**判据**是「那发布轮发出去的那些，下游拿不拿得到」那一个事实上
          #**处置**：**分片**与那**清单** **也**上那 CDN
          #**完整**那一份**先** **拼**回来再发（下游**按**那 URL**直接**取）
          #**分片** **也**发上去、下游**也能** **自己拼**
          #**没拆**的那一件（**小**的）**照旧** **直接**发
          _pub_base="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")"
          #**完整**那一份：**拆过**的先**拼**回来、**没拆**的直接用
          _whole=""
          if ls dist/component-llvm-*.zip >/dev/null 2>&1; then
            _whole="$(ls dist/component-llvm-*.zip | head -1)"
          elif ls "$PW"/"$ASSET".part-* >/dev/null 2>&1; then
            echo "[notice] 那 $ASSET**拆**成了 $(ls "$PW"/"$ASSET".part-* | wc -l) 块、**完整**那一份**先拼**回来"
            _whole="dist/$ASSET"
            : > "$_whole"
            for _part in "$PW"/"$ASSET".part-*; do
              cat "$_part" >> "$_whole"
            done
            echo "[notice]**拼**回来 = $(stat -c %s "$_whole") 字节"
          fi
          if [ -z "$_whole" ] || [ ! -f "$_whole" ]; then
            echo "::error title=没有件可发::那 dist 里**没有**那完整件、$PW 里**也没有**那分片"
            exit 1
          fi
          QINIU_PUBLIC_BASE="$_pub_base" \
            node scripts/publish/upload-qiniu.js "$_whole" "component/$(basename "$_whole")" --cache-control=31536000
          #**分片**与那**清单** **也**上那 CDN（下游**也能** **自己拼**回来）
          for _part in "$PW"/"$ASSET".part-* "$PW"/"$ASSET".parts.txt; do
            [ -f "$_part" ] || continue
            QINIU_PUBLIC_BASE="$_pub_base" \
              node scripts/publish/upload-qiniu.js "$_part" "component/$(basename "$_part")" --cache-control=31536000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: component-llvm
          path: dist/component-llvm-*.zip
          retention-days: 90
