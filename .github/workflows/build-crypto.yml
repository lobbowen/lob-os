name: Build crypto

# crypto 那一件的**固化产物由 build-openssl.yml 那一趟产出** ——
# 而这一份只是**核**它：它现在不再自己拆包、不再自己打包、不再自己上传。
#
# 缺陷名（C-102）**同一个 libcrypto.so 字节有两条生成路径**：
#   原来：openssl 那一件一次 make 出 libssl.so 与 libcrypto.so，
#   而这一份（build-crypto.yml）**从 openssl 的固化包里拆出来**重打一个包并上传到 base-crypto；
#   而那一拆一打发生在**另一次流水线**（buildRun 不同）——
#   读数：base-crypto 筐里 crypto-openssl+3.6.3+ndk30.0.16248370+api35+src90fa46a13608.zip
#   那一份的 component-meta.json 里 buildRun=40030227900，
#   而 base-openssl 筐里 src90fa46a13608 那一份的 meta 里 buildRun=40030215774 —— 两者不同。
#   => 而「一份产物里那几件要保证同一次构建」（01 今天 S81/S82 裁的是甲）这一格不成立。
#   => 而 lead 今天裁：保留 crypto 作为独立一件，改由 openssl 那一趟同源产出。
#
# 而这一份的读者 scripts/toolchain/piece-workflow-name.sh:13 已经写着
#   crypto) echo "build-openssl.yml" ;;   # crypto 由 openssl 连带产出
#   而它的读者是 fetch-prebuilt-pieces.sh:121 —— 与本件现在做的事是同一件事。
#
# 所以这一份做的事：
#   1. dispatch build-openssl.yml（那一趟会同时产出并上传 crypto 那一件）；
#   2. 等 base-crypto 筐里那一件到位并**核它的内容**（meta 与形状）。
on:
  workflow_dispatch: {}

concurrency:
  group: crypto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          set -euo pipefail
          bash scripts/toolchain/piece-key.sh crypto

      - name: 触发 openssl 那一趟（crypto 由它连带产出）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[crypto] 这一件不再自己编 —— crypto 由 openssl 那一趟同源产出"
          gh workflow run build-openssl.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "[crypto] 已 dispatch build-openssl.yml"

      - name: 等 base-crypto 筐里那一件到位，并核它的内容
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          echo "[crypto] 等 tag=$TAG asset=$ASSET"
          WAIT_S=3600
          WAITED=0
          while true; do
            if bash scripts/toolchain/reusable-asset.sh "$TAG" "$ASSET"; then
              echo "[crypto] 到位（等了 ${WAITED}s）"
              break
            fi
            if [ "$WAITED" -ge "$WAIT_S" ]; then
              echo "::error title=等了 ${WAIT_S}s base-crypto 里还没有那一件::tag=$TAG asset=$ASSET"
              exit 1
            fi
            echo "[crypto] 还没就位，等 30s（已等 ${WAITED}s / 上限 ${WAIT_S}s）"
            sleep 30
            WAITED=$((WAITED + 30))
          done

      - name: 核那一件的内容（形状 + 构建标识与 openssl 那一份同源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          OTAG="$(bash scripts/toolchain/cache-key.sh tag openssl)"
          OASSET="$(bash scripts/toolchain/cache-key.sh asset openssl)"
          mkdir -p dist
          bash scripts/toolchain/fetch-release-asset.sh "$TAG" "$ASSET" dist
          bash scripts/toolchain/fetch-release-asset.sh "$OTAG" "$OASSET" dist
          rm -rf c-pkg o-pkg && mkdir -p c-pkg o-pkg
          unzip -qq -o "dist/$ASSET" -d c-pkg
          unzip -qq -o "dist/$OASSET" -d o-pkg
          # 形状对账（只看包本身）。
          bash scripts/verify/verify-piece-shape.sh "dist/$ASSET" library
          # 构建标识：crypto 那一份必须与 openssl 那一份**同一格** ——
          #   而那正是「同一次构建」那一格要验的（buildSha 与 buildRun 两格都要相等）。
          for f in c-pkg/component-meta.json o-pkg/component-meta.json; do
            [ -f "$f" ] || { echo "::error title=包里没有 component-meta.json::$f 不在"; exit 1; }
          done
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("c-pkg/component-meta.json","utf8"));
            const o=JSON.parse(fs.readFileSync("o-pkg/component-meta.json","utf8"));
            const keys=["buildSha","buildRun"];
            let bad=0;
            for(const k of keys){
              const cv=String(c[k]||""), ov=String(o[k]||"");
              const same=cv!=="" && cv===ov;
              console.log("[crypto] "+k+": crypto="+cv+" openssl="+ov+" => "+(same?"同":"不同"));
              if(!same) bad=1;
            }
            if(bad){console.error("::error title=crypto 与 openssl 不是同一次构建::那两格 buildSha 与 buildRun 必须逐字相同");process.exit(1);}
          '
          echo "[ok] crypto 与 openssl 是同一次构建（buildSha 与 buildRun 两格逐字相同）"

      - name: 失败现场（Job Summary，不裁剪）
        if: always()
        run: bash scripts/toolchain/collect-piece-diag.sh crypto

      - name: 上传失败现场（Summary 在 API 上不好取回，artifact 才拿得到）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece-diag
          path: |
            ${{ runner.temp }}/piece-diag-*.md
            work/*/*.log
          if-no-files-found: ignore
