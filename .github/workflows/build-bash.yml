name: Build bash

# 这一条编 bash，产出固化到 Release。APK 链只取用，不现场编。
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recipes/build-piece-bash.sh'
      - 'scripts/recipes/piece-env.sh'
      - 'scripts/toolchain/locate-ndk.sh'
      - 'scripts/toolchain/cache-ndk.sh'
      - 'scripts/toolchain/fetch-pinned.sh'
      - 'scripts/toolchain/cache-key.sh'
      - 'scripts/registry/read-node-versions.sh'
      - 'container/native/**'
      - 'scripts/component-sources.json'
      - 'scripts/node-versions.json'
      - '.github/workflows/build-bash.yml'
    tags:
      - 'base-bash'
  workflow_dispatch: {}

concurrency:
  group: bash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识
        id: uwkey
        run: |
          set -euo pipefail
          echo "tag=$(bash scripts/toolchain/cache-key.sh tag bash)" >> "$GITHUB_OUTPUT"
          echo "asset=::error title=该件不在这条链上::bash 由 build-apk.yml 编（APK 内置 + OTA 补丁），
::error::不在 build-component 矩阵里 —— 要给它算预制品 key 得先在 build-apk 那边接上。" >> "$GITHUB_OUTPUT"

      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "[ok] 固化产物已存在（tag=$TAG）"
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 编 bash
        if: steps.reuse.outputs.hit != 'yes'
        run: bash scripts/recipes/build-piece-bash.sh

      - name: 固化到 Release 预制品
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          STAGE="dist/.cap-${{ github.run_id }}"
          mkdir -p "$STAGE"
          for f in container/app/src/main/jniLibs/arm64-v8a/*; do
            [ -f "$f" ] && cp -f "$f" "$STAGE/"
          done
          ( cd "$STAGE" && find . -type f -exec touch -h -t 198001010000.00 {} + )
          ( cd "$STAGE" && tar czf "../cap-${ASSET}.tar.gz" . )
          SHA="$(sha256sum "dist/cap-${ASSET}.tar.gz" | cut -c1-12)"
          NAME="cap-${ASSET}-${SHA}.tar.gz"
          mv "dist/cap-${ASSET}.tar.gz" "dist/$NAME"
          sha256sum "dist/$NAME" | cut -d' ' -f1 > "dist/$NAME.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "bash 固化产物" --notes "编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 已固化 $NAME 到 $TAG"
