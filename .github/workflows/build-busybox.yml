name: Build busybox

# 这一条编 busybox，产出固化到 Release。APK 链只取用，不现场编。
on:
  # ── 触发方式 ──
  #
  # 只有两种：
  #   workflow_dispatch  手动 —— 「我现在要构建这一件」
  #   tag                发布轮（os-release-*）
  #
  # 不再由 push 触发。件是独立的：改一份文档、改另一个件的钉值，
  # 都不该重建这一件；反过来真的要重建时，dispatch 这一条就够了。
  # 之前靠 paths 白名单过滤，结果是「改一个共享脚本触发 16 个」——
  # 白名单只能防漏，不能防多，而且漏与多都是错。
  workflow_dispatch:
    inputs:
      #  缺陷名（C-102）**那形态那一族逐字**只**能**从**那 vars **那一族**进**、=> 而而那 vars 逐字**没有**设**就**是**那 PIE
      #    => 而而那**开关**逐字**传不进去**、=> 而而那 initramfs **那一层**逐字**要**那**静态**的**那一份**
      #    => 而而那**它**们**逐字是**那**两**件**事**（那一边 = 「那**开关**逐字**传**没**传**进**去**」、
      #      而而那另一边 = 「那**产物**逐字**是**那**静态**的**还是**那 PIE** 的**」）。
      #  => 而那**处置**：=> 而那**形态**逐字**由**那**手动**这一趟**的**输入**给**（=> 而那 **dispatch** 逐字**能**带**它**）、
      #    => 而而那 vars **那一族**逐字**还是**那条**路**（=> 而而那**它**逐字**不**是**第二条路**、=> 而而那**它**逐字**同一件**事**）。
      #  => 而按 C-104：=> 而那**形态**那一族逐字**只有**一条路。
      static:
        description: '那形态逐字是那静态（1）还是那 PIE（0）=> 而那静态的逐字是那 initramfs 那一层要的那一份'
        type: string
        default: '0'

concurrency:
  group: busybox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 算本件的固化标识（key / tag / asset）
        id: uwkey
        run: |
          # 三样都由 scripts/toolchain/piece-key.sh 单点算出 —— 11 个 workflow 都调它，
          # 免得各自留一份空壳（此前 11 个的这段是空的，tag/asset 为空串，
          # 「已固化就复用」从未命中过）。
          bash scripts/toolchain/piece-key.sh busybox
      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          # ★ 判据必须验**内容**：包里要有 component-meta.json，否则装配器读不了。
          #   只判「Release 存在」或「资产名存在」是不够的 —— asset 名只含
          #   id/deps/ndk/api，不含格式版本，改版前后同名。于是旧格式的包
          #   被当成新的继续用，CI 报 success 而包是空的。
          #   （同类错误还有：Mirror 判「写没写」被 truncate 掩盖；
          #     verify-apk-native 与内核同用一套错判据，两边一起错查不出。）
          # ★ 这一格验的是**包里那个入口文件**（busybox 那一件的入口是 bin/ 下那批 applet 之一）。
          #   07 今天核到：原来这一行写的是 lib/libbusybox.so —— 而今天 entry 按形态算，
          #   busybox 那一件的程序那一侧是 bin/ 下的 applet 软链（entry=bin/<某个>）。
          if bash scripts/toolchain/reusable-asset.sh "$TAG" "$ASSET" ; then
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 编 busybox
        if: steps.reuse.outputs.hit != 'yes'
#  缺陷名（C-102）**这一条逐字**只**产出**那 PIE **那一个**、=> 而而那 initramfs **那一层**逐字**要**那**静态**的**那一个**
#    => 而而它治**的**是「那 APK **那一件**逐字**带**的**是**哪**一个**形态**」。
#    => 而那**成因**：=> 而那安装器逐字**从**那 APK 的那 jniLibs **那一族**落**位**、
#       => 而那**它**逐字**认**的是**那 APK **那一件**里**有**什么**、=> 而而它逐字**不**看**那设备**上**已经**装**了什么**、
#       => 而而那**它**逐字**挡不住**那安装器（=> 而那 LOBOS_BUSYBOX_STATIC **那一族**逐字**只**管**那编**那一族**）。
#    => 而那**处置**：=> 而那 **形态**逐字**由**那 **LOBOS_BUSYBOX_STATIC** **那个**环境变量**给**、
#       => 而那**默认**逐字**还是**那 PIE（=> 而那**现行**的**那一件**逐字**是**那 PIE、
#       => 而那**静态**的**那一个**逐字**是**那 initramfs **那一层**要**的**那一份**）。
#    => 而按 C-104：=> 而那**形态**那一族逐字**只有**一条路（=> 而那 LOBOS_BUSYBOX_STATIC **那一族**就是**它**）。
        env:
          #  => 而那**形态**逐字**由**这**一个**环境变量**给**（=> 而那**默认**逐字**还是**那 PIE）。
          LOBOS_BUSYBOX_STATIC: ${{ inputs.static || vars.LOBOS_BUSYBOX_STATIC || '0' }}
        run: bash scripts/recipes/build-native-busybox.sh

      - name: 验形态（包自描述：库还是程序）
        if: steps.reuse.outputs.hit != 'yes'
        run: |
          set -euo pipefail
          PKG="$(ls dist/component-*.zip 2>/dev/null | head -1 || true)"
          [ -n "$PKG" ] || { echo "::error title=没有标准包::build 脚本没产出 dist/component-*.zip"; exit 1; }
          # 只看产物本身：包里带 piece-shape.json（构建期算的形态），
          # 现场用 readelf 复算一遍，两路对账。
          # ★ 期望 **program**（不是 mixed）—— 01 今天裁的 S32/S33 之后 busybox 那一件：
          #   本体那份字节按形态是程序（ET_EXEC、无 PT_INTERP）=> 它落 bin/ => lib/ 下**没有**库形态的字节
          #   => 按 kind 那把尺（程序形态的份数 / 库形态的份数）=> kind=program、libraries=[]
          #   （那 17 条命令名是它的 argv[0] 派生物，都指向同一份字节。）
          bash scripts/verify/verify-piece-shape.sh "$PKG" program

      - name: 固化标准件包到 Release
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="${{ steps.uwkey.outputs.asset }}"
          TAG="${{ steps.uwkey.outputs.tag }}"
          # 标准包由 build-bundle-*.sh 的 emit_piece 产出（dist/component-<id>-<版本>-<sha>.zip），
          # 里面带 component-meta.json —— 装配器只读包，不查外部清单。
          PKG="$(ls dist/component-*.zip 2>/dev/null | head -1 || true)"
          [ -n "$PKG" ] || { echo "::error title=没有标准包::build 脚本没产出 dist/component-*.zip"; ls -la dist/ | head; exit 1; }
          # 上传名用 cache-key.sh 给的那个 —— 复用判据与取件都按它，两处必须同源。
          # 之前这里用包名、判据那里用 deps 名，对不上，于是每轮都判为「未固化」。
          cp -f "$PKG" "dist/$ASSET"
          sha256sum "dist/$ASSET" | cut -d' ' -f1 > "dist/$ASSET.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "busybox 固化产物" --notes "标准件包（带 component-meta.json）。编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 包=$(basename "$PKG")  上传名=$ASSET → $TAG"
      - name: 失败现场（Job Summary，不裁剪）
        if: always()
        run: bash scripts/toolchain/collect-piece-diag.sh busybox

      - name: 上传失败现场（Summary 在 API 上不好取回，artifact 才拿得到）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece-diag
          path: |
            ${{ runner.temp }}/piece-diag-*.md
            work/*/*.log
          if-no-files-found: ignore
