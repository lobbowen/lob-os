name: Build jq (musl)

on:
  workflow_dispatch: {}

concurrency:
  group: jq-musl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 NDK 缓存
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/actions-setup-ndk
          key: ndk-30.0.16248370-${{ runner.os }}-${{ runner.arch }}

      - name: 取 NDK（命中则 0 下载）
        run: bash scripts/toolchain/cache-ndk.sh

      - name: 定位 NDK（比对钉值 + 验证 clang 真能跑）
        run: bash scripts/toolchain/locate-ndk.sh

      - name: 构建最小 musl sysroot（纯 C 件，不含 C++）
        run: bash scripts/toolchain/musl-sysroot-min.sh

      - name: 算本件的固化标识（musl ABI）
        id: uwkey
        env:
          LOBOS_ABI: musl
        run: |
          bash scripts/toolchain/piece-key.sh jq

      - name: 已固化就复用（不重编）
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.uwkey.outputs.tag }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          if bash scripts/toolchain/reusable-asset.sh "$TAG" "$ASSET" ; then
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[miss] 无可复用预制品（tag=$TAG asset=$ASSET）→ 本轮编译"
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      - name: 编 zlib (musl)
        if: steps.reuse.outputs.hit != 'yes'
        env:
          LOBOS_ABI: musl
        run: |
          set -euo pipefail
          export LOBOS_NDK="$(cd "$(dirname "$CC")/../../../../.." && pwd)"
          export LOBOS_MUSL_SYSROOT="$PWD/work/musl-sysroot-min"
          bash scripts/recipes/build-musl-piece.sh jq
          mkdir -p dist
          cp -f work/component-jq-*.zip dist/component-jq.zip

      - name: 验形态（包自描述：库还是程序）
        if: steps.reuse.outputs.hit != 'yes'
        run: |
          set -euo pipefail
          PKG="$(ls dist/component-*.zip 2>/dev/null | head -1 || true)"
          [ -n "$PKG" ] || { echo "::error title=没有标准包::build 脚本没产出 dist/component-*.zip"; exit 1; }
          bash scripts/verify/verify-piece-shape.sh "$PKG" program

      - name: 固化标准件包到 Release
        if: steps.reuse.outputs.hit != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="${{ steps.uwkey.outputs.asset }}"
          ASSET="${{ steps.uwkey.outputs.asset }}"
          TAG="${{ steps.uwkey.outputs.tag }}"
          PKG="$(ls dist/component-*.zip 2>/dev/null | head -1 || true)"
          [ -n "$PKG" ] || { echo "::error title=没有标准包::build 脚本没产出 dist/component-*.zip"; ls -la dist/ | head; exit 1; }
          cp -f "$PKG" "dist/$ASSET"
          sha256sum "dist/$ASSET" | cut -d' ' -f1 > "dist/$ASSET.sha256"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1             || gh release create "$TAG" --repo "${{ github.repository }}"                  --title "zlib 固化产物" --notes "标准件包（带 component-meta.json）。编一次，后续轮次直接取用"
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256"             --repo "${{ github.repository }}" --clobber
          echo "[ok] 包=$(basename "$PKG")  上传名=$ASSET → $TAG"

      - name: 固化产物与当前代码一致（构建标识那一族）
        if: steps.reuse.outputs.hit != 'yes'
        run: |
          set -euo pipefail
          bash scripts/verify/check-frozen-freshness.sh "dist/${{ steps.uwkey.outputs.asset }}"
      - name: 失败现场（Job Summary，不裁剪）
        if: always()
        run: bash scripts/toolchain/collect-piece-diag.sh jq

      - name: 上传构建日志（诊断用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: work/*/build.log

      - name: 上传失败现场（Summary 在 API 上不好取回，artifact 才拿得到）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piece-diag
          path: |
            ${{ runner.temp }}/piece-diag-*.md
            work/*/*.log
          if-no-files-found: ignore
