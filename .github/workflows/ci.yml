name: CI

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'scripts/**'
      - 'tools/**'
      - 'components/**'
      - '.github/native-assets.txt'
      - '.github/native-capabilities.txt'
      - '.github/workflows/**'
      - 'version.json'
  pull_request:
    paths:
      - 'container/**'
      - 'scripts/**'
      - 'tools/**'
      - 'components/**'
      - '.github/native-assets.txt'
      - '.github/native-capabilities.txt'
      - '.github/workflows/**'
      - 'version.json'
  workflow_dispatch: {}

jobs:

  norms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 规范 — 不许上注释
        run: node scripts/comment-gate.js

      - name: 规范 — DO 跑不通：不许启用设备所有者
        run: node scripts/do-gate.js

      - name: 结构 — 宿主 Kotlin（括号/字符串配平自检）
        run: node tools/ktcheck.js

      - name: 语法 — 引擎与脚本（node --check）
        run: |
          set -euo pipefail
          for f in container/engine/src/*.js container/engine/src/bridge/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: API 规范自洽（方法表与 ApiSpec 不得漂移）
        run: node tools/check-api-spec.js

      - name: 双份 canonical 必须逐字一致（跨边界签名/验签）
        run: node tools/check-dual-canonical.js

      - name: 生成器自洽 — 原生件清单可由注册表重算
        run: |
          set -euo pipefail
          node scripts/gen-native-assets.js
          git diff --exit-code -- .github/native-assets.txt .github/native-capabilities.txt

      - name: Android 常量白名单 — AccessibilityEvent.TYPE_* 必须已验证
        run: node tools/check-android-consts.js

      - name: 外部类型 import 齐备（外部类必须显式 import）
        run: node tools/check-imports.js

      - name: 已删符号零引用（删字段后不留悬空引用）
        run: node tools/check-dead-refs.js

      - name: tools/ 不得硬编码绝对路径
        run: node tools/check-tool-paths.js

      - name: ApiSpec 三表须与方法表自洽（scope/idempotence/别名不得脱节）
        run: node tools/check-spec-tables.js

      - name: 构建物类目须自洽（三分区在位、件声明与脚本对得上、runtime 类不入 APK）
        run: node tools/check-components.js

      - name: 门禁须有调用点（文档与仓内不许留永不执行的口子）
        run: node tools/check-gate-callers.js

      - name: 桥协议三处声明须一致（引擎 / 壳侧下界 / version.json）
        run: node tools/check-protocol-version.js

      - name: 程序端口段须够大且合法（免得被无声改小）
        run: node tools/check-port-range.js

      - name: 快应用包结构须与规范一致（前后端同包 + 前端三必需文件）
        run: node tools/check-quickapp-package.js

      - name: 桌面入口须与规范一致（三档状态取平台事实 + 摘除能力如实）
        run: node tools/check-desktop-icon.js

      - name: 快应用能力面须自洽（http 段读法 + 配对三步 + 作用域闸）
        run: node tools/check-quickapp-capability.js

      - name: 跨包符号须真实存在（写了包限定名就必须有那个声明）
        run: node tools/check-cross-refs.js

      - name: 大件落位须流式（整包进 ByteArray 会 OOM）
        run: node tools/check-big-artifact.js

      - name: 页面注册须用全局 Page()（export default 会灰屏）
        run: node tools/check-page-registration.js

      - name: dimina 官方规范须遵守（path 入口 / zip 名 / 不打补丁）
        run: node tools/check-dimina-spec.js

      - name: Kotlin 误用须为零（扩展函数当成员调用这类只有编译才炸）
        run: node tools/check-kotlin-misuse.js

      - name: 控制面板须齐（入口 + 同进程调用 + installer 放行）
        run: node tools/check-panel.js

      - name: node 原生依赖须落到 $ORIGIN（linker 阶段失败判据）
        run: node tools/check-node-native-deps.js

      - name: OTA 序列号须按通道+程序隔离（跨通道判重放判据）
        run: node tools/check-ota-sequence-scope.js

      - name: 能力探针须齐备且可执行
        run: |
          set -euo pipefail
          echo "── 列出全部探针（每颗件都要有，判据与探针都要够长）──"
          node tools/run-verify-probes.js
          echo "── 语法与可执行性（x64 runner 上 arm64 件跑不了，只验探针本身不坏）──"
          node tools/run-verify-probes.js --exec || {
            echo "::warning title=部分探针在 x64 runner 上跑不了::件是 arm64；这里只保证探针语法与执行器没问题。真跑在 arm64 机器上做（node tools/run-verify-probes.js --exec）"
            exit 0
          }
